// The alignment of two paths, which rewrites them into one structure so that the engine can
// interpolate the `d` of one into the other.
//
// Chromium and firefox interpolate `d` only between two paths of the same commands (see
// *Findings*), so a square and a circle have to be written with one sequence of commands
// before a morph can carry one into the other. Every segment becomes a cubic Bézier, the two
// paths get as many subpaths, and paired subpaths get as many segments, cut at the vertices of
// both by their fraction of the length, after the starting point and the direction that make
// the points travel least. Nothing here reads the DOM, so the alignment can be tested on
// numbers alone.

/** How many points of a segment its length and its points along the length are read from. */
const PATH_SAMPLES = 8;

/** How many points of a subpath the travel of an alignment is measured on. */
const TRAVEL_SAMPLES = 64;

/** How many starting points of a closed subpath are tried before the best one is refined. */
const START_CANDIDATES = 128;

/**
 * How close, as a fraction of the length, a vertex of one subpath has to come to a vertex of
 * its partner for the two to be one cut, so that no segment is cut into a sliver.
 */
const SAME_CUT = 1e-3;

/** A length, in user units, below which a segment or a subpath has none. */
const NO_LENGTH = 1e-6;

/** How many numbers each command of SVG path data takes. */
const ARITY = { M: 2, L: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, T: 2, A: 7, Z: 0 };

/** A command letter or a number of SVG path data. */
const PATH_TOKEN = /[MmLlHhVvCcSsQqTtAaZz]|[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g;

/**
 * Two paths rewritten into one structure, as the path data of each, or `null` when one of the
 * two cannot be read or draws nothing.
 *
 * Both are written as absolute cubic Béziers with the same number of subpaths and the same
 * number of segments in each, closed with `Z` in the same places, so that the engine
 * interpolates the one into the other number by number. Each keeps its geometry.
 * The path data may be an attribute or a computed `path("..")`.
 * `filled` says for each of the two whether it has a fill, which decides how an open subpath
 * is closed when its partner is closed (see `closedLike`).
 */
function alignPaths(from, to, filled = [false, false]) {
  const a = parsePath(from);
  const b = parsePath(to);
  if (a === null || b === null || a.length === 0 || b.length === 0) {
    return null;
  }
  const [before, after] = pairSubpaths(a.map(measure), b.map(measure));
  const aligned = before.map((subpath, index) => {
    const other = after[index];
    if (subpath.closed === other.closed) {
      return alignSubpaths(subpath, other);
    }
    return subpath.closed
      ? alignSubpaths(subpath, closedLike(other, filled[1]))
      : alignSubpaths(closedLike(subpath, filled[0]), other);
  });
  return [
    writePath(aligned.map(([one, , closed]) => [one, closed])),
    writePath(aligned.map(([, other, closed]) => [other, closed])),
  ];
}

/**
 * An open subpath as a closed one that looks the same, for a partner that is closed.
 *
 * A path with a fill fills an open subpath as if a line closed it, so that line closes it.
 * Without a fill, the subpath runs back along itself, which strokes the same apart from its
 * two ends, where the turn is a join and not a cap. A line then opens into the outline of
 * its partner on both sides at once, and an outline folds onto a line.
 */
function closedLike(subpath, filled) {
  const { segments } = subpath;
  const [x0, y0] = segments[0];
  const [x1, y1] = segments[segments.length - 1].slice(6);
  const back = filled
    ? [line(x1, y1, x0, y0)]
    : segments.map(reversedCubic).reverse();
  return measure({ segments: [...segments, ...back], closed: true });
}

/**
 * The command letters of path data in upper case, which two paths share exactly when the
 * engine interpolates the one into the other.
 */
function pathCommands(data) {
  return (data.match(/[MmLlHhVvCcSsQqTtAaZz]/g) ?? []).join("").toUpperCase();
}

/**
 * The subpaths of path data, each as its segments and whether it is closed, or `null` for
 * data with an arc or a number missing.
 *
 * A segment is a cubic Bézier as the eight coordinates of its four points. A line becomes a
 * cubic whose control points sit on it at a third and two thirds, and a quadratic is raised
 * to a cubic exactly. Typst writes no arcs, so an arc is not read. A segment without length
 * is dropped, and so is a subpath without segments, such as the `M 0 0` that starts every
 * path typst writes. A subpath that ends where it starts is closed, with `Z` or without it.
 */
function parsePath(data) {
  const text = data.trim().replace(/^path\(\s*["']?/, "").replace(/["']?\s*\)$/, "");
  const tokens = text.match(PATH_TOKEN) ?? [];
  const subpaths = [];
  let current = null;
  let x = 0;
  let y = 0;
  let startX = 0;
  let startY = 0;
  // The second control point of the previous segment, for the reflection of `S` and `T`.
  let cubic = null;
  let quadratic = null;
  const begin = (px, py) => {
    current = { segments: [], closed: false };
    subpaths.push(current);
    startX = px;
    startY = py;
  };
  const add = (segment) => {
    if (current === null) {
      begin(x, y);
    }
    const [x0, y0] = segment;
    if (segment.some((value, index) => Math.abs(value - (index % 2 === 0 ? x0 : y0)) > 0)) {
      current.segments.push(segment);
    }
    x = segment[6];
    y = segment[7];
  };
  let index = 0;
  let command = null;
  while (index < tokens.length) {
    if (/[A-Za-z]/.test(tokens[index])) {
      command = tokens[index];
      index += 1;
    } else if (command === null || command === "Z" || command === "z") {
      return null;
    }
    const upper = command.toUpperCase();
    const relative = command !== upper;
    const count = ARITY[upper];
    const values = tokens.slice(index, index + count).map(Number);
    if (values.length < count || values.some(Number.isNaN) || upper === "A") {
      return null;
    }
    index += count;
    const ox = relative ? x : 0;
    const oy = relative ? y : 0;
    let nextCubic = null;
    let nextQuadratic = null;
    if (upper === "M") {
      x = values[0] + ox;
      y = values[1] + oy;
      begin(x, y);
      // Further pairs after a move are lines.
      command = relative ? "l" : "L";
    } else if (upper === "Z") {
      if (current !== null) {
        if (Math.hypot(x - startX, y - startY) > 0) {
          add(line(x, y, startX, startY));
        }
        current.closed = true;
        current = null;
      }
      x = startX;
      y = startY;
    } else if (upper === "L" || upper === "H" || upper === "V") {
      const nx = upper === "V" ? x : values[0] + ox;
      const ny = upper === "H" ? y : values[upper === "V" ? 0 : 1] + oy;
      add(line(x, y, nx, ny));
    } else if (upper === "C" || upper === "S") {
      const [x1, y1] =
        upper === "C"
          ? [values[0] + ox, values[1] + oy]
          : cubic === null
            ? [x, y]
            : [2 * x - cubic[0], 2 * y - cubic[1]];
      const rest = upper === "C" ? values.slice(2) : values;
      const x2 = rest[0] + ox;
      const y2 = rest[1] + oy;
      add([x, y, x1, y1, x2, y2, rest[2] + ox, rest[3] + oy]);
      nextCubic = [x2, y2];
    } else {
      const [qx, qy] =
        upper === "Q"
          ? [values[0] + ox, values[1] + oy]
          : quadratic === null
            ? [x, y]
            : [2 * x - quadratic[0], 2 * y - quadratic[1]];
      const rest = upper === "Q" ? values.slice(2) : values;
      const ex = rest[0] + ox;
      const ey = rest[1] + oy;
      add([
        x,
        y,
        x + ((qx - x) * 2) / 3,
        y + ((qy - y) * 2) / 3,
        ex + ((qx - ex) * 2) / 3,
        ey + ((qy - ey) * 2) / 3,
        ex,
        ey,
      ]);
      nextQuadratic = [qx, qy];
    }
    cubic = nextCubic;
    quadratic = nextQuadratic;
  }
  return subpaths
    .filter((subpath) => subpath.segments.length > 0)
    .map(({ segments, closed }) => {
      const [sx, sy] = segments[0];
      const last = segments[segments.length - 1];
      const ends = Math.hypot(last[6] - sx, last[7] - sy) < NO_LENGTH * 1000;
      return { segments, closed: closed || ends };
    });
}

/** A straight line as a cubic Bézier. */
function line(x0, y0, x1, y1) {
  const dx = (x1 - x0) / 3;
  const dy = (y1 - y0) / 3;
  return [x0, y0, x0 + dx, y0 + dy, x1 - dx, y1 - dy, x1, y1];
}

/** The point of a cubic Bézier at a parameter. */
function cubicAt(segment, t) {
  const u = 1 - t;
  const [a, b, c, d] = [u * u * u, 3 * u * u * t, 3 * u * t * t, t * t * t];
  return [
    a * segment[0] + b * segment[2] + c * segment[4] + d * segment[6],
    a * segment[1] + b * segment[3] + c * segment[5] + d * segment[7],
  ];
}

/** A cubic Bézier cut in two at a parameter, by de Casteljau. */
function splitCubic(segment, t) {
  const mix = (i, j, s) => [
    segment[i] + (segment[j] - segment[i]) * s,
    segment[i + 1] + (segment[j + 1] - segment[i + 1]) * s,
  ];
  const p01 = mix(0, 2, t);
  const p12 = mix(2, 4, t);
  const p23 = mix(4, 6, t);
  const p012 = [p01[0] + (p12[0] - p01[0]) * t, p01[1] + (p12[1] - p01[1]) * t];
  const p123 = [p12[0] + (p23[0] - p12[0]) * t, p12[1] + (p23[1] - p12[1]) * t];
  const p = [p012[0] + (p123[0] - p012[0]) * t, p012[1] + (p123[1] - p012[1]) * t];
  return [
    [segment[0], segment[1], ...p01, ...p012, ...p],
    [...p, ...p123, ...p23, segment[6], segment[7]],
  ];
}

/** The part of a cubic Bézier between two parameters. */
function cubicPart(segment, t0, t1) {
  if (t1 <= t0) {
    const [x, y] = cubicAt(segment, t0);
    return [x, y, x, y, x, y, x, y];
  }
  const right = t0 <= 0 ? segment : splitCubic(segment, t0)[1];
  const along = t0 >= 1 ? 1 : (t1 - t0) / (1 - t0);
  return along >= 1 ? right : splitCubic(right, along)[0];
}

/** A cubic Bézier run the other way. */
function reversedCubic(segment) {
  return [
    segment[6],
    segment[7],
    segment[4],
    segment[5],
    segment[2],
    segment[3],
    segment[0],
    segment[1],
  ];
}

/**
 * A subpath with the points its length is read from.
 *
 * `xs`, `ys` and `lengths` hold `PATH_SAMPLES` points per segment and the length of the
 * polyline through them up to each, and `vertices` the fraction of the length at which each
 * segment starts, with one more for the end.
 */
function measure({ segments, closed }) {
  const count = segments.length * PATH_SAMPLES + 1;
  const xs = new Float64Array(count);
  const ys = new Float64Array(count);
  const lengths = new Float64Array(count);
  [xs[0], ys[0]] = segments[0];
  let k = 1;
  for (const segment of segments) {
    for (let step = 1; step <= PATH_SAMPLES; step += 1) {
      [xs[k], ys[k]] = cubicAt(segment, step / PATH_SAMPLES);
      lengths[k] = lengths[k - 1] + Math.hypot(xs[k] - xs[k - 1], ys[k] - ys[k - 1]);
      k += 1;
    }
  }
  const total = lengths[count - 1];
  const vertices = segments.map((_, index) =>
    total > 0 ? lengths[index * PATH_SAMPLES] / total : index / segments.length,
  );
  vertices.push(1);
  return { segments, closed, xs, ys, lengths, total, vertices };
}

/** The point at a fraction of the length of a measured subpath, going round a closed one. */
function pointAlong(subpath, fraction) {
  const { xs, ys, lengths, total } = subpath;
  const wrapped = subpath.closed ? fraction - Math.floor(fraction) : fraction;
  const target = Math.min(Math.max(wrapped, 0), 1) * total;
  let low = 0;
  let high = lengths.length - 1;
  while (high - low > 1) {
    const middle = (low + high) >> 1;
    if (lengths[middle] <= target) {
      low = middle;
    } else {
      high = middle;
    }
  }
  const span = lengths[high] - lengths[low];
  const s = span > 0 ? (target - lengths[low]) / span : 0;
  return [xs[low] + (xs[high] - xs[low]) * s, ys[low] + (ys[high] - ys[low]) * s];
}

/**
 * The parameter of a segment at a fraction of the length of its subpath, held to the
 * segment.
 */
function parameterAt(subpath, segment, fraction) {
  const { lengths, total } = subpath;
  const first = segment * PATH_SAMPLES;
  const target = fraction * total;
  if (target <= lengths[first]) {
    return 0;
  }
  for (let step = 1; step <= PATH_SAMPLES; step += 1) {
    const end = lengths[first + step];
    if (target <= end) {
      const start = lengths[first + step - 1];
      const s = end > start ? (target - start) / (end - start) : 0;
      return (step - 1 + s) / PATH_SAMPLES;
    }
  }
  return 1;
}

/** The index of the segment that holds a fraction of the length of its subpath. */
function segmentAt(subpath, fraction) {
  const { vertices } = subpath;
  let low = 0;
  let high = vertices.length - 1;
  while (high - low > 1) {
    const middle = (low + high) >> 1;
    if (vertices[middle] <= fraction) {
      low = middle;
    } else {
      high = middle;
    }
  }
  return low;
}

/** The area a closed subpath encloses, with the sign of its winding. */
function signedArea({ xs, ys }) {
  let area = 0;
  for (let k = 1; k < xs.length; k += 1) {
    area += xs[k - 1] * ys[k] - xs[k] * ys[k - 1];
  }
  return area / 2;
}

/** The middle of the box around the subpaths of a path. */
function middle(subpaths) {
  let [left, top, right, bottom] = [Infinity, Infinity, -Infinity, -Infinity];
  for (const { xs, ys } of subpaths) {
    for (let k = 0; k < xs.length; k += 1) {
      left = Math.min(left, xs[k]);
      right = Math.max(right, xs[k]);
      top = Math.min(top, ys[k]);
      bottom = Math.max(bottom, ys[k]);
    }
  }
  return [(left + right) / 2, (top + bottom) / 2];
}

/**
 * The subpaths of two paths in pairs, as two lists of one length.
 *
 * The subpaths are paired by their length, the longest with the longest, which pairs the
 * outline of a shape with the outline and a hole with a hole. A subpath without a partner is
 * paired with a point, at the place in the box of the other path that the middle of the subpath
 * has in the box of its path, so that it grows out of nothing or shrinks into nothing there.
 */
function pairSubpaths(a, b) {
  const longest = (list) => [...list].sort((one, other) => other.total - one.total);
  const before = longest(a);
  const after = longest(b);
  const [ax, ay] = middle(a);
  const [bx, by] = middle(b);
  const point = (subpath, dx, dy) => {
    const [x, y] = middle([subpath]);
    const at = [x + dx, y + dy];
    return measure({ segments: [[...at, ...at, ...at, ...at]], closed: subpath.closed });
  };
  for (let index = before.length; index < after.length; index += 1) {
    before.push(point(after[index], ax - bx, ay - by));
  }
  for (let index = after.length; index < before.length; index += 1) {
    after.push(point(before[index], bx - ax, by - ay));
  }
  return [before, after];
}

/**
 * Two subpaths, both open or both closed, with one number of segments, as the segments of
 * each and whether both are closed.
 *
 * Two closed subpaths are run the same way round, which is the sign of their area, or the one
 * turns itself inside out on the way, and the second starts where the points travel least.
 * Two open ones run the way that travels least. Both are then cut at the vertices of both,
 * which leaves every piece within one segment of each side.
 */
function alignSubpaths(a, b) {
  if (a.total < NO_LENGTH || b.total < NO_LENGTH) {
    return collapsed(a, b);
  }
  let other = b;
  if (a.closed) {
    const [areaA, areaB] = [signedArea(a), signedArea(b)];
    const options =
      areaA * areaB === 0 ? [b, reversedSubpath(b)] : [areaA * areaB < 0 ? reversedSubpath(b) : b];
    const best = startOf(a, options);
    other = opened(best.subpath, best.start);
  } else {
    const reversed = reversedSubpath(b);
    other = travelOf(a, reversed, 0) < travelOf(a, b, 0) ? reversed : b;
  }
  const [first, second] = correspond(a, other);
  return [first, second, a.closed];
}

/** Two subpaths of which one has no length, as the other and a point repeated as often. */
function collapsed(a, b) {
  const point = (subpath) => {
    const [x, y] = subpath.segments[0];
    return [x, y, x, y, x, y, x, y];
  };
  if (a.total < NO_LENGTH && b.total < NO_LENGTH) {
    return [[point(a)], [point(b)], a.closed && b.closed];
  }
  const long = a.total < NO_LENGTH ? b : a;
  const still = long.segments.map(() => point(a.total < NO_LENGTH ? a : b));
  const closed = long.closed;
  return a.total < NO_LENGTH ? [still, long.segments, closed] : [long.segments, still, closed];
}

/** A measured subpath run the other way. */
function reversedSubpath({ segments, closed }) {
  return measure({ segments: segments.map(reversedCubic).reverse(), closed });
}

/**
 * The squared distance the points of one subpath travel to those of another, at as many
 * places along the length of each, with the second starting at a fraction of its length.
 *
 * The distance is squared so that a translation of one subpath against the other adds the
 * same amount at every start and in either direction, which leaves the best of them where
 * the two sit in their user spaces.
 */
function travelOf(a, b, start) {
  let sum = 0;
  for (let k = 0; k < TRAVEL_SAMPLES; k += 1) {
    const fraction = a.closed ? (k + 0.5) / TRAVEL_SAMPLES : k / (TRAVEL_SAMPLES - 1);
    const [ax, ay] = pointAlong(a, fraction);
    const [bx, by] = pointAlong(b, fraction + start);
    sum += (ax - bx) ** 2 + (ay - by) ** 2;
  }
  return sum;
}

/**
 * Where a closed subpath starts so that the points of another closed subpath travel least to
 * it, as the fraction of its length and the subpath, among the options of its direction.
 *
 * `START_CANDIDATES` starts at equal distances are tried, and the best is refined between its
 * neighbours by a golden section search. A start close to a vertex is moved onto the vertex,
 * so that no segment is cut into a sliver there.
 */
function startOf(reference, options) {
  let best = null;
  for (const subpath of options) {
    const cost = (start) => travelOf(reference, subpath, start);
    let found = 0;
    let lowest = Infinity;
    for (let k = 0; k < START_CANDIDATES; k += 1) {
      const value = cost(k / START_CANDIDATES);
      if (value < lowest) {
        lowest = value;
        found = k / START_CANDIDATES;
      }
    }
    let low = found - 1 / START_CANDIDATES;
    let high = found + 1 / START_CANDIDATES;
    const ratio = (Math.sqrt(5) - 1) / 2;
    for (let round = 0; round < 24; round += 1) {
      const left = high - ratio * (high - low);
      const right = low + ratio * (high - low);
      if (cost(left) < cost(right)) {
        high = right;
      } else {
        low = left;
      }
    }
    let start = (low + high) / 2;
    start -= Math.floor(start);
    for (const vertex of subpath.vertices) {
      const gap = Math.abs(vertex - start);
      if (Math.min(gap, 1 - gap) < SAME_CUT) {
        start = vertex % 1;
      }
    }
    const value = cost(start);
    if (best === null || value < best.value) {
      best = { subpath, start, value };
    }
  }
  return best;
}

/** A closed subpath opened at a fraction of its length, as a subpath that starts there. */
function opened(subpath, start) {
  const { segments } = subpath;
  const index = segmentAt(subpath, start);
  const t = parameterAt(subpath, index, start);
  const [head, tail] = splitCubic(segments[index], t);
  const parts = [tail, ...segments.slice(index + 1), ...segments.slice(0, index), head];
  const lengthOf = (segment) =>
    Math.hypot(segment[6] - segment[0], segment[7] - segment[1]) +
    Math.hypot(segment[2] - segment[0], segment[3] - segment[1]) +
    Math.hypot(segment[4] - segment[6], segment[5] - segment[7]);
  return measure({ segments: parts.filter((part) => lengthOf(part) > NO_LENGTH), closed: false });
}

/**
 * Two subpaths that start together and end together cut into as many pieces.
 *
 * The cuts are the vertices of both, by their fraction of the length, and a vertex of one
 * side close to one of the other is one cut at the vertex of each, so that no segment is cut
 * into a sliver. Each piece then lies within one segment of each side.
 */
function correspond(a, b) {
  const cuts = [];
  for (const [side, subpath] of [["a", a], ["b", b]]) {
    for (const vertex of subpath.vertices.slice(1, -1)) {
      cuts.push({ at: vertex, a: vertex, b: vertex, side });
    }
  }
  cuts.sort((one, other) => one.at - other.at);
  const merged = [{ a: 0, b: 0 }];
  let last = null;
  for (const cut of cuts) {
    if (last !== null && last.side !== null && last.side !== cut.side && cut.at - last.at < SAME_CUT) {
      last[cut.side] = cut[cut.side];
      last.side = null;
    } else {
      last = { ...cut };
      merged.push(last);
    }
  }
  merged.push({ a: 1, b: 1 });
  const pieces = (subpath, side) => {
    const found = [];
    for (let k = 0; k + 1 < merged.length; k += 1) {
      const from = merged[k][side];
      const to = merged[k + 1][side];
      const segment = segmentAt(subpath, (from + to) / 2);
      found.push(
        cubicPart(
          subpath.segments[segment],
          parameterAt(subpath, segment, from),
          parameterAt(subpath, segment, to),
        ),
      );
    }
    return found;
  };
  return [pieces(a, "a"), pieces(b, "b")];
}

/** Subpaths as path data of absolute cubic Béziers, rounded to a ten thousandth. */
function writePath(subpaths) {
  const round = (value) => Math.round(value * 10000) / 10000 || 0;
  const parts = [];
  for (const [segments, closed] of subpaths) {
    parts.push(`M ${round(segments[0][0])} ${round(segments[0][1])}`);
    for (const segment of segments) {
      parts.push(`C ${segment.slice(2).map(round).join(" ")}`);
    }
    if (closed) {
      parts.push("Z");
    }
  }
  return parts.join(" ");
}

// The morph, which carries what the outgoing and the incoming region share from its old place
// to its new one, and hands the region over as the crossfade does.
//
// A match is a pair of elements, one in each region, that show the same ink.
// The outgoing element is translated from its place to the place of the incoming one, and
// the incoming element from the place of the outgoing one to its place, so the two are at one
// position at every moment. `handOver` in `boundaries.js` then draws a pair whose two elements
// are identical once, by hiding the element of the upper rendering, and lets the upper element
// of any other pair fade over the opaque lower one, which shows the interpolation of the two.
// The morph therefore clones nothing.
// A resize is a match of two paths of one structure whose geometry differs, and both paths
// also animate their `d` and stroke width from the outgoing geometry to the incoming one, so
// the two have one geometry at every moment as well. A shape morph is a match of two paths of
// different structures, which `alignPaths` rewrites into one structure before they are
// animated in the same way.
//
// The translations and resizes are routes and never states. They are animations over a
// `translate`, a `d` and a `stroke-width` whose inline style stays unset, so a slide at rest
// carries none,
// and the geometry a later step reads is the geometry of the layout once they are over.
// Until then, `slide.morphed` holds every element a morph is still moving, which is what a
// later step needs to know to read the layout under them and to settle them.
// A hidden element takes no route, and `slide.standIns` holds the element that is shown in its
// place, which is where a later step reads what the hidden element shows (see `displayed`).

/**
 * The largest number of differences between the glyphs of two regions for which the glyphs
 * are matched.
 *
 * The diff takes time in proportion to the number of glyphs times the number of
 * differences, and a region beyond the bound crossfades its glyphs, which is always correct.
 * See *Performance* for the measurement the number comes from.
 */
const MORPH_DIFFERENCES = 400;

/** A distance, in CSS pixels, below which a match has not moved. */
const MORPH_STILL = 0.01;

/** No `translate`, as a keyframe states it. */
const AT_REST = "0px 0px";

/** The elements that draw ink themselves, which are the candidates of a match below tags. */
const INK = new Set(["use", "path", "image"]);

/**
 * The elements whose content is never drawn where it sits: definitions, the paths of a clip
 * and the outlines of a glyph. The walk for ink does not enter them, wherever typst puts them.
 */
const NOT_INK = new Set([
  "clipPath",
  "defs",
  "filter",
  "linearGradient",
  "marker",
  "mask",
  "pattern",
  "radialGradient",
  "symbol",
]);

/**
 * The attributes of a `<path>` that shape its ink, apart from its `d`.
 *
 * The stroke width is among them because a route does not scale a stroke, and the fill rule
 * because two copies under two rules cover two areas. The colors are not, because the copy of
 * one color fading over the opaque copy of the other shows the interpolation of the two.
 */
const PATH_SHAPE = [
  "fill-rule",
  "stroke-width",
  "stroke-linecap",
  "stroke-linejoin",
  "stroke-miterlimit",
  "stroke-dasharray",
  "stroke-dashoffset",
];

/**
 * Whether the engine animates the `d` of a path, which a resize needs.
 *
 * Chromium 151 and firefox 153 do, and webkit 26.5 does not, so webkit crossfades the shapes a
 * resize would carry. See *Findings*.
 */
const RESIZES = CSS.supports("d", 'path("M 0 0")');

/** The CSS properties a resize animates, besides the `translate` of its route. */
const RESHAPED = ["d", "stroke-width"];

/** The command letters of SVG path data, which a number never contains. */
const COMMANDS = /[MmZzLlHhVvCcSsQqTtAa]/g;

/** A number in SVG path data. */
const NUMBER = /[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g;

/** How far apart the linear parts of two matrices may be and still count as one. */
const SAME_FRAME = 1e-6;

/**
 * The attributes of an element that color its ink, which two identical copies share.
 *
 * The match leaves them out of its key, so a pair may differ in them, and such a pair is drawn
 * as two copies rather than one.
 */
const PAINT = ["fill", "fill-opacity", "stroke", "stroke-opacity", "opacity"];

/**
 * Plan the translations of the matches in an epoch stack a morph carries, on `timing`, and
 * return the matches, each with whether its two elements are identical copies.
 *
 * Nothing here touches an opacity, which `handOver` plans after this.
 * The two renderings of the stack are the outgoing and the incoming region.
 */
function morphStack(effects, slide, { stack, from, to, record }, timing) {
  const outgoing = stack.renderings[from];
  const incoming = stack.renderings[to];
  if (outgoing === undefined || incoming === undefined) {
    return [];
  }
  // The screen matrix of every parent read so far, because the glyphs of a run share one.
  const screen = new Map();
  const labels = new Map();
  const pairs = matches(slide, outgoing, incoming, new Set(record.names), screen).map((pair) =>
    measured(slide, pair, screen),
  );
  for (const pair of pairs) {
    pair.same = identical(pair, { outgoing, incoming, labels, screen });
  }
  for (const match of rigid(pairs, slide.morphed)) {
    carry(effects, slide, match, timing, { stack, from, to, screen });
  }
  return pairs;
}

/**
 * Whether the two elements of a match draw exactly the same ink at every moment of its route.
 *
 * The two copies of such a match are at one place and have one geometry all the way, so
 * drawing one of them shows the same pixels as drawing both.
 * That needs the same paint, the same user space up to a translation, and the same tags above
 * both, because the display state of a tag goes on its slot and two tags may be shown
 * differently.
 * A tag match also needs the same content, and an ink match of two paths needs the same
 * shape, unless its route animates every attribute in which the two shapes differ.
 */
function identical({ outgoing, incoming, shape }, regions) {
  if (
    outgoing.localName !== incoming.localName ||
    labelsAbove(outgoing, regions.outgoing, regions.labels) !==
      labelsAbove(incoming, regions.incoming, regions.labels) ||
    !sameFrame(outgoing, incoming, regions.screen)
  ) {
    return false;
  }
  if (!INK.has(outgoing.localName)) {
    const before = outgoing.children;
    const after = incoming.children;
    return (
      before.length === after.length &&
      Array.from(before).every((child, index) => child.isEqualNode(after[index]))
    );
  }
  const same = (name) => outgoing.getAttribute(name) === incoming.getAttribute(name);
  if (!PAINT.every(same)) {
    return false;
  }
  if (inkKey(outgoing) === inkKey(incoming)) {
    return true;
  }
  return (
    shape !== null &&
    PATH_SHAPE.every((name) => same(name) || Object.hasOwn(shape.end, name)) &&
    RESHAPED.every((name) => same(name) || Object.hasOwn(shape.end, name))
  );
}

/**
 * The element that shows an element in its place, which is the element itself unless a
 * hand-over that is still running hid it behind a partner.
 *
 * A hidden element takes no route, so what it shows is what its partner shows, which is
 * where a step that interrupts the hand-over starts from.
 * `slide.shownBy` holds the partners of the hand-overs before this step.
 */
function displayed(slide, element) {
  const found = slide.shownBy.get(element);
  if (found === undefined || !found.holder.getAnimations().some(ours)) {
    return element;
  }
  return found.partner;
}

/**
 * Whether a labelled group moves as one when a morph matches it.
 *
 * A tag and a named region do, and so does the rendering of one state of a `per-subslide`,
 * which is the same in both regions. An unnamed region is a box around content and not a
 * separate thing, so what it holds is matched in its place.
 */
function movesAsOne(label) {
  return !label.startsWith("animo-") || stackLabel(label)?.kind === "subslide";
}

/**
 * The matches of two renderings of a region, as pairs of an outgoing and an incoming element,
 * with whether the pair is a resize.
 *
 * First the tag matches: two labelled groups of one name, paired by their index among the
 * groups of that name in document order. A tag the boundary changes is not one, and neither is
 * a group that holds such a tag, because the content of both differs, and what they hold is
 * matched in its place. Then the ink matches: the glyphs, paths and images outside every
 * matched group, paired by a longest common subsequence of their keys in document order, so a
 * box beside a word keeps its place among the letters. Then the resizes, which pair the paths
 * left over between the same two ink matches by their structure (see `resizes`), and last the
 * shape morphs, which pair the one path a changed tag holds on each side (see `shapeMorphs`).
 * Every match has the same clips above it in both regions.
 */
function matches(slide, outgoing, incoming, changed, screen) {
  const pairs = [];
  const claimed = new Set();
  const clips = new Map();
  const above = (element, region) =>
    clipsAbove(slide, element, { region, laidOut: region === incoming }, clips, screen);
  const candidates = (region) => {
    const groups = Array.from(region.querySelectorAll("[data-typst-label]"));
    const holding = new Set();
    for (const group of groups) {
      if (changed.has(group.dataset.typstLabel)) {
        for (let node = group.parentElement; node !== region; node = node.parentElement) {
          holding.add(node);
        }
      }
    }
    return groups.filter(
      (group) =>
        movesAsOne(group.dataset.typstLabel) &&
        !changed.has(group.dataset.typstLabel) &&
        !holding.has(group),
    );
  };
  const partners = new Map();
  for (const group of candidates(incoming)) {
    const name = group.dataset.typstLabel;
    if (!partners.has(name)) {
      partners.set(name, []);
    }
    partners.get(name).push(group);
  }
  const seen = new Map();
  // Document order puts a group before the groups inside it, so a group inside a matched
  // one is found to be claimed before it could be matched itself.
  for (const group of candidates(outgoing)) {
    const name = group.dataset.typstLabel;
    const index = seen.get(name) ?? 0;
    seen.set(name, index + 1);
    const partner = partners.get(name)?.[index];
    if (
      partner === undefined ||
      within(group, claimed) ||
      within(partner, claimed) ||
      above(group, outgoing) !== above(partner, incoming)
    ) {
      continue;
    }
    claimed.add(group);
    claimed.add(partner);
    pairs.push([group, partner, false]);
  }
  const before = ink(outgoing, claimed);
  const after = ink(incoming, claimed);
  // Each key as a small number, so the diff compares numbers and not long strings.
  const numbers = new Map();
  const numbered = (element, region) => {
    const key = `${inkKey(element)}|${above(element, region)}`;
    let number = numbers.get(key);
    if (number === undefined) {
      number = numbers.size;
      numbers.set(key, number);
    }
    return number;
  };
  const common = commonSubsequence(
    before.map((element) => numbered(element, outgoing)),
    after.map((element) => numbered(element, incoming)),
    MORPH_DIFFERENCES,
  );
  if (common === null) {
    return pairs;
  }
  for (const [i, j] of common) {
    pairs.push([before[i], after[j], false]);
  }
  if (RESIZES) {
    const labels = new Map();
    const structure = (region) => (element) =>
      `${pathStructure(element)}|${above(element, region)}|${labelsAbove(element, region, labels)}`;
    const found = resizes(before, after, common, structure(outgoing), structure(incoming));
    const taken = new Set(common.flatMap(([i, j]) => [before[i], after[j]]));
    for (const [from, to] of found) {
      taken.add(from);
      taken.add(to);
      if (sameFrame(from, to, screen)) {
        pairs.push([from, to, true]);
      }
    }
    const left = (list) => list.filter((element) => !taken.has(element));
    for (const [from, to] of shapeMorphs(left(before), left(after), changed, outgoing, incoming)) {
      if (above(from, outgoing) === above(to, incoming) && sameFrame(from, to, screen)) {
        pairs.push([from, to, true]);
      }
    }
  }
  return pairs;
}

/**
 * The shape morphs among the ink the other matches left over, as pairs of an outgoing and an
 * incoming path.
 *
 * A tag the boundary changes that holds exactly one path left over in each region pairs the
 * two, whatever their structure, because a tag that holds one shape before and one after is
 * a clear statement that the one becomes the other. Any other path left over is crossfaded,
 * because two paths of different structures give no other clue that they belong together.
 * A path belongs to the nearest tag above it, which is the tag around its region when there
 * is none inside the region, and the tags inside one region are paired by name and by index,
 * as the tag matches are.
 */
function shapeMorphs(before, after, changed, outgoing, incoming) {
  const held = (leftovers, region) => {
    const index = new Map();
    const seen = new Map();
    for (const group of region.querySelectorAll("[data-typst-label]")) {
      const name = group.dataset.typstLabel;
      seen.set(name, (seen.get(name) ?? 0) + 1);
      index.set(group, `${name} ${seen.get(name)}`);
    }
    const found = new Map();
    for (const path of leftovers) {
      const tag = holder(path, region);
      if (path.localName === "path" && tag !== null && changed.has(tag.dataset.typstLabel)) {
        const key = index.get(tag) ?? tag.dataset.typstLabel;
        found.set(key, [...(found.get(key) ?? []), path]);
      }
    }
    return found;
  };
  const partners = held(after, incoming);
  const pairs = [];
  for (const [key, paths] of held(before, outgoing)) {
    const other = partners.get(key);
    if (paths.length === 1 && other?.length === 1) {
      pairs.push([paths[0], other[0]]);
    }
  }
  return pairs;
}

/**
 * The tag an element belongs to: the nearest labelled group above it that Animo did not
 * create, inside its region or, failing that, the nearest labelled group above the
 * region when that is a tag, or `null`.
 */
function holder(element, region) {
  let node = element.parentElement;
  while (node !== null && node !== region) {
    const label = node.dataset.typstLabel;
    if (label !== undefined && !label.startsWith("animo-")) {
      return node;
    }
    node = node.parentElement;
  }
  node = region.parentElement?.closest("[data-typst-label]") ?? null;
  return node !== null && !node.dataset.typstLabel.startsWith("animo-") ? node : null;
}

/**
 * The resizes among the ink an ink match left over, as pairs of an outgoing and an incoming
 * path.
 *
 * The leftovers between two consecutive ink matches, or before the first or after the last,
 * are a hunk, and the paths of one hunk are paired by a longest common subsequence of their
 * structure, which `beforeKey` and `afterKey` give. A path is therefore paired only with one
 * between the same two matched neighbours, so a fraction bar that widens between its numerator
 * and its denominator is paired, and a box removed in one place is not paired with one added
 * in another.
 */
function resizes(before, after, common, beforeKey, afterKey) {
  const pairs = [];
  let i = 0;
  let j = 0;
  for (const [end, otherEnd] of [...common, [before.length, after.length]]) {
    const outgoing = before.slice(i, end).filter((element) => element.localName === "path");
    const incoming = after.slice(j, otherEnd).filter((element) => element.localName === "path");
    if (outgoing.length > 0 && incoming.length > 0) {
      const found = commonSubsequence(
        outgoing.map(beforeKey),
        incoming.map(afterKey),
        MORPH_DIFFERENCES,
      );
      for (const [a, b] of found ?? []) {
        pairs.push([outgoing[a], incoming[b]]);
      }
    }
    i = end + 1;
    j = otherEnd + 1;
  }
  return pairs;
}

/**
 * What a path is made of apart from its numbers, as a string that two paths share when the
 * engine can interpolate one into the other.
 *
 * Chromium 151 and firefox 153 interpolate `d` between two paths with the same commands in the
 * same order, number by number, and flip from one to the other halfway through otherwise (see
 * *Findings*). The stroke attributes other than the width are part of it, because the width
 * is animated beside the `d` and the others are not.
 */
function pathStructure(path) {
  const d = path.getAttribute("d") ?? "";
  const commands = (d.match(COMMANDS) ?? []).join("");
  const numbers = (d.match(NUMBER) ?? []).length;
  const shape = PATH_SHAPE.filter((name) => name !== "stroke-width").map(
    (name) => path.getAttribute(name) ?? "",
  );
  return `${commands} ${numbers} ${shape.join(" ")}`;
}

/**
 * The labels of the groups above an element inside its region, as a string.
 *
 * Two paths are a resize only under the same labels, so a shape in a tag is not resized into
 * one outside it, which is how an author keeps two shapes apart.
 */
function labelsAbove(element, region, labels) {
  const parent = element.parentElement;
  if (parent === null || parent === region) {
    return "";
  }
  let found = labels.get(parent);
  if (found === undefined) {
    found = labelsAbove(parent, region, labels);
    const label = parent.dataset.typstLabel;
    if (label !== undefined) {
      found = `${found}${label};`;
    }
    labels.set(parent, found);
  }
  return found;
}

/**
 * Whether two elements draw in user spaces that differ by a translation only.
 *
 * A resize animates the `d` of each path towards the other's, which is the right geometry only
 * when the two user spaces have one scale and one orientation, and the route's `translate`
 * carries what is left. Everything typst lays out differs by a translation, unless a `scale`
 * or a `rotate` sits above one of the two and not above the other.
 */
function sameFrame(outgoing, incoming, screen) {
  const frame = (element) => {
    const own = element.transform.baseVal.consolidate();
    const parent = matrixOf(element.parentNode, screen);
    return own === null ? parent : parent.multiply(own.matrix);
  };
  const a = frame(outgoing);
  const b = frame(incoming);
  const size = Math.max(Math.abs(a.a), Math.abs(a.b), Math.abs(a.c), Math.abs(a.d));
  return ["a", "b", "c", "d"].every(
    (name) => Math.abs(a[name] - b[name]) <= SAME_FRAME * size,
  );
}

/** Whether an element is a matched group or sits inside one. */
function within(element, claimed) {
  for (let node = element; node !== null; node = node.parentElement) {
    if (claimed.has(node)) {
      return true;
    }
  }
  return false;
}

/** The glyphs, paths and images of a region in document order, leaving out claimed groups. */
function ink(region, claimed) {
  const found = [];
  const walk = (node) => {
    for (const child of node.children) {
      if (claimed.has(child) || NOT_INK.has(child.localName)) {
        continue;
      }
      if (INK.has(child.localName)) {
        found.push(child);
      } else {
        walk(child);
      }
    }
  };
  walk(region);
  return found;
}

/**
 * What an element draws, as a string that two elements share when they show the same ink.
 *
 * Typst writes a glyph as a `<use>` of a definition named by a hash of its outline, a shape as
 * a `<path>` whose `d` starts at a local origin, and an image as an `<image>` without a
 * position, so in each case the place is in a transform and the key leaves it out.
 * The colors are left out of every key. See *Findings*.
 */
function inkKey(element) {
  if (element.localName === "use") {
    return `g:${element.href.baseVal}`;
  }
  if (element.localName === "image") {
    const size = ["width", "height"].map((name) => element.getAttribute(name));
    return `i:${element.href.baseVal} ${size.join(" ")}`;
  }
  const shape = PATH_SHAPE.map((name) => element.getAttribute(name) ?? "");
  return `p:${element.getAttribute("d")} ${shape.join(" ")}`;
}

/**
 * The clips above an element inside its region, as a string, with the place of each on the
 * screen.
 *
 * A `translate` carries a clip on the element itself but not the clip of an ancestor, which
 * stays where it is and cuts a moving element off at its edge (see *Findings*). Two copies
 * under two clips would then not sum to one opaque element, so a match needs the same clips
 * at the same places on both sides. A clip is named by its `clip-path`, whose id is a hash of
 * the clip's path. An element of the incoming region is placed as it is laid out, which leaves
 * out a morph translation that is still running above the clip.
 */
function clipsAbove(slide, element, side, clips, screen) {
  const parent = element.parentElement;
  if (parent === null || parent === side.region) {
    return "";
  }
  let found = clips.get(parent);
  if (found === undefined) {
    found = clipsAbove(slide, parent, side, clips, screen);
    const clip = parent.getAttribute("clip-path");
    if (clip !== null) {
      const { a, b, c, d, e, f } = matrixOf(parent, screen);
      const shift = side.laidOut ? running(slide, parent, screen) : { x: 0, y: 0 };
      const place = [a, b, c, d, e - shift.x, f - shift.y]
        .map((value) => value.toFixed(2))
        .join(" ");
      found = `${found}${clip} ${place};`;
    }
    clips.set(parent, found);
  }
  return found;
}

/**
 * A longest common subsequence of two lists of strings, as pairs of indices, or `null` when
 * the lists differ in more than `limit` places.
 *
 * The diff is of the Myers kind, which walks the edit graph one difference at a time and so
 * takes time in proportion to the length of the lists times the number of differences. The
 * common head and tail are paired first, because an edit of a paragraph leaves most of it on
 * either side of the change.
 */
function commonSubsequence(a, b, limit) {
  let head = 0;
  while (head < a.length && head < b.length && a[head] === b[head]) {
    head += 1;
  }
  let tail = 0;
  while (
    tail < a.length - head &&
    tail < b.length - head &&
    a[a.length - 1 - tail] === b[b.length - 1 - tail]
  ) {
    tail += 1;
  }
  const middle = shortestEdit(
    a.slice(head, a.length - tail),
    b.slice(head, b.length - tail),
    limit,
  );
  if (middle === null) {
    return null;
  }
  const pairs = [];
  for (let k = 0; k < head; k += 1) {
    pairs.push([k, k]);
  }
  for (const [i, j] of middle) {
    pairs.push([head + i, head + j]);
  }
  for (let k = tail; k > 0; k -= 1) {
    pairs.push([a.length - k, b.length - k]);
  }
  return pairs;
}

/**
 * The common elements along a shortest edit of `a` into `b`, as pairs of indices in order, or
 * `null` when the edit needs more than `limit` insertions and deletions.
 *
 * `furthest[k]` is how far along `a` the walk got on diagonal `k = x - y`, and one copy of it
 * is kept per number of differences, which is what the walk back reads.
 */
function shortestEdit(a, b, limit) {
  const n = a.length;
  const m = b.length;
  const most = Math.min(n + m, limit);
  const offset = most + 1;
  const furthest = new Int32Array(2 * most + 3);
  const trace = [];
  for (let d = 0; d <= most; d += 1) {
    trace.push(furthest.slice());
    for (let k = -d; k <= d; k += 2) {
      const down = k === -d || (k !== d && furthest[offset + k - 1] < furthest[offset + k + 1]);
      let x = down ? furthest[offset + k + 1] : furthest[offset + k - 1] + 1;
      let y = x - k;
      while (x < n && y < m && a[x] === b[y]) {
        x += 1;
        y += 1;
      }
      furthest[offset + k] = x;
      if (x >= n && y >= m) {
        return walkBack(trace, offset, n, m);
      }
    }
  }
  return null;
}

/** The diagonal steps of the edit `shortestEdit` found, from its end back to its start. */
function walkBack(trace, offset, n, m) {
  const pairs = [];
  let x = n;
  let y = m;
  for (let d = trace.length - 1; d >= 0; d -= 1) {
    const furthest = trace[d];
    const k = x - y;
    const down = k === -d || (k !== d && furthest[offset + k - 1] < furthest[offset + k + 1]);
    const previous = down ? k + 1 : k - 1;
    const px = furthest[offset + previous];
    const py = px - previous;
    while (x > px && y > py) {
      x -= 1;
      y -= 1;
      pairs.push([x, y]);
    }
    x = px;
    y = py;
  }
  return pairs.reverse();
}

/**
 * A match with the distance it travels on the screen: from where the outgoing element is
 * displayed to where the incoming element is laid out.
 *
 * Both are what the page shows before the step, so a morph that interrupts another starts
 * from where the other one had got to. An incoming element is laid out where it is displayed
 * less the morph translations still running on it and above it, which the step is about to
 * end.
 * An outgoing element that a hand-over hid is displayed where its partner is, and `standing`
 * is how far that is from its place, which its route starts from. It is `null` otherwise.
 */
function measured(slide, [outgoing, incoming, resize], screen) {
  const shown = displayed(slide, outgoing);
  const start = origin(slide, shown, screen);
  const end = origin(slide, incoming, screen);
  const shift = running(slide, incoming, screen);
  let standing = null;
  if (shown !== outgoing) {
    const place = origin(slide, outgoing, screen);
    standing = { x: start.x - place.x, y: start.y - place.y };
  }
  return {
    outgoing,
    incoming,
    delta: { x: end.x - shift.x - start.x, y: end.y - shift.y - start.y },
    shape: reshaped(slide, shown, outgoing, incoming, resize),
    standing,
  };
}

/**
 * How a match changes its geometry on the way, as the `start` and `end` of the properties a
 * resize animates, or `null` for a match that keeps its geometry.
 *
 * Both paths start at what the outgoing one shows, which `shown` shows in its place, and end at
 * the `d` of the incoming one.
 * Each path states its `d` in its user space from a local origin, and `sameFrame` holds,
 * so the two have one geometry at every moment, and the route's `translate` puts them at one
 * place. An exact match whose outgoing path an earlier resize is still changing goes on from
 * what that path shows as well.
 * When the two `d` have different commands, which is the case for a shape morph and for a path
 * that a shape morph is still changing, both are rewritten into one structure first, because
 * the engine interpolates only between paths of the same commands. An open subpath is closed
 * as its fill closes it (see `alignPaths`).
 *
 * A property is animated only where it changes, because chromium 151 stops drawing the other
 * properties of an effect beside a keyframe property that is equal at both ends (see
 * *Findings*), and `d` is equal at both ends in another spelling when only the stroke width
 * changes.
 */
function reshaped(slide, shown, outgoing, incoming, resize) {
  const changing = slide.morphed.get(shown)?.shape !== undefined;
  if (!resize && !changing) {
    return null;
  }
  const names = RESHAPED.filter((name) => {
    const before = outgoing.getAttribute(name);
    const after = incoming.getAttribute(name);
    return before !== null && after !== null && (changing || before !== after);
  });
  const value = (name) => {
    const after = incoming.getAttribute(name).trim();
    return name === "d" ? `path("${after}")` : `${after}px`;
  };
  const start = showing(shown, names);
  const end = Object.fromEntries(names.map((name) => [name, value(name)]));
  if (names.includes("d") && pathCommands(start.d) !== pathCommands(end.d)) {
    const filled = (path) => path.getAttribute("fill") !== "none";
    const aligned = alignPaths(start.d, end.d, [filled(outgoing), filled(incoming)]);
    if (aligned === null) {
      delete start.d;
      delete end.d;
    } else {
      start.d = `path("${aligned[0]}")`;
      end.d = `path("${aligned[1]}")`;
    }
  }
  return Object.keys(end).length === 0 ? null : { start, end };
}

/** The morph translations still running on an element and above it, on the screen. */
function running(slide, element, screen) {
  const total = { x: 0, y: 0 };
  for (const node of morphedChain(slide, element)) {
    const offset = onScreen(node, translation(node), screen);
    total.x += offset.x;
    total.y += offset.y;
  }
  return total;
}

/**
 * Where an element puts its origin on the screen, in CSS pixels.
 *
 * `getScreenCTM()` includes the `translate` of the element itself in all three engines, and the `x`
 * and `y` of a `<use>` are an offset inside it. See *Findings*.
 * A glyph, a path or an image that no morph is moving has no `translate`, so its matrix is its
 * parent's followed by its `transform` attribute, and the glyphs of a run share the
 * parent's.
 */
function origin(slide, element, screen) {
  const x = element.x?.baseVal?.value ?? 0;
  let point = new DOMPoint(x, element.y?.baseVal?.value ?? 0);
  if (INK.has(element.localName) && !slide.morphed.has(element)) {
    const own = element.transform.baseVal.consolidate();
    if (own !== null) {
      point = point.matrixTransform(own.matrix);
    }
    point = point.matrixTransform(matrixOf(element.parentNode, screen));
  } else {
    point = point.matrixTransform(element.getScreenCTM());
  }
  return { x: point.x, y: point.y };
}

/** The screen matrix of an element, read once per step. */
function matrixOf(element, screen) {
  let found = screen.get(element);
  if (found === undefined) {
    found = element.getScreenCTM();
    screen.set(element, found);
  }
  return found;
}

/** The element and its ancestors that a morph is still moving, up to its rendering. */
function morphedChain(slide, element) {
  const found = [];
  for (let node = element; node !== null; node = node.parentElement) {
    if (slide.morphed.has(node)) {
      found.push(node);
    }
    if (stackLabel(node.dataset?.typstLabel)?.kind === "epoch") {
      break;
    }
  }
  return found;
}

/** The `translate` an element computes, which is the one a running animation gives it. */
function translation(element) {
  const value = getComputedStyle(element).translate;
  if (value === "none" || value === "") {
    return { x: 0, y: 0 };
  }
  const [x = 0, y = 0] = value.split(/\s+/).map(Number.parseFloat);
  return { x, y };
}

/**
 * A `translate` of an element as a distance on the screen.
 *
 * A `translate` acts in the user space of the element's parent, which for a glyph is a run
 * that typst has flipped upside down, so the distance goes through the matrix of the parent
 * and not through the matrix of the element.
 */
function onScreen(element, { x, y }, screen) {
  const point = new DOMPoint(x, y, 0, 0).matrixTransform(matrixOf(element.parentNode, screen));
  return { x: point.x, y: point.y };
}

/** A distance on the screen as a `translate` of an element, which `onScreen` undoes. */
function inParent(element, { x, y }, screen) {
  const point = new DOMPoint(x, y, 0, 0).matrixTransform(
    matrixOf(element.parentNode, screen).inverse(),
  );
  return { x: point.x, y: point.y };
}

/** A `translate` as CSS, rounded to a ten thousandth of a pixel. */
function px({ x, y }) {
  const round = (value) => Math.round(value * 10000) / 10000 || 0;
  return `${round(x)}px ${round(y)}px`;
}

/**
 * Replace the glyph matches of a run of text that moves as one by one match of the two runs.
 *
 * Typst draws a run of text as a group of `<use>` elements, so a run whose every glyph is
 * matched to every glyph of one other run, at one distance, can be carried with one
 * animation instead of one per glyph. A run with a glyph a morph is still moving keeps its
 * matches, because the translation of the glyph would be added to the translation of the run.
 * So does a run with a glyph that starts from where its partner is shown, because each such
 * glyph starts from a different distance.
 */
function rigid(measuredPairs, morphed) {
  const result = [];
  let start = 0;
  while (start < measuredPairs.length) {
    const first = measuredPairs[start];
    const before = first.outgoing.parentElement;
    const after = first.incoming.parentElement;
    let end = start;
    while (
      end < measuredPairs.length &&
      measuredPairs[end].outgoing.parentElement === before &&
      measuredPairs[end].incoming.parentElement === after
    ) {
      end += 1;
    }
    const run = measuredPairs.slice(start, end);
    const whole =
      run.length === before.childElementCount &&
      run.length === after.childElementCount &&
      !isSlot(before) &&
      !isSlot(after) &&
      run.every(
        (pair) =>
          pair.outgoing.localName === "use" &&
          Math.hypot(pair.delta.x - first.delta.x, pair.delta.y - first.delta.y) < MORPH_STILL &&
          pair.standing === null &&
          !morphed.has(pair.outgoing) &&
          !morphed.has(pair.incoming),
      );
    if (whole) {
      result.push({ outgoing: before, incoming: after, delta: first.delta });
    } else {
      result.push(...run);
    }
    start = end;
  }
  return result;
}

/** Whether a group is one of the two slots of a tag site, which hold other translations. */
function isSlot(group) {
  return group.hasAttribute("data-typst-label") || group.parentElement.hasAttribute("data-typst-label");
}

/**
 * Plan the two translations of one match, and the geometry of a resize, and remember the
 * elements as moving.
 *
 * The outgoing element goes from what it shows to the place of the incoming one. A morph still
 * moving one of its ancestors goes on moving it in this step, to where `settleMorphs` sends it,
 * so the route of the outgoing element leaves out what that ancestor still travels, and the
 * two arrive together. The incoming element comes from the place of the outgoing one.
 * The `d` and the stroke width of a resize take both paths from the outgoing geometry to the
 * incoming one, and neither is written as inline style, so a path at rest shows its attribute.
 *
 * An outgoing element that a hand-over hid starts from where its partner is shown, which
 * `standing` gives.
 *
 * A match that has not moved, does not change its geometry and that no morph is moving needs
 * no animation.
 */
function carry(effects, slide, match, timing, where) {
  const { outgoing, incoming, delta, shape = null, standing = null } = match;
  const { stack, from, to, screen } = where;
  const { morphed } = slide;
  if (
    Math.hypot(delta.x, delta.y) < MORPH_STILL &&
    shape === null &&
    standing === null &&
    !morphed.has(outgoing) &&
    !morphed.has(incoming)
  ) {
    return;
  }
  const travel = { ...delta };
  for (const node of morphedChain(slide, outgoing.parentElement)) {
    const now = onScreen(node, translation(node), screen);
    const heading = morphed.get(node).heading;
    const then = heading === null ? { x: 0, y: 0 } : onScreen(node, parsed(heading), screen);
    travel.x += now.x - then.x;
    travel.y += now.y - then.y;
  }
  let own = { x: 0, y: 0 };
  if (morphed.has(outgoing)) {
    own = translation(outgoing);
  } else if (standing !== null) {
    own = inParent(outgoing, standing, screen);
  }
  const step = inParent(outgoing, travel, screen);
  const end = px({ x: own.x + step.x, y: own.y + step.y });
  const names = ["translate", ...Object.keys(shape?.end ?? {})];
  const unset = Object.fromEntries(names.map((name) => [name, ""]));
  const timed = Object.fromEntries(names.map((name) => [name, timing]));
  plan(effects, outgoing, unset, timed, {
    start: { translate: px(own), ...shape?.start },
    end: { translate: end, ...shape?.end },
  });
  const back = inParent(incoming, { x: -delta.x, y: -delta.y }, screen);
  plan(effects, incoming, unset, timed, {
    start: { translate: px(back), ...shape?.start },
    end: { translate: AT_REST, ...shape?.end },
  });
  // Both paths end at the incoming geometry, which is the geometry of the incoming path at rest,
  // in the commands the two share while they move.
  morphed.set(outgoing, { epoch: from, stack, end, heading: end, shape: shape?.end });
  morphed.set(incoming, { epoch: to, stack, end: null, heading: null, shape: shape?.end });
}

/** A `translate` as `px` writes it, back as a distance. */
function parsed(value) {
  const [x = 0, y = 0] = value.split(/\s+/).map(Number.parseFloat);
  return { x, y };
}

/**
 * Plan every translation and resize an earlier morph left running on a slide, before a step.
 *
 * A translation in a stack the step carries again runs on to where it was going, on the
 * clock of the new boundary, so it ends as the stack's new crossfade ends rather than in the
 * middle of it. The exception is an element of the rendering being entered, which this step
 * shows as it is laid out.
 * The translation of such an element snaps to rest, and a morph of this step that matches
 * it again gives it a separate route. Every other translation snaps to rest, as the
 * crossfade of a stack the step does not carry does. The `d` and the stroke width of a resize
 * run on or snap with the translation of their path.
 *
 * `carried` is the record of every stack the step carries, by stack.
 * `heading` records where each element is going in this step, which `carry` reads for the
 * ancestors of what it matches.
 */
function settleMorphs(effects, slide, to, carried, options, mirror) {
  for (const [element, record] of slide.morphed) {
    if (!element.getAnimations().some(ours)) {
      slide.morphed.delete(element);
      continue;
    }
    const own = record.epoch === to ? undefined : carried.get(record.stack);
    const timing = own === undefined ? null : scheduled(options, own.timing, mirror);
    const names = ["translate", ...Object.keys(record.shape ?? {})];
    const unset = Object.fromEntries(names.map((name) => [name, ""]));
    if (timing === null) {
      plan(effects, element, unset);
      record.heading = null;
      continue;
    }
    plan(effects, element, unset, Object.fromEntries(names.map((name) => [name, timing])), {
      end: { translate: record.end, ...record.shape },
    });
    record.heading = record.end;
  }
}

// The controller: the position of the deck, the clock that moves it, and the events that say
// it moved. Every piece of state the runtime keeps between two inputs is a variable of this
// file, and no other file writes one.
//
// The controller keeps one position, `<slide>.<state>`, and these things in step with it:
// which slide container is shown, the display state of that slide's tags, the URL
// fragment, and the `data-animo` attribute of the root element. The fragment is what
// makes a position addressable, which a deep link, a test and the reload of `typst watch`
// all need.
// The attribute lets a reader of the DOM see the position the runtime actually reached.
//
// A step animates, within a slide and across one slide boundary alike, and everything else
// snaps.
// Restoring a position therefore snaps to it rather than animating into it, and so
// does any jump that is not between neighbouring slides.
// The fragment is written with `replaceState`, so stepping leaves no history behind.
//
// `show` is the only writer of the position. What happened is announced as events on the
// root element, once the DOM, the fragment and the clock have been written, so a listener
// finds the page in the state the event describes:
//
// - `animo:leave` with `{slide}`, when a position on another slide is shown.
// - `animo:enter` with `{slide}`, after `animo:leave`, when the slide a position is on was
//   not the one before it. The first position of the page enters its slide and leaves none.
// - `animo:position` with `{from, to, animated}`, last, with positions as `{slide, state}`.
//   `from` is `null` for the first position of the page. `animated` says that the position
//   was reached by a step and that the deck lets motion run, which is false for a jump, for
//   a cut and for a reader who asked for less motion.
// - `animo:mode` with `{from, to}`, when the input mode changes.
//
// The events bubble, so a listener on the root element, the document or the window hears them.

/** Tell the page what happened, as an event on the root element. */
function announce(type, detail) {
  document.documentElement.dispatchEvent(new CustomEvent(type, { bubbles: true, detail }));
}

// The position the deck is at, or `null` until the first one has been shown.
let current = null;

// The mode input is read in, by name. `input.js` holds what each mode does with a key and a
// click, and this is only which one is active, so that a change of it is announced like any
// other change of the deck.
let mode = null;

/** The name of the active mode, or `null` before the page has booted. */
function currentMode() {
  return mode;
}

/** Make a mode the active one, and say so on the root element beside the position. */
function setMode(name) {
  if (name === mode) {
    return;
  }
  const from = mode;
  mode = name;
  document.documentElement.dataset.animoMode = name;
  announce("animo:mode", { from, to: name });
}

/** Show a position, and publish it in the fragment and on the root element. */
function show(position, animate = false) {
  const wanted = clamp(position);
  const previous = current;
  // Before the first position there is no slide to cross from, so the slide of the wanted
  // position is the one entered.
  const from = previous?.slide ?? wanted.slide;
  const crossing = wanted.slide !== from;
  // Only a step across one slide boundary animates.
  // A deep link, the first paint, `Home`, `End` and any longer jump snap, because the state
  // they would animate into is one the audience was shown no route to.
  // A backward step that walked over a join spanning a whole slide is the one longer jump
  // that had a route, and it snaps all the same.
  // A container has one opacity, so the slide passed through would have to be faded out
  // beside the one being left, and this seam is shaped to hand over one slide.
  const neighbour = Math.abs(wanted.slide - from) === 1;
  // The boundary belongs to the slide with the higher number, in both directions, so a
  // backward step undoes exactly what the forward step over it did.
  const transition =
    animate && crossing && neighbour ? slideTransitionOf(Math.max(wanted.slide, from)) : null;
  const boundary = boundaryTiming(transition);
  const slide = deck.get(wanted.slide);
  // Which state the slide being entered is showing, which is where its motion starts
  // and which is not the deck's position when a join is being walked back over.
  const shown = slide?.shown ?? null;
  // Whether that slide moves into the state it is asked for rather than snapping into it.
  // A step that stays on one slide does.
  // So does a backward step into the slide next door, which is how a join that runs out of a
  // slide is undone.
  // The audience saw that slide's motion and the boundary at once, so the way back plays both
  // at once too, each on the duration it took going forward.
  // A forward step snaps, because the slide it enters at
  // state 0 may still be showing a state from an earlier visit, and rewinding that is a
  // route the audience was never shown.
  const moving =
    animate && shown !== null && (!crossing || (neighbour && wanted.slide < from));
  const left = moving ? (slide.states[shown]?.epoch ?? 0) : null;
  // The step whose operations are being walked is the higher of the two states, forwards and
  // backwards alike, so that a backward step mirrors the schedule of the step it undoes.
  const walked = moving ? Math.max(shown, wanted.state) : wanted.state;
  // A step that lands below the state it starts from is that step played from the other
  // end, which is the whole of the difference between the two directions here.
  const reverse = moving && wanted.state < shown;
  current = wanted;
  // The slide being left keeps its layout for as long as the deck stays where it is, so
  // that stepping back over the same boundary finds it laid out already. Nothing else
  // is, so a deck pays for two slides however long it is.
  // The slide being left is `inert` meanwhile, because it is on screen only to be crossed
  // from, and neither a pointer nor the keyboard has any business in it.
  const leaving = boundary === null ? null : from;
  // The slides that had no layout before this step, which a transition brings in from its
  // far end rather than from what they show.
  const fresh = new Set();
  for (const [number, other] of deck) {
    if (!other.element.matches("[data-animo-current], [data-animo-leaving]")) {
      fresh.add(number);
    }
  }
  for (const [number, other] of deck) {
    other.element.toggleAttribute("data-animo-current", number === current.slide);
    other.element.toggleAttribute("data-animo-leaving", number === leaving);
    other.element.toggleAttribute("inert", number === leaving);
  }
  // A slide the runtime is not using has no layout, so its anchors wait until the loop
  // above lays it out, which is still before anything has been written on it.
  // A slide is laid out because it is being entered or because it is being left,
  // and a slide is only ever left after it has been entered.
  if (slide !== undefined && slide.anchors === null) {
    slide.anchors = measureAnchors(slide);
  }
  // The step is planned whole before any of it is written, and then applied in one task, so
  // that a boundary and whatever it carries take the same frame's time, which is the step's
  // one clock, and so that no part of the plan reads a style another part has written.
  // The operations of the slide being entered take `--animo-primitive-duration`,
  // where the boundary takes `--animo-transition-duration`.
  // A join is two clocks started on one frame, going back as coming.
  const effects = new Map();
  planSlides(effects, current.slide, leaving, boundary, transition, fresh);
  const options = moving ? timing() : null;
  planState(effects, slide, current.state, options, {
    from: left,
    step: walked,
    reverse,
  });
  apply(effects);
  const hash = `#${current.slide}.${current.state}`;
  if (location.hash !== hash) {
    history.replaceState(null, "", hash);
  }
  document.documentElement.dataset.animo = `${current.slide}.${current.state}`;
  arm();
  // The events come last, so that a listener finds the position fully written.
  if (previous === null || previous.slide !== current.slide) {
    if (previous !== null) {
      announce("animo:leave", { slide: previous.slide });
    }
    announce("animo:enter", { slide: current.slide });
  }
  announce("animo:position", {
    from: previous === null ? null : { ...previous },
    to: { ...current },
    animated: options !== null || boundary !== null,
  });
}

/**
 * Step one position forward or backward, crossing slide boundaries.
 *
 * A backward step lands where `landing` walks to, which is the nearest earlier state the
 * deck would rest at, and it turns the deck around. The clock carries a deck back over the
 * gaps it carried it forward over, so a run the presenter got through on one press is
 * undone on one press. Where that travel comes to rest is `arm`'s answer.
 *
 * A forward step puts back the clock that backward travel stopped at the first state of the
 * deck. A deck whose gap at that position waits for the presenter has no clock to stop, so
 * `Space` and every other key keep the behaviour they have there.
 */
function step(delta) {
  const target = delta > 0 ? after(current) : landing(current);
  if (target === null) {
    return;
  }
  direction = Math.sign(delta);
  if (delta > 0) {
    holds.delete("travel");
  }
  show(target, true);
}

/**
 * Show a position the deck was not stepped to, which leaves it travelling forwards.
 *
 * A deep link, `Home`, `End` and the first paint land rather than arrive, so whatever the
 * deck was doing before is over and a gap at the position they land on runs the deck on.
 */
function jump(position) {
  direction = 1;
  show(position);
}

/**
 * The position after one, or `null` at the end of the deck.
 *
 * Stepping past the last state of a slide enters the next one, which is the rule that the
 * forward key of the presenter follows, so a gap inside a slide and a gap across a slide
 * boundary are the same timer on the same sequence of positions.
 */
function after(position) {
  if (position.state + 1 < count(position.slide)) {
    return { slide: position.slide, state: position.state + 1 };
  }
  return position.slide < lastSlide() ? { slide: position.slide + 1, state: 0 } : null;
}

/** The position before one, or `null` at the start of the deck. */
function before(position) {
  if (position.state > 0) {
    return { slide: position.slide, state: position.state - 1 };
  }
  const slide = position.slide - 1;
  return position.slide > 1 ? { slide, state: count(slide) - 1 } : null;
}

/** The number of seconds that one state gives under one key, in milliseconds, or `null`. */
function secondsOf(position, key) {
  const seconds = deck.get(position.slide)?.states[position.state]?.[key];
  return typeof seconds === "number" ? seconds * 1000 : null;
}

/**
 * How long the deck holds a position before leaving it, in milliseconds, or `null` for a
 * presenter click.
 *
 * A gap is timed by the `hold:` of the state before it or by the `wait:` of the state
 * after it, never by both, which the resolver and the deck refuse at compile time.
 * This function therefore needs no precedence rule, and reads whichever of the two was
 * written.
 */
function gapAfter(position) {
  const next = after(position);
  if (next === null) {
    return null;
  }
  return secondsOf(position, "hold") ?? secondsOf(next, "wait");
}

/**
 * How long the deck holds a position before travelling back from it, in milliseconds, or
 * `null` for a presenter click.
 *
 * This is the gap that the backward step crosses, which is the gap before the position.
 * `landing` walks back over the joins on the way, so the gap after the state it lands on is
 * the one gap of that step that is not a join.
 * A position with no earlier state to land on has no gap before it.
 */
function gapBefore(position) {
  const target = landing(position);
  return target === null ? null : gapAfter(target);
}

/**
 * Where a backward step lands, which is the nearest earlier state the deck would rest at.
 *
 * A gap of zero is a join rather than a stop.
 * The state it is measured from is left in the same frame in which it is entered, so the
 * audience never sees it at rest, and the motion that state started is redirected in its
 * first frame rather than arriving.
 * Landing there would put a composition on the screen that was never shown,
 * and it would cost one press per join to walk back over a run the presenter got through in
 * one.
 * A join is crossed in both directions instead, so a backward step undoes a forward one.
 *
 * It is the timeline that says where the deck rests and not the clock, so this walk is the
 * same whether the deck is playing or stopped.
 * A state the walk passes over stays addressable, because a fragment reaches every state of
 * a deck exactly, and so does stepping forward through a deck whose clock is stopped.
 *
 * The walk stops at the first state of the deck whatever its gap says, because there is
 * nothing earlier to land on. That is the one case the clock stop in `arm` answers.
 */
function landing(position) {
  let target = before(position);
  while (target !== null && gapAfter(target) === 0) {
    const earlier = before(target);
    if (earlier === null) {
      break;
    }
    target = earlier;
  }
  return target;
}

// The pending step, or `null` when the deck is waiting for the presenter.
// `left` is how much of the wait is still to run and `since` when it was last set going,
// which is what a pause keeps and a resume puts back.
// `id` is the running timer, which is `null` while the clock is stopped.
//
// This is the only timer the runtime sets. The `delay:` of an operation becomes the delay
// of its effect instead, so a step keeps one clock however its operations are staggered.
let pending = null;

// Why the clock is stopped, as a set of reasons. The clock is stopped while the set holds any.
// It is the one thing the runtime knows that the URL does not carry, so a reload comes back
// running, deliberately.
// Every other piece of the position is in the fragment, and a deep link restores it exactly.
//
// - `user` is the pause key.
// - `travel` is backward travel running out of deck. A forward step releases it and the
//   pause key does not, because a reader carried back to the first state expects the deck to
//   play on when they move on, where one who stopped the deck on purpose expects it to stay
//   stopped until they say otherwise.
//   The two are never held together, because the forward step that ends `travel` is
//   expected to start the deck again whether or not the pause key had been pressed before.
//
// A mode that takes the deck over, such as an overview or an annotation, holds a separate
// reason, so that leaving it cannot start a clock that the pause key stopped.
const holds = new Set();

// Which way the deck is travelling, `1` or `-1`. It is what the clock steps the deck by
// when a gap runs out, and a pause keeps it, so a deck resumes the way it was going.
// Every key but `Space` says which way it means, and a jump means forwards.
let direction = 1;

/** Whether the clock is stopped, for whatever reason. */
function stopped() {
  return holds.size > 0;
}

/**
 * Whether the deck has a clock that the pause key acts on.
 *
 * That is a deck with a step pending and a deck that is stopped, because a stopped deck
 * has to be set going again. A deck that waits for the presenter has neither, and its keys
 * only step.

  return pending !== null || stopped();
}

/** Say on the root element whether the clock is stopped, beside the position. */
function publish() {
  document.documentElement.toggleAttribute("data-animo-paused", stopped());
}

/** Set the pending step going, or hold it where it is while the deck is stopped. */
function schedule(left) {
  const way = direction;
  pending = { left, since: performance.now(), id: null };
  if (!stopped()) {
    pending.id = setTimeout(() => {
      pending = null;
      step(way);
    }, left);
  }
  publish();

/**
 * Arm the timer for the next step in the direction of travel, and clear whatever was pending.
 *
 * Called whenever a position is entered, whatever entered it, so a presenter stepping by
 * hand is never racing a clock that is still counting and a deep link starts a new timer
 * from where it lands.
 *
 * One gap times the step over it in both directions, because a gap lies between two states
 * rather than belonging to one of them. A gap the deck crosses on its own after a second
 * going forward is a gap it crosses on its own after a second coming back, so backward travel
 * plays a run of automatic gaps as the forward run played it, mirrored in time.
 * Travelling back, the step that is pending is the one over the gap before the position.
 * A position whose gap before it waits for the presenter arms nothing, and that is where
 * backward travel comes to rest. The clock never crosses a gap that waits for the presenter,
 * so the travel ends on the state that the presenter's forward press brought up.
 *
 * The first state of a deck is the other end of that travel and the one place the clock is
 * stopped rather than left unarmed. Nothing earlier is there to travel to, and the gap the
 * state does carry would arm forwards and undo the step that just arrived, which would
 * leave the state reachable for that gap's length and no longer.
 * The animations of the step that just arrived are left running, because it is the clock
 * that stops here and not the picture.
 */
function arm() {
  if (pending !== null && pending.id !== null) {
    clearTimeout(pending.id);
  }
  pending = null;
  if (direction < 0 && landing(current) === null) {
    direction = 1;
    if (gapAfter(current) !== null) {
      holds.delete("user");
      holds.add("travel");

  if (gap === null) {

    // no timer is pending, so the travel that brought it here is over.
    // A state that backward travel rests on may have a timed gap after it, which stays
    // unarmed, because the presenter is the one who sets the deck going forward again.
    direction = 1;

 * as the clock. An animation in flight is paused where it is and picked up from there, so
 * the picture holds still instead of running on to the end of the step it was in. Only what

 * `togglePause`, so that an input device only has to say which of these it means.
 */

  next: () => step(1),
  previous: () => step(-1),
  first: () => jump({ slide: 1, state: 0 }),
  last: () => jump({ slide: lastSlide(), state: count(lastSlide()) - 1 }),

//

// pointer table maps the type of a pointer event to one. An entry is the name of an intent,
// or a function that names one when the input arrives, for an input whose meaning depends on
// the state of the deck.

 *

 * itself, whichever way it is going, and steps a deck that is not.

    return;

  if (intent === undefined) {

  }
  intents[intent]();
  event.preventDefault();

  if (inControl(event)) {
    return;
  }
  const intent = intentOf(modes.get(currentMode()).pointer, "click");

// SPDX-License-Identifier: Apache-2.0

/**

 * out, put it first in the document, and take the ids off the originals.
 *
 * Typst names a gradient, a clip path, a tiling, a mask and a filter by a hash of its

 * a second frame. A reference resolves to the first element of its id in the document,
 * which sits in the earliest slide that uses it, and that slide is `display: none` unless
 * it is one of the two being laid out. Chromium and firefox do not resolve a reference into
 * a subtree that is not laid out, so the fill is dropped and the clip is not applied.

 * does draw, so text is not affected. See *Findings*.

 * so that it is the first match of every id. Equal ids mean equal content, so the first
 * definition of an id serves every slide that uses it.

hoistPaintServers();
