/*
  The stylesheet of an animo deck.
  The geometry of each deck is appended to this file as custom properties on `:root`,
  so everything below is the same for every deck.
*/

/*
  A reader who asked for less motion gets none, whatever the deck or the timeline asks for.

  The time that motion takes defaults to the settings of the deck.
  `--animo-primitive-duration`, `--animo-transition-duration` and `--animo-easing` are
  written from the `primitive-duration:`, `transition-duration:` and `easing:` arguments of
  the show rule, into the `:root` block that is appended to this file.
  The runtime reads them at every step, so a value reaches every operation that asked for
  nothing, and an operation that states a duration takes that one instead.

  A media query cannot reach a number written in a typst source, so zeroing the defaults
  would leave every stated duration moving. The reader's preference is a property of its
  own instead, and the runtime snaps every step while it is `none`, which is what a deep
  link and a reload get in any case.

  A stylesheet added to the page comes after this rule, so the declaration here is
  `!important` and the guard wins by cascade weight rather than by source order.
  Measured in chromium 151 and firefox 153, a later `:root` declaration of the same property
  outranks this query without it.
*/
@media (prefers-reduced-motion: reduce) {
  :root {
    --animo-motion: none !important;
  }
}

/*
  The surround the slide is centred on, which is not part of any slide.
  It is a declaration on the root elements of the page rather than on the stage below.
  The stage isolates the blend that crossfades two slides, and the ground of the isolating
  element is inside the group it isolates, so a surround written there would be summed into
  both slides.
  Measured with a white surround, which shifted the midpoint of a crossfade by 239/255 in
  chromium 151 and firefox 153. A black surround adds zero and hides the mistake.
  See *Findings*.
*/
html,
body {
  margin: 0;
  padding: 0;
  background: #000000;
}

/*
  The window: the stage, centred on the surround.
  It carries no background and no isolation.
  Controls that belong to the window rather than to a slide are children of the deck beside
  the stage, because a corner of the window can lie outside the stage.
*/
.animo-deck {
  display: grid;
  place-items: center;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/*
  The stage: the rectangle the current slide fills, and the element everything that belongs
  to the visible slide attaches to.
  It is as large as the window allows at the deck's aspect ratio, and it clips,
  because content outside it belongs to the canvas and is reached by panning, and a slide
  that is entering or leaving is clipped at it as well.

  It isolates, so that `plus-lighter` on the slides sums the two of a crossfade against a
  transparent backdrop and not against the page. It carries no background for the reason
  the surround above gives.
*/
.animo-stage {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  width: var(--animo-viewport);
  aspect-ratio: var(--animo-aspect);
}

/*
  A slide: one container in the stage, as large as the stage.
  It clips as well, because the canvas inside it is larger than the stage when the slide
  pans.

  Two slides are laid out at a time and never more: the one being shown, and the one a
  boundary is crossing from, which keeps its layout until the deck moves again so that
  stepping back over the same boundary needs no layout.
  Every other slide is `display: none`, which keeps the layout of a long deck small.
  Laying every slide out for the whole session doubled the first paint of a sixty-slide
  deck, as the design document records.

  Slides are stacked in document order, so the one being left would be above the one being
  shown and take its pointer events.
  Only the current slide takes events, which leaves the slide being left laid out and
  inert to the pointer. The runtime sets `inert` on it as well, for the keyboard and for
  assistive technology.

  `plus-lighter` makes the crossfade between two slides add rather than cover, and
  it is on every slide rather than only on the two a boundary involves, so that a slide
  rasterises the same whether or not it is in a transition. A single slide added to the
  transparent backdrop of the isolated stage is that slide, so this changes nothing outside
  a boundary.
  A push, a cover, an uncover and a wipe overlap two opaque slides,
  which have to cover rather than add, so the runtime writes `mix-blend-mode: normal` on the two slides they cross, and a single
  slide renders the same under that blend as well. See *Findings*.
*/
.animo-slide {
  display: none;
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #ffffff;
  mix-blend-mode: plus-lighter;
}

.animo-slide[data-animo-current],
.animo-slide[data-animo-leaving] {
  display: block;
}

.animo-slide:not([data-animo-current]) {
  pointer-events: none;
}

/*
  The canvas: what the body is laid out on, at least as large as the viewport.
  It sits at the viewport's origin and is sized in `--animo-unit`, one typst point as the
  window currently renders it, so a typst point is the unit of everything inside it at any
  window size.
  Sizing rather than scaling leaves both `translate` and `scale` free on this element.
  The runtime writes a pan as its `translate`, and nothing writes its `scale`.
  The canvas holds one frame, and that frame holds the body of the slide with an epoch stack
  in every region that sits in no other region, once the slide has two epochs.
*/
.animo-canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/*
  The two outer layers, one behind the canvas and one in front of it.
  Each is the size of the viewport and belongs to it rather than to the canvas, so a pan
  moves the canvas between them and leaves both where they are.
  Both are frames of the slide rather than renderings inside the canvas's frame, which keeps
  them out of every epoch stack and independent of the number of epochs.
  A slide with four epochs still carries one of each.
  The three are positioned elements without a z-index, so they paint in document
  order, which is the order the slide emits them in.
  A layer that is a color rather than content needs no frame.
  The background color is a declaration on the slide container, which is already behind the
  canvas, and an overlay color is one on the element below, which is already in front of it.
*/
.animo-background,
.animo-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.animo-background > svg,
.animo-overlay > svg {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/*
  The frame fills the canvas exactly, because the canvas is the size animo computed and
  the frame's viewBox is that same rectangle in typst points.
  `html.frame` writes the frame's size as an inline style in `em`, against the text size
  of the document rather than against the font size of the page, so a plain rule loses to
  it and the frame comes out a few percent too large. Overriding an inline style that
  animo does not control is what `!important` is for.
*/
.animo-canvas > svg {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/*
  Each kind of stack states here which of its renderings a page whose script never ran shows,
  which is the first one, and how the others are hidden.
  `stack.typ` labels the renderings, and `stacks.js` chooses between them.

  An epoch stack shows one rendering of its region at a time, so a deck whose script never ran
  still shows a slide.
  The renderings are groups placed at one point of the region's footprint in the slide's
  single frame, so that typst's deduplicator, whose scope is the frame, defines each glyph
  they share once between them. See *Findings*.
  The renderings are hidden with visibility rather than display, because visibility hides
  the ink without taking the layout away, so a group in a rendering that is not shown still
  reports the geometry a morph reads.

  No rendering blends and no container of renderings isolates, also while a transition runs.
  The runtime hands a region over with opacity alone, as `handOver` in `boundaries.js`
  describes, because a blend or an isolation on a stack made firefox 155 several times slower
  on every frame of a transition. See *Performance*.
  Chromium 153 and firefox 155 therefore draw a stack as the same content without a stack.
  Webkit 26.6 draws a group beside a hidden sibling differently from a lone group at some
  positions. See *A Blended or Isolated Group at Rest* in *Findings*.
*/
.animo-canvas [data-typst-label^="animo-epoch-"] {
  visibility: hidden;
}

.animo-canvas [data-typst-label="animo-epoch-0"] {
  visibility: visible;
}

/*
  A subslide stack holds one rendering of a `per-subslide` per state of the slide, of which
  the runtime shows the one belonging to the state the deck is on.
  A number finer than a slide number is made of these renderings, because one frame covers
  every state of a slide, so the value cannot be ink chosen when the frame is rendered and
  every value is rendered instead.
  The renderings are hidden with opacity rather than visibility,
  because a stack in a region sits inside an epoch rendering,
  and a rendering that is not being shown is hidden with `visibility`, which a descendant may
  take back.
  A rendering that took its visibility back would then paint out of an epoch rendering nobody
  is watching, where one at opacity 1 inside a hidden one stays hidden.
*/
.animo-slide [data-typst-label^="animo-subslide-"] {
  opacity: 0;
}

.animo-slide [data-typst-label="animo-subslide-0"] {
  opacity: 1;
}

:root {
  --animo-aspect: 1.777778;
  --animo-viewport: min(100vw, 100vh * 1.7777777777777777);
  --animo-unit: calc(var(--animo-viewport) / 453.5433);
  --animo-primitive-duration: 0.4s;
  --animo-transition-duration: 0.4s;
  --animo-easing: ease-in-out;
}

// The slides of the deck as the runtime needs them: what is read from the DOM once, the
// registry that holds it, and the arithmetic on positions that depends on the shape of the
// deck and on nothing that is on screen.
//
// The runtime is the files of `src/js`, joined in the order `deck.typ` names into the one
// script of the page, so they share one module scope and none of them imports another.
// A function declaration is hoisted and may be called from any file at any time.
// A top level `const` is initialised when the file that defines it is reached, so a value is only
// usable while the script loads by a file that comes after the one that defines it.
// Only `boot.js` calls into the other files while the script loads, and `input.js` registers
// its listeners then.

/** One slide of the deck, as the runtime needs it, read from the DOM once. */
function readSlide(element) {
  const plan = JSON.parse(element.dataset.animoPlan || '{"states":[]}');
  // Every occurrence of a tag name, in every rendering of every stack of this slide, because
  // continuous state belongs to the slide and not to the rendering that is showing.
  // The slot of a tag is the first group inside its labelled one, except for a tag that holds
  // an epoch stack, whose slot is inside each rendering of the stack.
  const slots = new Map();
  for (const group of element.querySelectorAll("[data-typst-label]")) {
    const name = group.dataset.typstLabel;
    if (stackLabel(name) !== null) {
      continue;
    }
    const first = group.querySelector(":scope > g");
    const holders =
      stackLabel(first?.dataset.typstLabel)?.kind === "epoch"
        ? group.querySelectorAll(':scope > [data-typst-label^="animo-epoch-"]')
        : [group];
    for (const holder of holders) {
      const slot = holder.querySelector(":scope > g");
      if (slot === null) {
        continue;
      }
      const found = slots.get(name);
      if (found === undefined) {
        slots.set(name, [slot]);
      } else {
        found.push(slot);
      }
    }
  }
  return {
    element,
    canvas: element.querySelector(":scope > .animo-canvas"),
    slots,
    // Every slot whose opacity a display state owns, which is a slot of a tag that a state
    // of the plan addresses.
    slotted: new Set(
      (plan.states ?? []).flatMap((state) =>
        Object.keys(state.tags ?? {}).flatMap((name) => slots.get(name) ?? []),
      ),
    ),
    // Every stack of the slide: an epoch stack in every region whose content changes, and a
    // stack for every `per-subslide` in every rendering and layer that lays it out.
    // A stack is looked up once here rather than per step, as the tag slots above are.
    stacks: readStacks(element),
    // What each boundary changes, by epoch, where epoch i holds the tags that the step into
    // it changes, by name, each with the timing and the transition of the operations that
    // changed it, and the name of a changed tag that becomes no group by the label of the
    // region that holds it. The first epoch begins no boundary.
    epochs: (plan.epochs ?? [{}]).map((epoch) => ({
      changed: epoch.changed ?? {},
      regions: epoch.regions ?? {},
    })),
    states: plan.states ?? [],
    count: Math.max(1, Number(element.dataset.animoStates ?? 1)),
    // How the boundary above this slide is crossed: the name of a transition,
    // or `auto` for the default transition of the deck,
    // and its parameters with the duration the slide's `init` stated.
    // It is the setting of the slide a forward step enters and is used in both directions.
    transition: {
      name: element.dataset.animoTransition ?? "auto",
      args: JSON.parse(element.dataset.animoTransitionArgs || "{}"),
    },
    margin: plan.margin ?? 0,
    size: plan.canvas ?? null,
    // Where the tags the plan is relative to sit, measured when the slide is first shown.
    anchors: null,
    // The elements a morph is still moving, each with the epoch of its rendering, the stack
    // that holds it, where its route ends and where the geometry of a resize ends, which
    // `morph.js` keeps.
    morphed: new Map(),
    // The elements a hand-over hides or fades, for the step being planned and for the step
    // before it, which `boundaries.js` keeps.
    handed: new Set(),
    handing: new Set(),
    // The partner that shows each element a hand-over hid, by the hidden element, for the
    // step being planned and for the step before it, which `morph.js` reads.
    standIns: new Map(),
    shownBy: new Map(),
    // Which state this slide is showing, or `null` while it has never been rendered.
    // This is the state of the slide rather than the position of the deck, because a backward step
    // that walks back over a join leaves one slide and rewinds another, and the state it
    // rewinds from is the one this slide was left at.
    shown: null,
  };
}

/**
 * The settings of the deck, as the `data-animo-config` attribute of the deck element states
 * them, read once.
 *
 * The durations and the easing are custom properties on `:root` instead, because a media
 * query for a reader who asked for less motion has to reach them.
 */
const config = JSON.parse(document.querySelector(".animo-deck")?.dataset.animoConfig || "{}");

/** The slides of the deck by number, which `boot.js` fills once the page has loaded. */
const deck = new Map();

/** The number of the last slide, which is also how many there are. */
function lastSlide() {
  return deck.size;
}

/** How many states a slide has, which is one more than its number of subslide steps. */
function count(number) {
  return deck.get(number)?.count ?? 1;
}

/** Read the position from the URL fragment, falling back to the first slide. */
function parseHash() {
  const found = /^(\d+)\.(\d+)$/.exec(location.hash.slice(1));
  if (found === null) {
    return { slide: 1, state: 0 };
  }
  return { slide: Number(found[1]), state: Number(found[2]) };
}

/** Bring a position inside the deck, so that a hand-written fragment cannot leave it. */
function clamp(position) {
  const slide = Math.min(Math.max(position.slide, 1), lastSlide());
  return { slide, state: Math.min(Math.max(position.state, 0), count(slide) - 1) };
}

// The stacks of a slide: renderings that typst placed at one point, of which the runtime
// shows one at a time.
//
// `stack.typ` labels every rendering of a stack `animo-<kind>-<index>`, and the renderings of
// one stack are the labelled children of one group. The kind says what the index counts and
// how the rendering to show is chosen, which `stackKinds` holds. Nothing about a stack
// travels in the plan, so a stack is found by its labels alone.

/**
 * How the rendering of a state is chosen, per kind of stack.
 *
 * `select(effects, slide, stack, step, prepared)` plans one stack of a slide for the state the
 * step is entering, as `planState` describes the step.
 * `index` is that state, `from` the epoch the slide was showing, `options` how the step moves
 * and `mirror` how long it lasts when it runs backwards.
 *
 * A kind may also have `read(stack)`, which adds what it needs to a stack once, when the slide
 * is read, and `prepare(effects, slide, step)`, which plans what one step needs once per slide
 * before any stack of the kind is planned, and whose result every `select` of the step is
 * handed as `prepared`.
 *
 * An `epoch` stack holds one rendering of a region per content state, and a boundary between
 * two of them is crossed by the transitions of `boundaries.js`.
 * A `subslide` stack holds one rendering of a `per-subslide` per state, and snaps.
 */
const stackKinds = {
  epoch: { read: readEpochStack, prepare: planBoundary, select: planEpoch },
  subslide: { select: planSubslide },
};

/**
 * The kind and the index of a rendering of a stack, by its label, or `null` for any other
 * label.
 *
 * A region group carries a label of the same shape, `animo-region-<n>`, so a kind is one that
 * `stackKinds` knows.
 */
function stackLabel(label) {
  const found = /^animo-([a-z]+)-(\d+)$/.exec(label ?? "");
  if (found === null || !Object.hasOwn(stackKinds, found[1])) {
    return null;
  }
  return { kind: found[1], index: Number(found[2]) };
}

/**
 * The stacks of one slide, in document order, each as its kind, its container and its
 * renderings by index.
 *
 * A rendering that laid nothing out is not in the page, so the renderings of a stack may
 * have holes, which `forEach` passes over.
 */
function readStacks(element) {
  const stacks = new Map();
  for (const rendering of element.querySelectorAll('[data-typst-label^="animo-"]')) {
    const found = stackLabel(rendering.dataset.typstLabel);
    if (found === null) {
      continue;
    }
    const container = rendering.parentNode;
    let stack = stacks.get(container);
    if (stack === undefined) {
      stack = { kind: found.kind, element: container, renderings: [] };
      stacks.set(container, stack);
    }
    stack.renderings[found.index] = rendering;
  }
  for (const stack of stacks.values()) {
    stackKinds[stack.kind].read?.(stack);
  }
  return Array.from(stacks.values());
}

/** Plan every stack of a slide for one state, each as its kind chooses. */
function planStacks(effects, slide, step) {
  const prepared = new Map();
  for (const [kind, { prepare }] of Object.entries(stackKinds)) {
    if (prepare !== undefined) {
      prepared.set(kind, prepare(effects, slide, step));
    }
  }
  for (const stack of slide.stacks) {
    stackKinds[stack.kind].select(effects, slide, stack, step, prepared.get(stack.kind));
  }
}

/**
 * Show the rendering of a `per-subslide` that belongs to a state, and hide the others.
 *
 * This is how a value finer than a slide number reaches the page at all.
 * One epoch rendering covers a run of states, so typst renders every value and the choice
 * is made here.
 *
 * It snaps rather than animating, in a step that animates as much as in one that does not.
 * A number is read rather than watched, and two numbers crossfading into each other are
 * two numbers neither of which can be read.
 */
function planSubslide(effects, slide, stack, { index }) {
  stack.renderings.forEach((rendering, state) => {
    plan(effects, rendering, { opacity: state === index ? "1" : "0" });
  });
}

// SPDX-FileCopyrightText: 2026 Toon Verstraelen <Toon.Verstraelen@UGent.be>
// SPDX-License-Identifier: Apache-2.0

// How an element is put into a display state: the timing a step takes from the stylesheet and
// from its operations, and the two phases that plan the effects of a step and apply them.
//
// Motion is driven by the Web Animations API rather than by CSS transitions.
// Each step writes the state's display state as inline style on the tag's inner group and
// animates from what the element was showing to that, so the style is the state and the
// animation is only how it got there.
// A step interrupted halfway therefore continues from where it is,
// stepping backwards lands on exactly the geometry the earlier state had,
// and a deep link needs no transition to suppress.
//
// When a step starts an animation it never says when it began.
// Every animation of one step is created in one task, so they are all pending until the
// same frame and all take that frame's time, which gives the step one clock by
// construction, and that clock is the one an epoch crossfade joins.
// `document.timeline.currentTime` is the time of the last frame the browser drew, and
// firefox 153 draws no frames at all while the page sits still, so on a deck being read
// rather than clicked through it lags by as long as the reader paused, and an animation
// told it began then is already over.
// See *Findings*.

/** The `id` of every animation the runtime creates, which is how it tells them from others. */
const ANIMATION_ID = "animo";

/**
 * Whether the runtime created an animation.
 *
 * The document may hold animations that the author added, from a stylesheet or a script,
 * and what the runtime does to the animations of the page, such as pausing them, is done
 * only to the animations the runtime started.
 */
function ours(animation) {
  return animation.id === ANIMATION_ID;
}

/** A CSS time as a number of milliseconds, or zero when it is not one. */
function milliseconds(value) {
  const found = /^\s*(-?[\d.]+)(ms|s)\s*$/.exec(value);
  if (found === null) {
    return 0;
  }
  return Number(found[1]) * (found[2] === "s" ? 1000 : 1);
}

/**
 * How a step moves, read from the stylesheet at every step, or `null` when it snaps.
 *
 * The values live in CSS rather than in this file, because the deck writes its
 * `primitive-duration:`, `transition-duration:` and `easing:` arguments there.
 * `property` is which duration is wanted.
 * A primitive within a slide and a slide boundary have one each,
 * so a deck of hard cuts between slides keeps the motion inside them.
 *
 * The duration is a default, so a deck duration of zero is still a step that moves when an
 * operation states a duration, and an effect snaps only when it ends up with no
 * time at all (see `scheduled`).
 * The one thing that snaps a whole step is `--animo-motion: none`, which the stylesheet's
 * media query sets for a reader who asked for less motion, because a media query cannot
 * reach a number written in a typst source.
 */
function timing(property = "--animo-primitive-duration") {
  const style = getComputedStyle(document.documentElement);
  if (style.getPropertyValue("--animo-motion").trim() === "none") {
    return null;
  }
  const duration = Math.max(0, milliseconds(style.getPropertyValue(property)));
  // An easing the stylesheet does not state is no easing at all.
  const easing = style.getPropertyValue("--animo-easing").trim() || "linear";
  return { duration, easing, fill: "none" };
}

/**
 * The options of one effect, which are the defaults of the deck with the delay and the
 * duration of its operation applied.
 *
 * A delay becomes the effect's delay and a duration the effect's duration, rather than a
 * separate timer.
 * The step therefore keeps one clock, because every animation of a step is still created in
 * one task and measured from the same instant.
 * A duration the operation does not state is the `--animo-primitive-duration` of the deck,
 * so that a change of the deck's tempo reaches every operation that said nothing
 * and leaves the ones that did alone.
 *
 * Only a delay needs `fill: backwards`. The display state is written as inline style before
 * the animation is created, so an effect that does not hold its first keyframe while it
 * waits shows the state it is going to reach and then jumps back to where it started.
 *
 * A step that snaps stays snapped, delays and durations alike.
 * `options` is `null` for a reader who asked for less motion, a deep link and the first
 * paint.
 * An effect with no time at all, no delay and a duration of zero, snaps as well, which is
 * what an operation that takes the deck's duration of zero and a hard cut both are.
 * A delay with a duration of zero holds the effect back and then jumps.
 *
 * `mirror` is how long the step lasts, and it turns the schedule around.
 * A backward step is the forward one played from the other end, so an operation that ran
 * from `delay` to `delay + duration` runs from `mirror - delay - duration` instead and
 * takes exactly as long.
 * The last thing to arrive is then the first to leave, so a backward step undoes a forward
 * one in time as well as in geometry. `mirror` is `null` for a step that plays forwards.
 */
function scheduled(options, timing, mirror = null) {
  if (options === null) {
    return null;
  }
  const duration =
    timing?.duration === undefined ? options.duration : timing.duration * 1000;
  const own = duration === options.duration ? options : { ...options, duration };
  const stated = (timing?.delay ?? 0) * 1000;
  const delay = mirror === null ? stated : mirror - stated - duration;
  if (!(duration > 0) && !(delay > 0)) {
    return null;
  }
  return delay > 0 ? { ...own, delay, fill: "backwards" } : own;
}

/**
 * How long one step lasts, in milliseconds, which is what a backward step mirrors about.
 *
 * The step ends when the last of its operations does, so this is the largest
 * `delay + duration` over all of them. The resolver could only add up the operations that
 * stated a duration, because the one an operation does not state lives in the stylesheet,
 * so it hands over the two halves and they are added here.
 * `stated` is the largest end it could compute, and `unstated` the largest delay of the
 * operations whose duration is the `--animo-primitive-duration` of the deck.
 *
 * A step that states no timing at all carries no span, and lasts exactly the
 * `--animo-primitive-duration` of the deck, which is what every operation of it takes.
 */
function span(record, options) {
  // A step that carries no record is one whose every operation starts with it and takes the
  // `--animo-primitive-duration` of the deck, which is an unstated delay of zero,
  // so that is what stands in for it.
  // An absent `unstated` beside a `stated` is the other case and adds nothing, because the
  // step holds no operation whose duration the stylesheet owns.
  const { stated, unstated } = record ?? { unstated: 0 };

    stated === undefined ? 0 : stated * 1000,

/**

 * keyword rather than as that value.

 * the value that keyword stands for, which is what a keyframe and a comparison need.

 * animate a property this file does not know.

  // its box already, and only the second interpolates with the clip of a wipe.

    names.map((name) => {

// A step is put on the page in two phases, which the two functions below are.
//
// The first plans it. It reads what every element the step animates is showing, and a
// transition reads whatever geometry it needs beside that, and nothing is written.
// The result is the step's effects, one per element and property, each with what the
// element shows now, what it is to show, and the timing that takes it there or `null`
// for a property that snaps.
// The second applies them, writing every style and then creating every animation in one
// task, which is the step's one clock.
//
// The split keeps every read of a step ahead of every write of it. Continuous state is
// written to every occurrence of a tag in a loop, so a read between two writes could see
// the ancestors of one occurrence in the new state and those of another in the old one,
// and reading and writing in alternation recalculates style once per element.

/**
 * Plan a display state on one element, as effects of the step being planned.
 *
 * `effects` maps an element to its effects by property, and an effect planned for an
 * element and a property that already have one replaces it. That is how a transition puts a
 * region it carries in place of the state at rest that `planEpoch` planned for it first.
 *
 * `options` is `null` for a state that snaps, and otherwise one options object per property
 * of `to`, because two operations of one step may start at different moments and an effect
 * has one delay. A property without options snaps.
 *
 * `start` states where an animated property starts, in place of what the element is showing,
 * for an element whose current value is no point on the route to the new one.
 * A slide that a push brings in has not been laid out, and it starts outside the stage.
 *
 * `end` states where an animated property ends, in place of the state written, for an
 * effect that is a route and not a state.
 * A morph carries an outgoing element to the place of the incoming one,
 * and the element is back at rest once the animation is over,
 * which is when the crossfade has made it transparent.
 *
 * `hold` states a value that a property keeps for the whole effect, in place of the state
 * written, for a value that belongs to the route and not to the state.
 * A hand-over holds the outgoing rendering below the incoming one at opacity 1 until it ends,
 * and an element it draws once at opacity 0.

  effects,
  element,
  to,
  options = null,
  { start = null, end = null, hold = null } = {},
) {
  let own = effects.get(element);
  if (own === undefined) {
    own = new Map();
    effects.set(element, own);
  }
  for (const [property, value] of Object.entries(to)) {
    const timing = options?.[property] ?? null;
    const held = timing === null ? null : (hold?.[property] ?? null);
    const from =
      timing === null

        : (held ?? start?.[property] ?? showing(element, [property])[property]);
    own.set(property, { to: value, timing, from, end: held ?? end?.[property] ?? null, held });
  }
}

/**
 * Apply the effects of a step: write every style, then animate into it.
 *
 * Every element the step touches loses the animations it was running, because the style
 * written here is where they were going and the animation created here starts from where
 * they had got to.
 */

    for (const animation of element.getAnimations()) {
      animation.cancel();
    }
    for (const [property, effect] of own) {
      element.style.setProperty(property, effect.to);
    }
  }
  // The styles are read after every write of the step, and before any animation is created,
  // so that the engine recalculates style once.
  // An animation created between two reads makes the second one recalculate the style of the
  // page again, which costs a step of a few thousand elements seconds in chromium 151.
  const animations = [];
  for (const [element, own] of effects) {
    const names = [...own].filter(([, effect]) => effect.timing !== null).map(([name]) => name);
    if (names.length === 0) {
      continue;
    }
    // The animation starts from what the element now computes, rather than from what was
    // just written, because an engine normalises what it computes.
    // Chromium 151 gives back `0px` for the `0px 0px` of a tag at rest,
    // so comparing the two spellings finds a difference where there is none.
    // An effect that states an `end` ends there instead, and is not read at all, which
    // is what keeps a morph of a few thousand glyphs from reading as many styles.
    const unstated = names.filter((name) => own.get(name).end === null);
    const shown = unstated.length === 0 ? {} : showing(element, unstated);
    const into = Object.fromEntries(names.map((name) => [name, own.get(name).end ?? shown[name]]));
    // Only the properties this step actually changes are animated, because in chromium 151 a
    // `translate` or `scale` that is equal at both ends stops the browser from drawing the
    // `opacity` beside it, and the element stays as it was until the step ends and then jumps.
    // Measured; see *Findings*.
    // A held property is the exception, because it is equal at both ends by design.
    const changed = names.filter(
      (name) => own.get(name).held !== null || own.get(name).from !== into[name],
    );
    // There is one effect per group of properties that are timed alike, so that a step whose
    // operations are timed alike, which is every step that says nothing about timing, is
    // still one animation on this element.
    const groups = new Map();
    for (const name of changed) {
      const key = JSON.stringify(own.get(name).timing);
      const found = groups.get(key);
      if (found === undefined) {
        groups.set(key, { timing: own.get(name).timing, names: [name] });
      } else {
        found.names.push(name);
      }
    }
    for (const group of groups.values()) {
      const frame = (pick) =>
        Object.fromEntries(group.names.map((name) => [keyframeName(name), pick(name)]));
      animations.push([
        element,
        [frame((name) => own.get(name).from), frame((name) => into[name])],
        { ...group.timing, id: ANIMATION_ID },
      ]);
    }
  }
  for (const [element, keyframes, options] of animations) {
    element.animate(keyframes, options);
  }
}

// What a state of a slide looks like on the page: where each position puts what it addresses,
// the CSS of a tag's display state and of a pan, the anchors a position is relative to, and
// `planState`, which plans one state of a slide on its canvas and on every tag it addresses.

/** The canvas origin, which is the anchor a position with no `relto` is measured from. */
const ORIGIN = { x: 0, y: 0 };

/** The values an engine computes for the `scale` of an element at its unscaled size. */

 * Where one position puts what it addresses, in typst points.
 *
 * `anchor(relto) + offset - anchor(self)`, where the anchor of `null` is the canvas origin.
 * `self` is the moved tag, or `null` for the viewport, which is anchored at the origin too.
 * A pair whose `relto` names the moved tag is therefore the identity, which is what a tag
 * the timeline never moved carries, and it needs no anchor to resolve.
 *
 * An anchor the page does not have leaves the offset alone, which can only happen on a page
 * edited by hand, because typst refuses a timeline relative to a tag its slide does not have.
 */

  const own = self === null ? null : (slide.anchors.get(self) ?? null);
  const along = (which) => {
    const axis = position?.[which];
    if (axis === undefined) {
      return 0;
    }
    if (axis.relto === self) {
      return axis.offset;
    }
    const target = axis.relto === null ? ORIGIN : (slide.anchors.get(axis.relto) ?? null);

      return axis.offset;

 * The CSS of one tag's display state.
 *
 * The CSS uses only the individual transform properties and never the `transform` shorthand,
 * which would clobber the positioning typst wrote on the labelled group that holds this one.
 * A length inside a frame's SVG is a user unit, which is a typst point, so a move stays
 * the same fraction of the slide at any window size without the runtime measuring one.
 *
 * The CSS has one `scale` value rather than two while the two axes agree, because a property whose
 * keyframes are equal at both ends stops the browser from drawing the ones beside it
 * (see *Findings*), and the engines do not compute `1 1` to the same string, so a tag at
 * rest would otherwise look like a tag that changed.

    opacity: display.hidden ? "0" : "1",

/**

 * about on paper.
 *
 * That point is the centre of the box typst laid out on an axis the tag was not placed on,
 * and the start of that box on an axis it was placed on with `x`, `y` or `relto`,
 * so that the corner the timeline put on a target stays there at any factor.
 * An axis whose anchor is the tag itself was never placed, whatever `dx` or `dy` shifted it.
 *
 * The box is the one typst laid out, and the ink of the slot need not fill it.
 * Its far corner is the origin of the `animo-corner` marker that typst places beside the slot.
 * The slot carries no transform attribute, so its box starts at the origin of the group the
 * two share, and under `transform-box: view-box` an origin in `px` is a point of the user space
 * of that group.

 * ink without the transform attributes of the elements inside the slot. See *Findings*.

 * and never as a rule in the stylesheet.

 * properties beside it, so a selector broad enough to reach a group typst positioned
 * displaces that group, silently and with no transform property set at all.

 * too, and its children are the region's content. See *Findings*.

    // and the slot grows about a point of the box of its ink.

/**

 *
 * A position is `anchor(relto) + offset - anchor(self)`,

/**

 * counts as epoch 0, because the body around the stacks is laid out once for all epochs.

 * not have.

 * the site a paged output reads in the first page that lays the tag out. Document order alone
 * would put a site that only a later epoch lays out first, when it comes earlier in the body.
 * A tag that holds an epoch stack has a slot in every rendering of the stack, and
 * its group is the one around the stack.

 *
 * The anchor is the origin of the tag's labelled group, which is the top-left corner of the
 * wrapper typst laid out, and not the box of its ink.

 * so the two targets resolve the same quantity rather than two neighbours.

 * origin is the canvas origin, so the pan of the canvas cancels out of it.
 * `firstSite` says which site is the first.

      // page edited by hand, and the position resolves as if nothing were relative to a tag.
      anchors.set(name, null);
      continue;

    const frame = group.ownerSVGElement.getScreenCTM().inverse();
    const corner = frame.multiply(group.getScreenCTM());

  // deck's margin in from the canvas origin. An axis measured from the origin itself is
  // already the position of the viewport.
  const along = (which) =>
    state.pan?.[which]?.relto == null ? at[which] : at[which] - slide.margin;

 * tag it addresses.

 * everything the frame holds and keeps the renderings of every stack registered.

 * replaces and moves a tag moves it by the same amount in the rendering it leaves and in
 * the one it arrives at.

 * browser starts them all on the same frame.

 * two a step runs between, forwards and backwards alike.

 * separate schedule.
 * A backward step that walked over a join runs between states that are not neighbours,
 * and the schedules of the steps it walked over are not replayed one by one.
 * What the audience saw across a join was one motion redirected before it arrived,
 * which neither schedule replayed on its own reproduces, so the way back is one motion too.
 *

 * mirrored about the length of the step it undoes, so the operation that arrived last is
 * the one that leaves first, and the step ends where the earlier state began.

    reverse && options !== null ? span(slide.states[step]?.span, options) : null;

      ? null

  }
  for (const [name, display] of Object.entries(state.tags ?? {})) {
    const own = timings.tags?.[name] ?? {};
    const timed =
      options === null
        ? null
        : {
            opacity: scheduled(options, own.opacity, mirror),
            translate: scheduled(options, own.translate, mirror),
            scale: scheduled(options, own.scale, mirror),

    for (const element of slide.slots.get(name) ?? []) {
      const { "transform-box": box, "transform-origin": point } = growth(element, name, display);
      plan(effects, element, { "transform-box": box });
      // The origin changes with the placement, which only a `move` changes, so it travels
      // on the timing of the `translate` beside it, and the corner of a scaled tag goes
      // to its target without a jump.
      // An origin makes no difference to an element at its unscaled size, so such an
      // element takes the new origin at once, and the corner of a tag that the same step
      // places and scales goes to its target in a straight line.
      // An element that has no origin yet takes the first one without travelling as well,
      // because the origin it computes until then is no point the audience saw.

// How a step crosses a boundary, of an epoch inside a slide and of a slide inside the deck.
//
// A slide is one `html.frame` holding one rendering of its body, and every region whose
// content changes holds an epoch stack in its footprint.
// The stack holds one rendering of the region per content state, of which one is shown at a
// time. A step that stays inside an epoch touches
// only the display state of the renderings already shown. A step that crosses a boundary
// carries the stacks that hold what changed from the outgoing rendering to the incoming one,
// which is what `transitions` below does, and every other stack shows the rendering of the
// epoch being entered without animating, because its renderings are the same picture.
//
// A slide boundary is the same mechanism one container out, and it is the whole container
// that crosses, because two slides share nothing to hold still. Two slides are laid out
// while they cross and no more: laying every slide of a deck out for the whole session
// costs a long deck seconds of first paint, which is paid at every reload of the live
// preview. See *Findings*.

/**
 * How a step carries an epoch stack from the outgoing rendering to the incoming one.
 *
 * There is one entry per transition, and the plan names the one each stack takes.
 * The record of a stack that a boundary crosses has an optional `transition`, which is the
 * name of an entry here, and an optional `args`, which is handed to the transition as part
 * of the record. A stack with
 * no `transition` crossfades, so a plan that names none is the plan of a deck in which every
 * boundary crossfades.
 *
 * `planEpoch` has already planned the state at rest of every rendering of the stack when a
 * transition runs.
 * The rendering being entered is shown and opaque, and every other rendering is hidden and
 * transparent. A transition plans effects for the renderings it carries in place
 * of those, and an effect it plans replaces the one at rest for the same element and
 * property.
 *
 * Each transition is handed the effects of the step being planned, the slide, the stack, the
 * epoch a step leaves and the one it enters, the record of the stack, how the step moves and
 * how long it lasts when it is running backwards, and takes what it needs of that.
 * It runs in the phase that reads and writes nothing, so any geometry it reads is the
 * geometry of the page before the step.
 *
 * A transition plans the state it is arriving at and animates from what the element was
 * showing into it, exactly as a display state is planned, so an interrupted boundary
 * continues from where it is and stepping backwards undoes it.
 */
const transitions = {
  /**
   * Fade the outgoing rendering of the stack out and the incoming one in, and draw the ink
   * that the two have in common at one place once, which `handOver` plans.
   *
   * A delayed crossfade starts late and a long one takes long, and either holds the boundary
   * open.
   * An outgoing rendering stays visible for the whole of the delay and the whole of the
   * duration.
   */
  crossfade(effects, slide, context) {
    const timing = scheduled(context.options, context.record.timing, context.mirror);
    if (timing !== null) {
      handOver(effects, slide, context, timing, inPlace(context));
    }
  },
  /**
   * Carry what the two renderings of the stack share from its old place to its new one, which
   * `morphStack` plans, and hand the rest over as the crossfade does.
   */
  morph(effects, slide, context) {
    const timing = scheduled(context.options, context.record.timing, context.mirror);
    if (timing !== null) {
      handOver(effects, slide, context, timing, morphStack(effects, slide, context, timing));
    }
  },
};

/**
 * Plan how the renderings of a stack hand the region over on `timing`, given the pairs of an
 * outgoing and an incoming element that a transition puts at one place.
 *
 * Of the outgoing and the incoming rendering, the one that comes first in the document is
 * drawn below the other.
 * The lower rendering stays opaque for the whole hand-over, and the upper one fades, in on a
 * forward step and out on a backward one.
 * Where both renderings have ink, the upper ink at opacity `t` over the opaque lower ink
 * shows the interpolation of the two, so nothing dips and nothing blends.
 * A pair whose two elements are identical copies is drawn once.
 * The upper copy is hidden for the length of the hand-over and takes no route, and the lower
 * copy is the one the audience sees.
 * The ink of the lower rendering without a partner fades on its own, out when that rendering
 * is the outgoing one and in when it is the incoming one.
 * Where it overlaps different ink of the upper rendering, the two dissolve as any two layers
 * do.
 *

 * every frame of a morph of a long paragraph cost several times as much, and every frame of a
 * crossfade about three times as much. Drawing an identical copy once halves what a morph
 * moves, which firefox needs as well. See *Performance* for the measurements.
 *
 * Every other rendering that is showing any ink fades out on the boundary's clock. A boundary
 * crossed while an earlier one is still running finds such a rendering, which is what a long
 * `duration:` on a `replace` makes easy to reach and what a `wait:` shorter than a step or a
 * presenter clicking twice reaches as well. A rendering that is hidden has nothing to hand
 * over and stays hidden where it is.
 */
function handOver(effects, slide, { stack, from, to }, timing, pairs) {
  const outgoing = stack.renderings[from];
  const incoming = stack.renderings[to];
  let lower = null;
  if (outgoing !== undefined && incoming !== undefined) {
    const follows = outgoing.compareDocumentPosition(incoming) & Node.DOCUMENT_POSITION_FOLLOWING;
    lower = follows ? outgoing : incoming;
  }
  stack.renderings.forEach((rendering, epoch) => {
    const active = epoch === to;
    const state = { visibility: "visible", opacity: active ? "1" : "0" };
    const painting = getComputedStyle(rendering).visibility === "visible";
    if (rendering === lower) {
      // The rendering below is opaque for the whole hand-over. An incoming one that was not
      // painting is opaque at once, and one that an interrupted hand-over left partly faded
      // becomes opaque on the way. An outgoing one stays opaque until the hand-over ends.
      const opaque = showing(rendering, ["opacity"]).opacity === "1";
      if (active) {
        plan(effects, rendering, state, painting ? { opacity: timing } : null);
      } else {
        plan(effects, rendering, state, { opacity: timing }, opaque
          ? { hold: { opacity: "1" } }
          : { end: { opacity: "1" } });
      }
    } else if (active || painting) {
      plan(effects, rendering, state, { opacity: timing });
    }
  });
  if (lower === null) {
    return;
  }
  const upper = lower === outgoing ? incoming : outgoing;
  const below = (pair) => (lower === outgoing ? pair.outgoing : pair.incoming);
  const above = (pair) => (lower === outgoing ? pair.incoming : pair.outgoing);
  const copies = pairs.filter((pair) => pair.same).map(above);
  const hidden = gathered(slide, new Set(copies.flatMap((copy) => free(slide, copy))), upper);
  for (const element of hidden) {
    plan(effects, element, { opacity: "" }, { opacity: timing }, { hold: { opacity: "0" } });
    slide.handed.add(element);
  }
  for (const pair of pairs) {
    if (pair.same) {
      const element = above(pair);
      let holder = element;
      while (holder !== null && !hidden.has(holder)) {
        holder = holder.parentElement;
      }
      slide.standIns.set(element, { partner: below(pair), holder: holder ?? element });
    }
  }
  // A hidden element takes no route, because the copy below it carries what it shows.
  for (const [element, record] of slide.morphed) {
    if (record.stack === stack && within(element, hidden)) {
      const names = ["translate", ...Object.keys(record.shape ?? {})];
      plan(effects, element, Object.fromEntries(names.map((name) => [name, ""])));
      slide.morphed.delete(element);
    }
  }
  const [start, end] = lower === outgoing ? ["1", "0"] : ["0", "1"];
  for (const element of gathered(slide, new Set(ink(lower, new Set(pairs.map(below)))), lower)) {
    // An element that an interrupted hand-over was fading goes on from what it shows.
    const fresh = !slide.handing.has(element);
    plan(effects, element, { opacity: "" }, { opacity: timing }, {
      start: fresh ? { opacity: start } : null,
      end: { opacity: end },
    });
    slide.handed.add(element);
  }
}

/**
 * The pairs of an outgoing and an incoming element that draw the same ink at the same place,
 * which is what a crossfade draws once.
 *
 * Typst writes the same layout as the same attributes, so the place of an element is the
 * chain of its ancestors' `transform` and `clip-path` up to the rendering, with its own `x`,
 * `y` and `transform`, and no geometry is read from the page.
 * The labels on that chain belong to the place as well, because the display state of a tag
 * goes on its slot, and two copies under two tags may be shown differently.
 * A pair of the same place and shape whose paint differs is not identical, and the copy of
 * the upper rendering fades over the other one.
 */
function inPlace({ stack, from, to }) {
  const outgoing = stack.renderings[from];
  const incoming = stack.renderings[to];
  if (outgoing === undefined || incoming === undefined) {
    return [];
  }
  const chains = new Map();
  const chain = (node, rendering) => {
    if (node === rendering) {
      return "";
    }
    let found = chains.get(node);
    if (found === undefined) {
      const own = ["transform", "clip-path", "data-typst-label"].map(
        (name) => node.getAttribute(name) ?? "",
      );
      found = `${chain(node.parentElement, rendering)}/${own.join(" ")}`;
      chains.set(node, found);
    }
    return found;
  };
  const place = (element, rendering) => {
    const own = ["x", "y", "transform"].map((name) => element.getAttribute(name) ?? "");
    return `${chain(element.parentElement, rendering)}|${inkKey(element)}|${own.join(" ")}`;
  };
  const waiting = new Map();
  for (const element of ink(incoming, new Set())) {
    const key = place(element, incoming);
    waiting.set(key, [...(waiting.get(key) ?? []), element]);
  }
  const pairs = [];
  for (const element of ink(outgoing, new Set())) {
    const partner = waiting.get(place(element, outgoing))?.shift();
    if (partner !== undefined) {
      const same = PAINT.every((name) => element.getAttribute(name) === partner.getAttribute(name));
      pairs.push({ outgoing: element, incoming: partner, same });
    }
  }
  return pairs;
}

/**
 * Whether a hand-over may write the opacity of an element, which is when nothing else writes
 * it.
 *
 * The display state of a tag goes on its slot, and a subslide stack shows its renderings with
 * their opacity, so neither is free.
 */
function isFree(slide, element) {
  return !slide.slotted.has(element) && stackLabel(element.dataset.typstLabel) === null;
}

/** An element whose opacity a hand-over may write, or else the children that stand for it. */
function free(slide, element) {
  if (isFree(slide, element)) {
    return [element];
  }
  return Array.from(element.children)
    .filter((child) => !NOT_INK.has(child.localName))
    .flatMap((child) => free(slide, child));
}

/**
 * The elements of a set, with each group whose children are all in it standing in for them.
 *
 * One animation on a group costs less than one on each of its children, and typst draws a line
 * of text as a group of glyphs, so a paragraph is a few groups rather than a few thousand
 * glyphs.
 * Only a group that `isFree` stands in for its children.
 * `rendering` is where the walk up stops.
 */
function gathered(slide, elements, rendering) {
  const found = new Set(elements);
  let parents = new Set(Array.from(found, (element) => element.parentElement));
  while (parents.size > 0) {
    const next = new Set();
    for (const parent of parents) {
      if (
        parent === null ||
        parent === rendering ||
        found.has(parent) ||
        !isFree(slide, parent)
      ) {
        continue;
      }
      const children = Array.from(parent.children).filter(
        (child) => !NOT_INK.has(child.localName),
      );
      if (children.every((child) => found.has(child))) {
        for (const child of children) {
          found.delete(child);
        }
        found.add(parent);
        next.add(parent.parentElement);
      }
    }
    parents = next;
  }
  return found;
}

/**
 * Plan every element that an earlier hand-over still hides or fades back to rest, before a
 * step.
 *
 * A hand-over this step plans again replaces what is planned here, so an element it hides
 * again is never shown in between.
 * `slide.handing` keeps those elements for the length of the step, because a fade that goes on
 * starts from what its element shows.
 * `slide.shownBy` keeps the partners that showed the hidden elements, which a morph of this
 * step starts from, while `slide.standIns` collects the partners of this step.
 */
function settleHandOvers(effects, slide) {
  slide.handing = new Set();
  for (const element of slide.handed) {
    if (element.getAnimations().some(ours)) {
      plan(effects, element, { opacity: "" });
      slide.handing.add(element);
    }
  }
  slide.handed = new Set();
  slide.shownBy = slide.standIns;
  slide.standIns = new Map();
}

/** The transition a stack takes when its record names none, which is every ordinary one. */
const defaultTransition = "crossfade";

/**
 * The transition of an epoch boundary by the name the record of a stack carries.
 *
 * A name typst does not know is refused at compile time, so nothing unknown arrives, and a
 * record that names none takes the default.
 */
function transitionOf(name) {
  return transitions[name] ?? transitions[defaultTransition];
}

/**
 * How a step gets from one slide to the next.
 *
 * This is a separate table rather than an entry in the one above, because the two are
 * handed different things and neither could use the other's.
 * An epoch transition is given the renderings of one region, inside a slide that it holds
 * still.
 * A slide transition is given two containers and has nothing to hold still, since the two
 * slides share nothing. One
 * table would take the union of both and every entry would ignore half of it.
 *
 * A slide transition is a function of the boundary's owner, which is the slide with the
 * higher number, and of a progress `p` that is 0 where the owner is not there yet and 1 where it
 * is. `at(p, args)` gives the display state of the owner and of the other slide at one of
 * those two ends, and `planSlides` animates from what each container is showing into the
 * end a step is heading for. A forward step heads for 1 and a backward step for 0, so a
 * backward step is the forward one played from the other end and needs no direction of its
 * own. The owner comes later in the document, so it is in front in both directions.
 *
 * `blend` is the `mix-blend-mode` both containers take for the boundary, and the empty
 * string leaves the stylesheet's `plus-lighter`. Two slides that overlap while both are
 * opaque have to cover rather than add, because two opaque grounds of different colors sum
 * to a third color. A crossfade is the one transition that wants them to add.
 *
 * `front` is the role of the slide that is in front, which is the owner unless an entry
 * says otherwise. The owner comes later in the document, so it is in front without a
 * `z-index`, and only an entry that wants the other slide in front needs one.
 *
 * A `direction` is the direction of travel on a forward step, which typst writes as `ltr`,
 * `rtl`, `ttb` or `btt`. Typst states every parameter, its defaults included, so the
 * runtime holds no defaults.
 */
const slideTransitions = {
  /**
   * Fade the owner in over the other slide, which fades out.
   *
   * The two add to exactly one opaque slide at every moment through the `plus-lighter` the
   * stylesheet puts on every slide, so nothing dips halfway through, which two slides of
   * different background colors would otherwise do badly.
   */
  crossfade: {
    blend: "",
    at: (p) => ({ owner: { opacity: String(p) }, other: { opacity: String(1 - p) } }),
  },
  /** Move the owner in from one edge while it moves the other slide out at the opposite one. */
  push: {
    blend: "normal",
    at: (p, { direction }) => ({
      owner: { opacity: "1", translate: travelled(direction, p - 1) },
      other: { opacity: "1", translate: travelled(direction, p) },
    }),
  },
  /** Move the owner in from one edge over the other slide, which stays where it is. */
  cover: {
    blend: "normal",
    at: (p, { direction }) => ({
      owner: { opacity: "1", translate: travelled(direction, p - 1) },
      other: { opacity: "1" },
    }),
  },
  /**
   * Move the other slide out at one edge over the owner, which stays where it is.
   *
   * This is a cover played with the two slides swapped, so the other slide is in front.
   */
  uncover: {
    blend: "normal",
    front: "other",
    at: (p, { direction }) => ({
      owner: { opacity: "1" },
      other: { opacity: "1", translate: travelled(direction, p) },
    }),
  },
  /**
   * Show the owner over the other slide behind an edge that travels across the stage.
   *
   * The clip is an `inset` whose one side shrinks from the whole stage to nothing, and the
   * other three sides stay at zero, so the two ends of the boundary interpolate.
   */
  wipe: {
    blend: "normal",
    at: (p, { direction }) => ({
      owner: { opacity: "1", "clip-path": hidden(direction, 1 - p) },
      other: { opacity: "1" },
    }),
  },
};

/** The way each direction travels, as a fraction of the stage along each axis. */
const TRAVEL = {
  ltr: { x: 1, y: 0 },
  rtl: { x: -1, y: 0 },
  ttb: { x: 0, y: 1 },
  btt: { x: 0, y: -1 },
};

/**
 * A `translate` that has carried a container `fraction` of the stage along a direction.
 *
 * A percentage of the box of a container is a fraction of the stage, because a slide fills
 * it, so a pushed slide keeps its place at any window size without the runtime measuring
 * one.
 *
 * No travel is the empty string, which is the slide at rest, rather than a translate of
 * zero. An engine computes the two to different strings, so the next boundary would find a
 * difference where there is none and animate a property that does not change, which in
 * chromium 151 stops the `opacity` beside it from being drawn. See *Findings*.
 */
function travelled(direction, fraction) {
  const { x, y } = TRAVEL[direction];
  return fraction === 0 ? "" : `${100 * x * fraction || 0}% ${100 * y * fraction || 0}%`;
}

/**
 * A `clip-path` that hides the part of a container that an edge travelling along a
 * direction has not reached, which is `fraction` of the stage.
 *
 * The side clipped is the one the edge travels towards. The sides follow the order of
 * `inset`: top, right, bottom, left. Nothing hidden is the slide at rest, for the reason
 * `travelled` gives.
 */
function hidden(direction, fraction) {
  if (fraction === 0) {
    return "";
  }
  const side = { ltr: 1, rtl: 3, ttb: 2, btt: 0 }[direction];
  const sides = [0, 0, 0, 0];
  sides[side] = 100 * fraction;
  return `inset(${sides.map((value) => `${value}%`).join(" ")})`;
}

/** The transition a boundary takes when neither its slide nor the deck names one. */
const defaultSlideTransition = "crossfade";

/**
 * The transition the boundary above one slide takes, as `{name, args}`, or `null` for a
 * slide the deck does not have.
 *
 * `auto` resolves here rather than in typst, to the default transition of the deck, which
 * the deck states in its configuration and which is the crossfade on a page that states none.
 * A `duration` the slide's `init` states travels in `args` either way, because it belongs
 * to the slide rather than to the transition.
 * A name or a parameter typst does not know is refused at compile time, so nothing unknown
 * arrives.
 */
function slideTransitionOf(number) {
  const slide = deck.get(number);
  if (slide === undefined) {
    return null;
  }
  if (slide.transition.name !== "auto") {
    return slide.transition;
  }
  const { name = defaultSlideTransition, ...args } = config.transition ?? {};
  return { name, args: { ...args, ...slide.transition.args } };
}

/**
 * How a boundary that takes a transition is crossed, or `null` when it cuts.
 *
 * The deck's `--animo-transition-duration` is the default of a slide whose `init` states no
 * `duration`, and one it states overrides it, also when the deck's is zero, which is how a
 * deck of hard cuts pushes one slide in. A duration of zero is a cut, whatever the
 * transition. A reader who asked for less motion gets a cut everywhere, because `timing`
 * reads `--animo-motion` first.
 */
function boundaryTiming(transition) {
  if (transition === null) {
    return null;
  }
  const own = timing("--animo-transition-duration");
  if (own === null) {
    return null;
  }
  const { duration } = transition.args;
  const options = duration === undefined ? own : { ...own, duration: duration * 1000 };
  return options.duration > 0 ? options : null;
}

/**
 * Plan every slide container of the deck, and the boundary a step crosses between two.
 *
 * Every slide is planned at rest first.
 * At rest, the slide being shown is opaque, every other one is transparent, and none of them
 * is moved, clipped or blended by a transition. A slide that
 * becomes the one being entered therefore always starts from a state this function wrote.
 * The two slides a boundary crosses are then planned by its transition, in place of their
 * state at rest, and the properties of theirs that their transition does not name move to
 * rest on the boundary's clock. That is what takes a slide that a push left half way out of
 * the stage back into it when a crossfade interrupts the push.
 *
 * `options` is how the boundary moves, or `null` when it snaps, which is what a cut, a
 * duration of zero, a deep link and any jump between slides that are not neighbours all
 * produce. A boundary that snaps leaves both slides at rest.
 *
 * Each container animates from what it is showing, so an interrupted boundary continues
 * from where it is and stepping back undoes it. The exception is a slide in `fresh`, which
 * had no layout before this step and shows nothing worth continuing from.
 * Such a slide starts at the far end of the transition instead, which for a push is outside
 * the stage.
 *
 * The transition's blend and `front` stay on the two slides after the boundary has been
 * crossed, for as long as the slide being left keeps its layout. A slide that a cover or a
 * wipe has covered is still laid out under the owner, and under `plus-lighter` the two would
 * add. An owner that a backward uncover has covered is laid out under the other slide, and
 * without the `z-index` it would be in front again.
 */
function planSlides(effects, shown, leaving, options, transition, fresh) {
  for (const [number, slide] of deck) {
    const rest = { opacity: number === shown ? "1" : "0", translate: "", "clip-path": "" };
    const crossing = options !== null && (number === shown || number === leaving);
    plan(effects, slide.element, rest, crossing ? timed(rest, options) : null);
    // A blend and a stacking order are not animated, because no value between two of them
    // exists.
    plan(effects, slide.element, { "mix-blend-mode": "", "z-index": "" });
  }
  if (options === null || leaving === null) {
    return;
  }
  const entry = slideTransitions[transition.name] ?? slideTransitions[defaultSlideTransition];
  const { args } = transition;
  const owner = Math.max(shown, leaving);
  const p = shown === owner ? 1 : 0;
  const end = entry.at(p, args);
  const start = entry.at(1 - p, args);
  for (const [number, role] of [
    [owner, "owner"],
    [Math.min(shown, leaving), "other"],
  ]) {
    const element = deck.get(number).element;
    plan(effects, element, end[role], timed(end[role], options), {
      start: fresh.has(number) ? start[role] : null,
    });
    plan(effects, element, {
      "mix-blend-mode": entry.blend,
      "z-index": role === "other" && entry.front === "other" ? "1" : "",
    });
  }
}

/** One options object per property of a display state, which is what `plan` takes. */
function timed(state, options) {
  return Object.fromEntries(Object.keys(state).map((property) => [property, options]));
}

/**
 * What an epoch stack needs beside its renderings, read once with the slide.
 *
 * `region` is the label of the group of the region that holds the stack, which for a tag
 * whose content changes is the tag, and `names` is that label and every label laid out in
 * the renderings. A boundary crosses the stack when it changes one of these names, or a tag
 * that becomes no group in the region the plan names by `region`. `differs` holds, per
 * epoch, whether the rendering of that epoch differs from the one before, which is read the
 * first time a boundary asks.
 */
function readEpochStack(stack) {
  stack.names = new Set();
  stack.region = stack.element.closest("[data-typst-label]")?.dataset.typstLabel ?? null;
  if (stack.region !== null) {
    stack.names.add(stack.region);
  }
  stack.renderings.forEach((rendering) => {
    for (const group of rendering.querySelectorAll("[data-typst-label]")) {
      stack.names.add(group.dataset.typstLabel);
    }
  });
  stack.differs = [];
}

/**
 * Whether the rendering of an epoch differs from the one before it in a stack.
 *
 * A rendering that laid nothing out is not in the page, and two such renderings are the same.
 * The labelled groups of two renderings differ in their labels, so their children are
 * compared. The runtime writes the same inline style on every occurrence of a tag, so the
 * style it has written by then differs nowhere the content does not.
 */
function differs(stack, epoch) {
  let found = stack.differs[epoch];
  if (found === undefined) {
    const before = stack.renderings[epoch - 1];
    const after = stack.renderings[epoch];
    if (before === undefined || after === undefined) {
      found = before !== after;
    } else {
      const a = Array.from(before.childNodes);
      const b = after.childNodes;
      found = a.length !== b.length || a.some((node, i) => !node.isEqualNode(b[i]));
    }
    stack.differs[epoch] = found;
  }
  return found;
}

/**
 * The epoch stacks a step carries across the boundaries it crosses, each with its record, as
 * a map, and every hand-over and morph an earlier step left running planned for this one.
 *
 * A stack is carried when a boundary changes a tag it holds, which is a tag whose group is
 * in the stack or a tag without a group that the plan places in the stack's region. It is
 * also carried when its renderings on the two sides of the boundary differ. Its record is
 * the plan's record of the first tag the boundary changes in it, and `names` holds every tag
 * the step changes in it, which a morph does not match. The operations of one stack agree
 * about the timing and the transition, because typst refuses a boundary otherwise. A stack
 * whose renderings differ while the plan names no tag of it, which is a region whose site
 * typst had not reported when it wrote the plan, crossfades on the default timing of the deck.
 *
 * A step that animates hands over every boundary between the two epochs, which is one for an
 * ordinary step and several for a backward step that walked over a join. A step that snaps
 * hands over none, which is what a deep link and a clamped fragment get.
 *
 * A step over more than one boundary drops the timings of the operations that opened them,
 * as it drops the schedules of the steps it walked over, because those steps are ones the
 * deck ran through, and the one clock left is the clock of this step.
 * A stack that two of the boundaries change takes the record of the first.
 */
function planBoundary(effects, slide, { index, from, options, mirror }) {
  const to = slide.states[index]?.epoch ?? 0;
  const carried = new Map();
  if (options !== null && from !== null && from !== to) {
    const walked = Math.abs(to - from) > 1;
    for (let epoch = Math.min(from, to) + 1; epoch <= Math.max(from, to); epoch += 1) {
      const { changed, regions } = slide.epochs[epoch] ?? { changed: {}, regions: {} };
      for (const stack of slide.stacks) {
        if (stack.kind !== "epoch") {
          continue;
        }
        const names = Object.keys(changed).filter((name) => stack.names.has(name));
        if (Object.hasOwn(regions, stack.region) && !names.includes(regions[stack.region])) {
          names.push(regions[stack.region]);
        }
        const found = carried.get(stack);
        if (found !== undefined) {
          found.names.push(...names.filter((name) => !found.names.includes(name)));
          continue;
        }
        if (names.length === 0 && !differs(stack, epoch)) {
          continue;
        }
        const { timing, ...untimed } = names.length === 0 ? {} : changed[names[0]];
        const record = { ...untimed, names };
        if (!walked && timing !== undefined) {
          record.timing = timing;
        }
        carried.set(stack, record);
      }
    }
  }
  // The earlier hand-overs and morphs are settled before the transitions, so that a transition
  // of this step that hides, fades or matches an element again plans it in place of what an
  // earlier one was doing to it.
  settleHandOvers(effects, slide);
  settleMorphs(effects, slide, to, carried, options, mirror);
  return carried;
}

/**
 * Plan the rendering of an epoch stack that a state belongs to, which is how an epoch stack
 * is planned for a state.
 *
 * Which rendering is shown is decided here, for every transition alike.
 * The rendering of the epoch the state belongs to is shown and opaque,
 * and every other one is hidden and transparent.
 * That is the state at rest, and a stack that the step carries across a boundary is then
 * planned by the transition its record names, in place of its state at rest. One boundary
 * may therefore carry one stack with one transition and another stack with another.
 *
 * A step that stays inside one epoch still plans this, because the rendering it is showing
 * is already the right one and writing the state it is in changes nothing.
 * Such a step that interrupts a hand-over takes the stack to rest at once, together with
 * every element the hand-over hid or faded, which `settleHandOvers` plans.
 */
function planEpoch(effects, slide, stack, { index, from, options, mirror }, carried) {
  const to = slide.states[index]?.epoch ?? 0;
  stack.renderings.forEach((rendering, epoch) => {
    const active = epoch === to;
    plan(effects, rendering, {
      visibility: active ? "visible" : "hidden",
      opacity: active ? "1" : "0",
    });
  });
  const record = carried.get(stack);
  if (record !== undefined) {
    transitionOf(record.transition)(effects, slide, { stack, from, to, record, options, mirror });
  }
}
