><mo form="prefix">−</mo><mfrac><msub><mi>𝑊</mi><mrow><msub><mi>𝑞</mi><mn>2</mn></msub><mo rspace="0em">,</mo><mi>∞</mi><mo lspace="0em" rspace="0em" stretchy="false">→</mo><mi>𝐵</mi></mrow></msub><msub><mi>𝑞</mi><mn>2</mn></msub></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mo form="prefix">−</mo><mn>30</mn><mspace width="0.2222em"/><mtext>V</mtext></mtd></mtr></mtable></math><br></p><p>由于<math><msub><mi>𝜑</mi><mi>∞</mi></msub><mo>=</mo><mn>0</mn><mo>></mo><msub><mi>𝜑</mi><mi>𝐵</mi></msub><mo>></mo><msub><mi>𝜑</mi><mi>𝐴</mi></msub></math>，所以场源电荷是负电荷，且在A 点的左边。</p></div></figure><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><p><strong>问题</strong> 4.<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>一个电场中有A、B 两点，电荷量 q1 为<math><mn>2</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>9</mn></mrow></msup></math> C 的试探电荷放在电场中的 A 点，具有 <math><mi>－</mi><mn>4</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></math> J 的电势能；q2 为<math><mi>－</mi><mn>3</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>9</mn></mrow></msup></math> C 的试探电荷放在电场中的 B 点，具有<math><mn>9</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></math> J 的电势能。现把 q3 为<math><mi>－</mi><mn>5</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>9</mn></mrow></msup></math> C 的试探电荷由A 点移到B 点，静电力做正功还是负功？数值是多少？<br><br><math><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝜑</mi><mi>𝐴</mi></msub></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mrow><msub><mi>𝑞</mi><mn>1</mn></msub><mo rspace="0em">,</mo><mi>𝐴</mi></mrow><mo>)</mo></mrow></mrow><msub><mi>𝑞</mi><mn>1</mn></msub></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mo form="prefix">−</mo><mn>20</mn><mspace width="0.2222em"/><mtext>V</mtext></mtd></mtr></mtable></math></p><p><math><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝜑</mi><mi>𝐵</mi></msub></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mrow><msub><mi>𝑞</mi><mn>2</mn></msub><mo rspace="0em">,</mo><mi>𝐵</mi></mrow><mo>)</mo></mrow></mrow><msub><mi>𝑞</mi><mn>2</mn></msub></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mo form="prefix">−</mo><mn>30</mn><mspace width="0.2222em"/><mtext>V</mtext></mtd></mtr></mtable></math></p><p><math><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝑊</mi><mrow><msub><mi>𝑞</mi><mn>3</mn></msub><mo rspace="0em">,</mo><mi>𝐴</mi><mo lspace="0em" rspace="0em" stretchy="false">→</mo><mi>𝐵</mi></mrow></msub></mtd><mtd><mo form="infix">=</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mrow><msub><mi>𝑞</mi><mn>3</mn></msub><mo>,</mo><mi>𝐴</mi></mrow><mo>)</mo></mrow><mo>−</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mrow><msub><mi>𝑞</mi><mn>3</mn></msub><mo>,</mo><mi>𝐵</mi></mrow><mo>)</mo></mrow></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><msub><mi>𝑞</mi><mn>3</mn></msub><mrow><mo>(</mo><mrow><msub><mi>𝜑</mi><mi>𝐴</mi></msub><mo>−</mo><msub><mi>𝜑</mi><mi>𝐵</mi></msub></mrow><mo>)</mo></mrow></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mo form="prefix">−</mo><mn>5</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup><mspace width="0.2222em"/><mtext>J</mtext></mtd></mtr></mtable></math></p></div></figure><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><p><strong>问题</strong> 5.<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>如图， A、B 为一对等量同种电荷连线上的两点（其中B 为中点），C 为连线中垂线上的一点。今将一个电荷量为q 的 C78D3DFD04F6E"/><radialGradient gradientTransform="scale(8.193031185 8.193031185)" id="rD0D7842EC9C1C572FDB03A2AF2F00BCE" href="#fECE872758F9179B3780B775ADFF03DB7" xlink:href="#fECE872758F9179B3780B775ADFF03DB7"/></defs></svg></div></div></figure><h3>电势差</h3><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><strong>练习</strong> 1.<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>在某电场中，已知A、B 两点之间的电势差<math><msub><mi>𝑈</mi><mtext>AB</mtext></msub></math> 为 20 V，q 为<math><mi>－</mi><mn>2</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>9</mn></mrow></msup></math> C 的电荷由A 点移动到B 点，静电力做的功是多少？电势能是增加还是减少，增加或者减少多少？<br><br><math><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝑊</mi><mtext>AB</mtext></msub></mtd><mtd><mo form="infix">=</mo><mi>𝑞</mi><msub><mi>𝑈</mi><mtext>AB</mtext></msub></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mo form="prefix">−</mo><mn>4</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup><mspace width="0.2222em"/><mtext>J</mtext></mtd></mtr></mtable></math><br>静电力做负功，电势能增加。<br><math><msub><mi>𝑊</mi><mtext>AB</mtext></msub><mo>=</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mi>𝐴</mi><mo>)</mo></mrow><mo>−</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mi>𝐵</mi><mo>)</mo></mrow></math><br><math><mo form="infix" lspace="0em" stretchy="false">⇒</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mi>𝐵</mi><mo>)</mo></mrow><mo>=</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mi>𝐴</mi><mo>)</mo></mrow><mo>−</mo><msub><mi>𝑊</mi><mtext>AB</mtext></msub></math><br>即电势能增加<math><mn>4</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></math> J。</div></figure><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><strong>练习</strong> 2.<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>在研究微观粒子时常用电子伏（eV）作为能量的单位。1 eV 等于一个电子经过1 V 电压加速后所增加的动能，那么，1 eV 等于多少焦耳？<br><br><math><mtable class="multiline-equation aligned"><mtr><mtd><mn>1</mn><mspace width="0.2222em"/><mtext>eV</mtext></mtd><mtd><mo form="infix">=</mo><mn>1.602</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup><mspace width="0.2222em"/><mtext>C</mtext><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">∗</mo><mn>1</mn><mspace width="0.2222em"/><mtext>V</mtext></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>1.602</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup><mspace width="0.2222em"/><mtext>J</mtext></mtd></mtr></mtable></math></div></figure><h3>电势差与电场强度的关系</h3></article></main></div></body></html>
