<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Step 1: include our secure javascript file -->
    <script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=55763aee98634a099c56284c0c015154"></script>

    <!-- Step 2: add an element to the page -->
    <div id="calculator" style="width: 100%; height: 500px;"></div>

    <!-- Step 3: add the following lines of javascript -->
    <script>
        var elt = document.getElementById('calculator');
        var calculator = Desmos.Calculator3D(elt);

      // 添加 3D 函数
        calculator.setExpression({ id: 'surface1', latex: 'z = \\sin(\\sqrt{x^2 + y^2})' });
        // calculator.setExpression({ id: 'plane1', latex: 'x+y+z=1' });

        setTimeout(function () {
            var hideBtn = document.querySelector('.dcg-action-hideexpressions');
            if (hideBtn) {
                // 方法1: 直接 click
                // hideBtn.click();

                // 方法2: 如果 click 无效，模拟 mousedown + mouseup
                hideBtn.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
                hideBtn.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));

                // 方法3: 触发 ontap（如果框架支持）
                // if (hideBtn.ontap) hideBtn.ontap();
            }
        }, 100);

        // Hide Desmos Trial Notice
        setTimeout(function () {
            var hideBtn = document.querySelector('.dcg-api-trial-notice-close');
            if (hideBtn) {
                hideBtn.click();
                console.log('Desmos Trial Notice hidden');
            } else {
                console.log('Desmos Trial Notice Hide button not found');
            }
        }, 100);

    </script>
</body>

</html>
