方案二： 在script.js中统一管理所有动画的可见性和启停。
问题：IntersectionObserver 只能观察 DOM 元素，但无法直接控制另一个文件中的 requestAnimationFrame 循环。
需要跨文件通信才能统一管理所有 three-animation 元素的动画启停，而且同样需要在每个动画文件中通过isIntersecting和isVisible控制动画启停。
这是更加复杂的方案，因为逻辑拆分在多个文件中，难以理解。
*/

function getLevel(heading) {
  return parseInt(heading.tagName[1], 10);
}

// 给每个 heading 生成id、添加numbering和data-original-text属性
function initHeadings() {
  const headings = Array.from(document.querySelectorAll("h2, h3, h4"));

  const counters = [];

  if (headings.length > 0) {
    headings.forEach((heading) => {
      const level = getLevel(heading);

      // 确保数组有足够的长度
      while (counters.length < level - 1) {
        counters.push(0);
      }
      // 截断到当前层级
      counters.length = level - 1;
      // 当前层级计数+1（用 level-2 作为索引）
      counters[level - 2] = counters[level - 2] + 1;

      const id = counters.join("-");
      heading.id = "heading-" + id;

      const numbering = counters.join(".");

      heading.setAttribute("data-original-text", heading.textContent);
      heading.setAttribute("data-numbering", numbering);
    });
  }
}

// 保存 heading 与 TOC 中 <a> 元素的映射，用于后续更新文本而不重建结构
const tocLinkMap = new Map();

function buildToc() {
  const headings = Array.from(document.querySelectorAll("h2, h3, h4"));
  const tocRoot = document.getElementById("toc-root");
  if (headings.length === 0) return;

  tocRoot.innerHTML = "";
  tocLinkMap.clear();

  const stack = [{ level: getLevel(headings[0]), ol: tocRoot }];

  headings.forEach((heading, index) => {
    const currentLevel = getLevel(heading);

    const arrow = document.createElement("span");
    arrow.classList.add("iconfont", "icon-arrow2");

    // 新建一个li元素，用于承载当前的heading元素
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#" + heading.id;

    // 保存映射关系，方便后续更新文本
    tocLinkMap.set(heading, a);

    // 判断当前 heading 后面是否存在层级更深的子 heading
    const nextHeading = headings[index + 1];
    const hasChildren = nextHeading && getLevel(nextHeading) > currentLevel;

    if (hasChildren) {
      a.appendChild(arrow);
    }
    li.appendChild(a);

    // 如果栈顶的heading level 大于 当前的heading level，让栈顶回退到栈顶level等于当前heading level的状态
    while (stack[stack.length - 1].level > currentLevel) {
      stack.pop();
    }

    if (currentLevel > stack[stack.length - 1].level) {
      // 如果当前的heading level 大于栈顶的heading level

      // 新建一个空的ol元素，挂在栈顶的ol元素的最后一个li元素下
      const newOl = document.createElement("ol");
      const parentLi = stack[stack.length - 1].ol.lastElementChild;
      if (parentLi) {
        parentLi.appendChild(newOl);
      }

      // 将当前的heading level 和 新建的ol元素压到栈顶
      stack.push({ level: currentLevel, ol: newOl });
    }

    // 将li元素添加到栈顶的ol元素下
    stack[stack.length - 1].ol.appendChild(li);
  });

  updateHeadingText();
}

// 只更新 TOC 和 heading 的文本内容，不重建 DOM 结构
function updateHeadingText() {
  const root = document.documentElement;
  const headings = Array.from(document.querySelectorAll("h2, h3, h4"));
  if (headings.length === 0) return;

  const enableNumbering = getComputedStyle(root).getPropertyValue("--enable-numbering").trim();

  headings.forEach((heading) => {
    const a = tocLinkMap.get(heading);

    // 保留 arrow 元素，只更新文本部分
    const arrow = a.querySelector(".icon-arrow2");

    if (enableNumbering === "false") {
      heading.textContent = heading.getAttribute("data-original-text");

      a.innerHTML = "";
      a.textContent = heading.textContent;
      if (arrow) {
        a.appendChild(arrow);
      }
    } else if (enableNumbering === "true") {
      heading.textContent = heading.getAttribute("data-numbering") + " " + heading.getAttribute("data-original-text");
      a.innerHTML = "";
      a.textContent = heading.textContent;
      if (arrow) {
        a.appendChild(arrow);
      }
    } else {
      console.log("--enable-numbering:", enableNumbering);
      console.log(new Error("--enable-numbering must be true or false"));
    }
  });
}

// 显示/隐藏目录编号
function switchNumbering() {
  const root = document.documentElement;
  const toggleNumbering = document.querySelector(".icon-Numbering");
  const iconNumbering = document.querySelector(".icon-Numbering");

  if (toggleNumbering) {
    toggleNumbering.addEventListener("click", () => {
      iconNumbering.style.userSelect = "none";
      const enableNumbering = getComputedStyle(root).getPropertyValue("--enable-numbering").trim();
      const resetNumbering = enableNumbering === "true" ? "false" : "true";
      root.style.setProperty("--enable-numbering", resetNumbering);

      updateHeadingText();
    });
  }
}

// 点击arrow切换目录展开状态
function toggleNestedToc() {
  const nav = document.querySelector("nav");
  if (nav) {
    nav.addEventListener("click", (e) => {
      const arrow = e.target.closest(".icon-arrow2");
      if (!arrow) return;

      e.preventDefault();
      e.stopPropagation();

      const li = arrow.closest("li");
      const nestedOl = li.querySelector(":scope > ol");

      if (!nestedOl) return;

      nestedOl.classList.toggle("show");
      arrow.classList.toggle("rotate-90");
    });
  }
}

// 展开/收起 所有目录
function toggleAllToc() {
  const root = document.documentElement;
  const iconExpand = document.querySelector(".icon-expand-all");
  const tocRoot = document.getElementById("toc-root");

  if (iconExpand) {
    iconExpand.addEventListener("click", () => {
      iconExpand.style.userSelect = "none";
      const ol = tocRoot.querySelectorAll("ol");
      const arrows = tocRoot.querySelectorAll(".icon-arrow2");
      const allExpandedValue = getComputedStyle(root).getPropertyValue("--all-expanded").trim();
      const newAllExpanded = allExpandedValue === "false" ? "true" : "false";
      root.style.setProperty("--all-expanded", newAllExpanded);

      if (newAllExpanded === "true") {
        ol.forEach((item) => {
          item.classList.add("show");
        });
        arrows.forEach((arrow) => {
          arrow.classList.add("rotate-90");
        });
      } else if (newAllExpanded === "false") {
        ol.forEach((item) => {
          item.classList.remove("show");
        });
        arrows.forEach((arrow) => {
          arrow.classList.remove("rotate-90");
        });
      } else {
        alert("展开/收起所有目录失败");
      }
    });
  }
}

// 大屏状态下 显示/隐藏 侧边栏
function largeScreenToggleAside() {
  const iconAside = document.querySelector(".icon-Aside");
  const aside = document.querySelector("aside");
  const main = document.querySelector("main");

  if (iconAside) {
    iconAside.addEventListener("click", () => {
      main.classList.toggle("hidden");
      aside.classList.toggle("hidden");
    });
  }
}

// 小屏状态下 显示/隐藏 侧边栏
function smallScreenToggleAside() {
  const aside = document.querySelector("aside");
  const iconMenu3 = document.querySelector(".icon-menu3");
  const overlay = document.querySelector(".overlay");

  if (iconMenu3) {
    iconMenu3.addEventListener("click", () => {
      iconMenu3.classList.toggle("show");
      aside.classList.toggle("show");
      overlay.classList.toggle("show");
    });
  }

  if (overlay) {
    overlay.addEventListener("click", () => {
      iconMenu3.classList.remove("show");
      aside.classList.remove("show");
      overlay.classList.remove("show");
    });
  }
}

// 侧边栏宽度调整
function adjustAsideWidth() {
  const root = document.documentElement;
  const resizeHandle = document.querySelector("#resize-handle");
  const asideEl = document.querySelector("aside");
  const mainEl = document.querySelector("main");

  if (resizeHandle && asideEl && mainEl) {
    let isResizing = false;
    let startX = 0;
    let startWidth = 0;
    let rafId = null;
    const minWidth = 0;
    const maxWidth = 500;

    resizeHandle.addEventListener("mousedown", (e) => {
      isResizing = true;
      startX = e.clientX;
      const currentWidth = parseInt(getComputedStyle(root).getPropertyValue("--aside-width").trim(), 10);
      startWidth = currentWidth;
      resizeHandle.classList.add("resizing");
      asideEl.classList.add("resizing");
      mainEl.classList.add("resizing");
      document.body.style.userSelect = "none";
    });

    document.addEventListener("mousemove", (e) => {
      if (!isResizing) return;
      if (rafId) return;

      rafId = requestAnimationFrame(() => {
        rafId = null;
        const delta = e.clientX - startX;
        let newWidth = startWidth + delta;
        if (newWidth < minWidth) newWidth = minWidth;
        if (newWidth > maxWidth) newWidth = maxWidth;
        root.style.setProperty("--aside-width", newWidth + "px");
      });
    });

    document.addEventListener("mouseup", () => {
      if (!isResizing) return;
      isResizing = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      resizeHandle.classList.remove("resizing");
      asideEl.classList.remove("resizing");
      mainEl.classList.remove("resizing");
      document.body.style.userSelect = "";
    });
  }
}

}

pace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></math> J 的电势能；q2 为<math><mi>－</mi><mn>3</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>9</mn></mrow></msup></math> C 的试探电荷放在电场中的 B 点，具有<math><mn>9</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></math> J 的电势能。现把 q3 为<math><mi>－</mi><mn>5</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>9</mn></mrow></msup></math> C 的试探电荷由A 点移到B 点，静电力做正功还是负功？数值是多少？<br><math><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝜑</mi><mi>𝐴</mi></msub></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mrow><msub><mi>𝑞</mi><mn>1</mn></msub><mo rspace="0em">,</mo><mi>𝐴</mi></mrow><mo>)</mo></mrow></mrow><msub><mi>𝑞</mi><mn>1</mn></msub></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mo form="prefix">−</mo><mn>20</mn><mspace width="0.2222em"/><mtext>V</mtext></mtd></mtr></mtable></math></p><p><math><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝜑</mi><mi>𝐵</mi></msub></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mrow><msub><mi>𝑞</mi><mn>2</mn></msub><mo rspace="0em">,</mo><mi>𝐵</mi></mrow><mo>)</mo></mrow></mrow><msub><mi>𝑞</mi><mn>2</mn></msub></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mo form="prefix">−</mo><mn>30</mn><mspace width="0.2222em"/><mtext>V</mtext></mtd></mtr></mtable></math></p><p><math><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝑊</mi><mrow><msub><mi>𝑞</mi><mn>3</mn></msub><mo rspace="0em">,</mo><mi>𝐴</mi><mo lspace="0em" rspace="0em" stretchy="false">→</mo><mi>𝐵</mi></mrow></msub></mtd><mtd><mo form="infix">=</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mrow><m 势差<math><msub><mi>𝑈</mi><mtext>AB</mtext></msub></math> 为 20 V，q 为<math><mi>－</mi><mn>2</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>9</mn></mrow></msup></math> C 的电荷由A 点移动到B 点，静电力做的功是多少？电势能是增加还是减少，增加或者减少多少？<br><math><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝑊</mi><mtext>AB</mtext></msub></mtd><mtd><mo form="infix">=</mo><mi>𝑞</mi><msub><mi>𝑈</mi><mtext>AB</mtext></msub></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mo form="prefix">−</mo><mn>4</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup><mspace width="0.2222em"/><mtext>J</mtext></mtd></mtr></mtable></math><br>静电力做负功，电势能增加。<br><math><msub><mi>𝑊</mi><mtext>AB</mtext></msub><mo>=</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mi>𝐴</mi><mo>)</mo></mrow><mo>−</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mi>𝐵</mi><mo>)</mo></mrow></math><br><math><mo form="infix" lspace="0em" stretchy="false">⇒</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mi>𝐵</mi><mo>)</mo></mrow><mo>=</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mi>𝐴</mi><mo>)</mo></mrow><mo>−</mo><msub><mi>𝑊</mi><mtext>AB</mtext></msub></math><br>即电势能增加<math><mn>4</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></math> J。</div></figure><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><strong>练习</strong> 2<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>在研究微观粒子时常用电子伏（eV）作为能量的单位。1 eV 等于一个电子经过1 V 电压加速后所增加的动能，那么，1 eV 等于多少焦耳？<br><math><mtable class="multiline-equation aligned"><mtr><mtd><mn>1</mn><mspace width="0.2222em"/><mtext>eV</mtext></mtd><mtd><mo form="infix">=</mo><mn>1.602</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup><mspace width="0.2222em"/><mtext>C</mtext><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">∗</mo><mn>1</mn><mspace width="0.2222em"/><mtext>V</mtext></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>1.602</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup><mspace width="0.2222em"/><mtext>J</mtext></mtd></mtr></mtable></math></div></figure><h3>电势差与电场强度的关系</h3><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><p><strong>例</strong> 1<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>如图，真空中平行金属板M、N之间的距离d为0.04 m，有一个<math><mn>2</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>15</mn></mrow></msup></math> kg 的带电粒子位于 M 板旁，粒子的电荷量为 <math><mn>8</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>15</mn></mrow></msup></math> C，给两金属板加 200 V 直流电压。<br></p><ol><li>求带电粒子所受的静电力的大小。<br></li><li>求带电粒子从 M 板由静止开始运动到达 N 板时的速度。<br></li><li>如果两金属板距离增大为原来的 2 倍，其他条件不变，则上述问题（1）（2）的答案又如何？<br></li></ol><p><br></p><div style="width: 100%; margin: 10pt auto; display: flex; justify-content: center" class="typst-diagram"><svg style="overflow: visible; width: 14.05645383em; height: 9.436863278em; display: block" viewBox="0 0 154.620992126 103.805496063" width="154.620992126pt" height="103.805496063pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g><path fill="none" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(9.279 17.348)" d="M 0 0m 0 68.031496063v -68.031496063h 45.354330709"/><path fill="none" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(99.987661417 17.348)" d="M 0 0h 45.354330709v 68.0 0.2222222222222222em">∗</mo><mi>𝑡</mi><mo>=</mo><msqrt><mn>2</mn><mi>𝑎</mi><mi>𝑑</mi></msqrt><mo>=</mo><mn>40</mn><mspace width="0.2222em"/><mtext>m/s</mtext></math><br></p><p>(3)<br>平行金属板之间的电场可视为匀强电场，电场强度为：<math><mi>𝐸</mi><mo>=</mo><mfrac><mi>𝑈</mi><mi>𝑑</mi></mfrac><mo>=</mo><mn>2500</mn><mspace width="0.2222em"/><mtext>V/m</mtext></math><br>带电粒子所受静电力为：<math><mi>𝐹</mi><mo>=</mo><mi>𝑞</mi><mi>𝐸</mi><mo>=</mo><mn>2.0</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>11</mn></mrow></msup><mspace width="0.2222em"/><mtext>N</mtext></math><br></p><p>忽略重力的影响，仅考虑静电力的作用：<br>由于：<math><mi>𝑑</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>𝑎</mi><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">∗</mo><msup><mi>𝑡</mi><mn>2</mn></msup></math>，解得：<math><mi>𝑡</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>𝑑</mi></mrow><mi>𝑎</mi></mfrac></msqrt><mo>=</mo><mn>0.004</mn><mspace width="0.2222em"/><mtext>s</mtext></math><br>又因为速度：</p><math id="velocity" display="block"><mi>𝑣</mi><mo>=</mo><mi>𝑎</mi><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">∗</mo><mi>𝑡</mi><mo>=</mo><msqrt><mn>2</mn><mi>𝑎</mi><mi>𝑑</mi></msqrt><mo>=</mo><msqrt><mn>2</mn><mfrac><mrow><mi>𝑞</mi><mi>𝐸</mi></mrow><mi>𝑚</mi></mfrac><mi>𝑑</mi></msqrt><mo>=</mo><msqrt><mn>2</mn><mfrac><mrow><mi>𝑞</mi><mi>𝑈</mi></mrow><mrow><mi>𝑑</mi><mi>𝑚</mi></mrow></mfrac><mi>𝑑</mi></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>𝑞</mi><mi>𝑈</mi></mrow><mi>𝑚</mi></mfrac></msqrt></math><p>解得：<math><mi>𝑣</mi><mo>=</mo><mn>40</mn><mspace width="0.2222em"/><mtext>m/s</mtext></math><br>将距离增大至原来的 2 倍，其他条件不变。结果是静电力变为原来的<math><mfrac><mn>1</mn><mn>2</mn></mfrac></math>，到达N板时的速度不变。<br>由速度 <a href="#velocity">公式 1</a> 可知，粒子到达末端平行金属板的速度仅与粒子的带电量、平行金属板两端的电势差和粒子质量有关，与平行金属板之间的距离无关。<br><br>由能量守恒原理可知：<math><msub><mi>𝐸</mi><mi>𝑘</mi></msub><mrow><mo>(</mo><mtext>初</mtext><mo>)</mo></mrow><mo>+</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mtext>初</mtext><mo>)</mo></mrow><mo>=</mo><msub><mi>𝐸</mi><mi>𝑘</mi></msub><mrow><mo>(</mo><mtext>终</mtext><mo>)</mo></mrow><mo>+</mo><msub><mi>𝐸</mi><mi>𝑝</mi></msub><mrow><mo>(</mo><mtext>终</mtext><mo>)</mo></mrow></math><br>带入相应表达式得：<math><mn>0</mn><mo>+</mo><mi>𝑞</mi><msub><mi>𝜑</mi><mi>𝑀</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>𝑚</mi><msup><mi>𝑣</mi><mn>2</mn></msup><mo>+</mo><mi>𝑞</mi><msub><mi>𝜑</mi><mi>𝑁</mi></msub></math><br>整理得：<math><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>𝑚</mi><msup><mi>𝑣</mi><mn>2</mn></msup><mo>=</mo><mi>𝑞</mi><mrow><mo>(</mo><mrow><msub><mi>𝜑</mi><mi>𝑀</mi></msub><mo>−</mo><msub><mi>𝜑</mi><mi>𝑁</mi></msub></mrow><mo>)</mo></mrow><mo>=</mo><mi>𝑞</mi><mi>𝑈</mi></math><br>解得同样的表达式：<math><mi>𝑣</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>𝑞</mi><mi>𝑈</mi></mrow><mi>𝑚</mi></mfrac></msqrt></math><br></p></div></figure><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><p><strong>练习</strong> 1<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>空气是不导电的。但是如果空气中的电场很强，使得气体分子中带正、负电荷的微粒所受的方向相反的静电力很大，以至于分子“破碎”，空气中出现可以自由移动的电荷，空气就变成了导体。这个现象叫作空气的“击穿”。<br></p><p>一次实验中，电压为 <math><mn>4</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mn>4</mn></msup></math> V 的直流电源的两极连在一对平行金属板上，如果把两金属板的距离减小到 1.3 cm，两板之间就会放电。这次实验中空气被击穿时的电场强度是多少？<br></p><math display="block"><mi>𝐸</mi><mo>=</mo><mfrac><mi>𝑈</mi><mi>𝑑</mi></mfrac><mo>=</mo><mn>3.08</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mn>6</mn></msup><mspace width="0.2222em"/><mtext>V/m</mtext></math></div></figure><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><p><strong>练习</strong> 2<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>带有等量异种电荷、相距 10 cm 的平行板 A 和 B 之间有匀强电场，电场强度 E 为 <math><mn>2</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mn>4</mn></msup></math> V/m，方向向下。电场中 C 点距 B 板 3 cm，D 点距 A 板 2 cm。<br>（1）C、D 两点哪点电势高？两点的电势差<math><msub><mi>𝑈</mi><mtext>CD</mtext></msub></math> 等于多少？<br>（2）如果把 B 板接地，则 C 点和 D 点的电势 <math><msub><mi>𝜑</mi><mi>𝐶</mi></msub></math> 和 <math><msub><mi>𝜑</mi><mi>𝐷</mi></msub></math> 各是多少？如果把 A 板接地，则 <math><msub><mi>𝜑</mi><mi>𝐶</mi></msub></math> 和 <math><msub><mi>𝜑</mi><mi>𝐷</mi></msub></math> 各是多少？在这两种情况中，<math><msub><mi>𝑈</mi><mtext>CD</mtext></msub></math> 相同吗？<br>（3）一个电子从 C 点移动到 D 点，静电力做多少功？如果使电子从 C 点先移到 P 点，再移到 D 点，静电力做的功是否会发生变化？<br><br></p><div style="width: 100%; margin: 10pt auto; display: flex; justify-content: center" class="typst-diagram"><svg style="overflow: visible; width: 12.753128132em; height: 6.800687187em; display: block" viewBox="0 0 140.284409449 74.807559055" width="140.284409449pt" height="74.807559055pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g><path fill="#caa044ce" fill-rule="nonzero" transform="translate(0 7.64)" d="M 0 0v 2.834645669h 124.724409449v -2.834645669h -124.724409449Z "/><path fill="#caa044ce" fill-rule="nonzero" transform="translate(0 67.167559055)" d="M 0 0v 2.834645669h 124.724409449v -2.834645669h -124.724409449Z "/><path fill="none" stroke="#85b196" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(5.669291339 10.474645669)" d="M 0 0v 53.14292851"/><path fill="#85b196" fill-rule="nonzero" stroke="#85b196" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-dashoffset="0" stroke-dasharray="" transform="translate(4.606299213 62.908912762)" d="M 0 0m 1.062992126 2.834645669l 1.062992126 -2.834645669l -1.062992126 0.708661417l -1.062992126 -0.708661417l 1.062992126 2.834645669Z "/><path fill="none" stroke="#85b196" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(43.464566929 10.474645669)" d="M 0 0v 53.14292851"/> </msub><mo>=</mo><mn>1600</mn><mspace width="0.2222em"/><mtext>V</mtext></math><br><math><msub><mi>𝑈</mi><mtext>CD</mtext></msub><mo>=</mo><msub><mi>𝜑</mi><mi>𝐶</mi></msub><mo>−</mo><msub><mi>𝜑</mi><mi>𝐷</mi></msub><mo>=</mo><mo form="prefix">−</mo><mn>1000</mn><mspace width="0.2222em"/><mtext>V</mtext></math><br></p><p>如果把A板接地，即：取A板的电势作为零电势点<br><math><msub><mi>𝜑</mi><mi>𝐶</mi></msub><mo>=</mo><msub><mi>𝜑</mi><mi>𝐴</mi></msub><mo>+</mo><msub><mi>𝑈</mi><mtext>CA</mtext></msub><mo>=</mo><mo form="prefix">−</mo><mn>1400</mn><mspace width="0.2222em"/><mtext>V</mtext></math><br><math><msub><mi>𝜑</mi><mi>𝐷</mi></msub><mo>=</mo><msub><mi>𝜑</mi><mi>𝐴</mi></msub><mo>+</mo><msub><mi>𝑈</mi><mtext>DA</mtext></msub><mo>=</mo><mo form="prefix">−</mo><mn>400</mn><mspace width="0.2222em"/><mtext>V</mtext></math><br><math><msub><mi>𝑈</mi><mtext>CD</mtext></msub><mo>=</mo><msub><mi>𝜑</mi><mi>𝐶</mi></msub><mo>−</mo><msub><mi>𝜑</mi><mi>𝐷</mi></msub><mo>=</mo><mo form="prefix">−</mo><mn>1000</mn><mspace width="0.2222em"/><mtext>V</mtext></math><br>在这两种情况下，<math><msub><mi>𝑈</mi><mtext>CD</mtext></msub></math> 相同。<br></p><p>(3) 把电子从C点移动到D点，静电力做的功为：<math><msub><mi>𝑊</mi><mtext>CD</mtext></msub><mo>=</mo><mi>𝑞</mi><msub><mi>𝑈</mi><mtext>CD</mtext></msub><mo>=</mo><mn>1.602</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>16</mn></mrow></msup><mspace width="0.2222em"/><mtext>J</mtext></math><br>如果使电子从 C 点先移到 P 点，再移到 D 点，静电力做的功不会发生变化，因为静电力做功与路径无关，仅与始末位置有关。</p></div></figure><h3>电容器的电容</h3><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><p><strong>练习</strong> 1<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>用图示电路给电容器充、放电。开关 S 接通 1，稳定后改接 2，稳定后又改接 1，如此往复。下表记录了充、放电过程中某两个时刻通过电流表的电流方向，试根据该信息，在表格内各空格处填上合理的答案。<br></p><div style="width: 100%; margin: 10pt auto; display: flex; justify-content: center" class="typst-diagram"><svg style="overflow: visible; width: 15.91130136em; 22222222em" rspace="0.2222222222222222em">∗</mo><mi>𝑈</mi></math>，这是一个一元一次函数，电荷量 Q 随电压 U 增加而等比例增加。</p><p>图A错误，图B和图D正确，因为电容器的电容 C 是物理器件的固有属性，在充电过程中保持不变。</p><p>图C正确，电容器充电时，电荷量 Q 随电压 U 增加而等比例增加。</p></div></figure><figure><div class="thmplain" style="border-radius: 10px; background: #f5f5f5; padding: 0.8em;"><p><strong>练习</strong> 3<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>有一个已充电的电容器，两极板之间的电压为3 V，所带电荷量为 <math><mn>4.5</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>4</mn></mrow></msup></math> C，此电容器的电容是多少？将电容器的电压降为 2 V，电容器的电容是多少？所带电荷量是多少？<br></p></div></figure></article></main></div></body></html>
