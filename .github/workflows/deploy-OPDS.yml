# 将「物理必修三」中的 Typst 源文件在云端编译为 PDF，并部署为 OPDS 目录（GitHub Pages 静态托管）
#
# 一次性设置（首次运行前）：
#   Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
#
# 流程说明：
#   1. 安装 Typst CLI（版本与本机一致，见 env.TYPST_VERSION）
#   2. 安装中文字体：霞鹜文楷（LXGW WenKai，楷体风格）+ Noto CJK 兜底
#   3. 恢复 @local 本地包（itemplate / theoframe，已提交到 packages/typst/local/）
#   4. 为每个 .typ 注入页面尺寸与字体设置（幂等：已存在则跳过）
#   5. 编译 PDF 到 dist/物理必修三/（只部署编译产物，不收录仓库已有 PDF）
#   6. 在 dist/ 中递归生成 OPDS 目录（index.xml）

name: Deploy OPDS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  # 站点基础地址（不带末尾斜杠），用于生成 OPDS 中的绝对链接
  SITE_BASE: https://hexiongwu1995.github.io/Physics
  # Typst CLI 版本（与本机保持一致）
  TYPST_VERSION: "0.15.1"
  # Typst 源文件所在目录（只处理其中的 .typ 文件）
  TYPST_SRC_DIR: 物理必修三
  # 编译产物与 OPDS 输出目录（Pages 构件内容）
  DIST_DIR: dist
  # 霞鹜文楷版本（楷体风格开源字体，云端替代 KaiTi）
  LXGW_WENKAI_VERSION: v1.522

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst CLI
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Install CJK fallback fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Download LXGW WenKai fonts
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/LXGWWenKai-Regular.ttf \
            "https://github.com/lxgw/LxgwWenKai/releases/download/${LXGW_WENKAI_VERSION}/LXGWWenKai-Regular.ttf"
          curl -fsSL -o fonts/LXGWWenKai-Medium.ttf \
            "https://github.com/lxgw/LxgwWenKai/releases/download/${LXGW_WENKAI_VERSION}/LXGWWenKai-Medium.ttf"
          ls -l fonts

      - name: Install local typst packages
        run: |
          mkdir -p ~/.local/share/typst/packages/local
          cp -r packages/typst/local/* ~/.local/share/typst/packages/local/

      # 在第一个一级标题（= xxx）前一行插入页面尺寸与字体设置；
      # 文件中已有对应设置时跳过（幂等），找不到一级标题则插到文件开头
      - name: Inject page setup into typst files (Node)
        run: |
          node <<'NODE_EOF'
          const fs = require('fs');
          const path = require('path');

          const SRC = process.env.TYPST_SRC_DIR;
          const PAGE_LINE = '#set page(width:10cm, height:15cm, margin: (x:0.5cm,y:2cm))';
          const FONT_LINE = '#set text(font: ("Libertinus Serif", "KaiTi", "LXGW WenKai"))';

          for (const name of fs.readdirSync(SRC).sort()) {
            if (!name.toLowerCase().endsWith('.typ')) continue;
            const file = path.join(SRC, name);
            const lines = fs.readFileSync(file, 'utf8').split('\n');

            const hasPage = lines.some((l) => /^\s*#set\s+page\(/.test(l));
            const hasFont = lines.some((l) => /^\s*#set\s+text\(\s*font/.test(l));
            if (hasPage && hasFont) {
              console.log(`skipped (settings already present): ${file}`);
              continue;
            }

            // 插入位置：第一个一级标题行之前；找不到则插到文件开头
            let at = lines.findIndex((l) => /^= /.test(l));
            if (at < 0) at = 0;

            const inject = [];
            if (!hasPage) inject.push(PAGE_LINE, '');
            if (!hasFont) inject.push(FONT_LINE, '');

            lines.splice(at, 0, ...inject);
            fs.writeFileSync(file, lines.join('\n'));
            console.log(`injected at line ${at + 1}: ${file}`);
          }
          NODE_EOF

      - name: Compile typst to PDF
        run: |
          mkdir -p "$DIST_DIR/$TYPST_SRC_DIR"
          for f in "$TYPST_SRC_DIR"/*.typ; do
            base="$(basename "$f" .typ)"
            echo "compiling: $f"
            typst compile --font-path fonts "$f" "$DIST_DIR/$TYPST_SRC_DIR/${base}.pdf"
          done

      # 递归扫描 dist 目录并生成 OPDS 目录（每个含内容的目录一个 index.xml）
      - name: Generate OPDS catalog (Node)
        run: |
          node <<'NODE_EOF'
          const fs = require('fs');
          const path = require('path');

          const ROOT = process.env.DIST_DIR;
          const BASE = (process.env.SITE_BASE || 'https://hexiongwu1995.github.io/Physics').replace(/\/+$/, '');
          const NOW = new Date().toISOString().replace(/\.\d+Z$/, 'Z');

          const NAV_TYPE = 'application/atom+xml;profile=opds-catalog;kind=navigation';
          const ACQ_TYPE = 'application/atom+xml;profile=opds-catalog;kind=acquisition';

          // XML 特殊字符转义
          const esc = (s) => String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

          // 按路径段做 URL 编码（中文、空格、· 等）
          const enc = (p) => p.split('/').map(encodeURIComponent).join('/');

          function entryXml(id, title, rel, href, type) {
            return [
              '  <entry>',
              `    <id>${esc(id)}</id>`,
              `    <title>${esc(title)}</title>`,
              `    <updated>${NOW}</updated>`,
              `    <link rel="${rel}" href="${esc(href)}" type="${esc(type)}"/>`,
              '  </entry>'
            ].join('\n');
          }

          function feedXml(id, title, selfHref, kind, entries) {
            return [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<feed xmlns="http://www.w3.org/2005/Atom">',
              `  <id>${esc(id)}</id>`,
              `  <title>${esc(title)}</title>`,
              `  <updated>${NOW}</updated>`,
              '  <author><name>Physics</name></author>',
              `  <link rel="self" href="${esc(selfHref)}" type="${esc(kind)}"/>`,
              `  <link rel="start" href="${BASE}/index.xml" type="${NAV_TYPE}"/>`,
              ...entries,
              '</feed>'
            ].join('\n');
          }

          // 递归扫描目录并生成 index.xml
          // 返回值：'navigation' | 'acquisition' | null（空目录不生成）
          function generate(dir) {
            const names = fs.readdirSync(dir).filter((n) => !n.startsWith('.')).sort();
            const rel = (path.relative(ROOT, dir) || '.').split(path.sep).join('/');
            const entries = [];
            let kind = 'navigation';

            for (const name of names) {
              const full = path.join(dir, name);
              if (!fs.statSync(full).isDirectory()) continue;
              const childKind = generate(full);
              if (childKind === null) continue;
              const childRel = rel === '.' ? name : rel + '/' + name;
              entries.push(entryXml(
                `${BASE}/${enc(childRel)}/`,
                name,
                'subsection',
                `${BASE}/${enc(childRel)}/index.xml`,
                childKind === 'acquisition' ? ACQ_TYPE : NAV_TYPE
              ));
            }

            for (const name of names.filter((n) => n.toLowerCase().endsWith('.pdf'))) {
              const fileRel = rel === '.' ? name : rel + '/' + name;
              entries.push(entryXml(
                `${BASE}/${enc(fileRel)}`,
                name.replace(/\.pdf$/i, ''),
                'http://opds-spec.org/acquisition',
                `${BASE}/${enc(fileRel)}`,
                'application/pdf'
              ));
              kind = 'acquisition';
            }

            if (entries.length === 0) return null;

            const feedRel = rel === '.' ? 'index.xml' : rel + '/index.xml';
            const selfHref = `${BASE}/${enc(feedRel)}`;
            fs.writeFileSync(
              path.join(dir, 'index.xml'),
              feedXml(
                selfHref,
                rel === '.' ? 'Physics' : path.basename(dir),
                selfHref,
                kind === 'acquisition' ? ACQ_TYPE : NAV_TYPE,
                entries
              ) + '\n'
            );
            console.log(`generated: ${feedRel} (${entries.length} entries, ${kind})`);
            return kind;
          }

          generate(ROOT);
          NODE_EOF

      - name: Create .nojekyll (跳过 Jekyll 处理，保证中文路径可访问)
        run: touch "$DIST_DIR/.nojekyll"

      - name: List generated feeds
        run: |
          find "$DIST_DIR" -name index.xml | sort
          echo '--- 根 Feed 预览 ---'
          head -25 "$DIST_DIR/index.xml"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
