      - name: Create .nojekyll (跳过 Jekyll 处理，保证中文路径可访问)
        run: touch .nojekyll

      - name: List generated feeds
        run: |
          find . -name index.xml | sort
          echo '--- 根 Feed 预览 ---'
          head -25 index.xml

      - name: Remove .git (减小 Pages 构件体积)
        run: rm -rf .git

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
