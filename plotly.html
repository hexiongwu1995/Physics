<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plotly 嵌入示例</title>
    <!-- <script src="https://cdn.plot.ly/plotly-4.1.1.min.js" charset="utf-8"></script> -->
    <script type="importmap">
{
    "imports": {
        "plotly": "https://cdn.jsdelivr.net/npm/plotly.js-dist-min/+esm"
    }
}
</script>
</head>

<body>
    <p> 这是一个 Plotly 图表嵌入示例。</p>
    <div id="chart" style="width:100%;height:600px;"></div>
    <script type="module">
        import Plotly from 'plotly';
        // 等价于 numpy: x = y = np.linspace(-5, 5, 60); Z = sin(sqrt(X^2 + Y^2))
        const n = 60, lo = -5, hi = 5;
        const axis = Array.from({ length: n }, (_, i) => lo + i * (hi - lo) / (n - 1));
        const X = [], Y = [], Z = [];
        for (const y of axis) {
            const rowX = [], rowY = [], rowZ = [];
            for (const x of axis) {
                rowX.push(x); rowY.push(y);
                rowZ.push(Math.sin(Math.sqrt(x * x + y * y)));
            }
            X.push(rowX); Y.push(rowY); Z.push(rowZ);
        }
        Plotly.newPlot('chart', [{
            type: 'surface', x: X, y: Y, z: Z, colorscale: 'Greys',
            colorbar: { len: 0.8 }
        }], {
            title: 'z = sin(√(x²+y²))',
            scene: {
                xaxis: { range: [-5, 5] },
                yaxis: { range: [-5, 5] },
                zaxis: { range: [-5, 5] },
                camera: {
                    projection: { type: 'orthographic' }
                }
            }
        });
    </script>
</body>

</html>
