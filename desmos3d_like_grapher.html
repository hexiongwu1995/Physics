<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js 3D Function Grapher</title>

  <style>
    :root {
      --ui-bg: rgba(255, 255, 255, 0.94);
      --ui-border: rgba(0, 0, 0, 0.14);
      --ui-text: #333;
      --ui-muted: #777;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Small Desmos-like control panel, deliberately not a left expression sidebar. */
    #panel {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      width: 265px;
      padding: 12px 13px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-bg);
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
      color: var(--ui-text);
      font-size: 13px;
      user-select: none;
    }

    #panel .title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    #panel .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 25px;
      gap: 10px;
    }

    #panel label {
      white-space: nowrap;
    }

    #panel input[type="checkbox"] {
      margin: 0;
      accent-color: #3d7fc4;
    }

    #panel .hint {
      margin-top: 9px;
      color: var(--ui-muted);
      line-height: 1.4;
      font-size: 11px;
    }

    #panel button {
      margin-top: 8px;
      width: 100%;
      border: 0;
      border-radius: 5px;
      padding: 6px 8px;
      background: #3d7fc4;
      color: white;
      cursor: pointer;
    }

    #panel button:hover {
      background: #326ea9;
    }

    .axis-label {
      font-size: 28px;
      font-weight: 600;
      color: #8d8d8d;
      text-shadow: 0 1px 2px rgba(255,255,255,.9);
      pointer-events: none;
    }

    .tick-label {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(255,255,255,.9);
    }

    #error {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 20;
      display: none;
      max-width: min(600px, calc(100vw - 28px));
      padding: 9px 12px;
      border-radius: 6px;
      background: rgba(180, 30, 30, .92);
      color: white;
      font: 12px/1.4 monospace;
    }
  </style>
</head>

<body>
<div id="app">
  <div id="canvas-container"></div>

  <div id="panel">
    <div class="title">3D Graph</div>

    <div class="row">
      <label>Box</label>
      <input id="box-toggle" type="checkbox" checked>
    </div>
    <div class="row">
      <label>Axes</label>
      <input id="axes-toggle" type="checkbox" checked>
    </div>
    <div class="row">
      <label>Labels</label>
      <input id="labels-toggle" type="checkbox" checked>
    </div>
    <div class="row">
      <label>Numbers</label>
      <input id="numbers-toggle" type="checkbox" checked>
    </div>
    <div class="row">
      <label>XY plane grid</label>
      <input id="grid-toggle" type="checkbox" checked>
    </div>

    <button id="reset-view">Reset view</button>

    <div class="hint">
      Edit <code>GRAPH_CONFIG</code> in the source code to change the function and domain.
      Drag to rotate, wheel to zoom, right-drag to pan.
    </div>
  </div>

  <div id="error"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

/* ============================================================
   USER CONFIGURATION
   ============================================================
   Change ONLY this object to plot another function.

   Example:
     z = Math.sin(Math.sqrt(x*x + y*y)) + 2

   xRange / yRange = function domain
   zRange           = visible vertical range / box range

   Coordinate convention:
     Mathematical x -> Three.js X
     Mathematical y -> Three.js Z (depth)
     Mathematical z -> Three.js Y (vertical)

   segments         = surface resolution
   ============================================================ */

const GRAPH_CONFIG = {
  // Function z = f(x, y)
  function: (x, y) => Math.sin(Math.sqrt(x * x + y * y)) + 2,

  // Domain
  xRange: [-5, 5],
  yRange: [-5, 5],

  // Vertical range of the 3D box
  zRange: [-5, 5],

  // Surface sampling resolution
  segmentsX: 180,
  segmentsY: 180,

  // Visual options
  surfaceColor: 0x3d80c5,
  surfaceOpacity: 1.0,
  wireframe: false,

  // Tick spacing
  tickStep: 1,

  // Desmos-like coordinate system
  showBox: true,
  showAxes: true,
  showLabels: true,
  showNumbers: true,
  showXYGrid: true
};

/* ============================================================
   THREE.JS SETUP
   ============================================================ */

const container = document.getElementById("canvas-container");
const errorBox = document.getElementById("error");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

// Initial camera position chosen to resemble the Desmos 3D view.
camera.position.set(20,10,20);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  logarithmicDepthBuffer: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = "absolute";
labelRenderer.domElement.style.inset = "0";
labelRenderer.domElement.style.pointerEvents = "none";
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.minDistance = 3;
controls.maxDistance = 40;
controls.target.set(0, 0.5, 0);

/* ============================================================
   LIGHTING
   ============================================================ */

scene.add(new THREE.HemisphereLight(0xffffff, 0xbfc7d1, 2.0));

const directionalLight = new THREE.DirectionalLight(0xffffff, 2.2);
directionalLight.position.set(5, -6, 10);
scene.add(directionalLight);

/* ============================================================
   GROUPS
   ============================================================ */

const surfaceGroup = new THREE.Group();
const boxGroup = new THREE.Group();
const axesGroup = new THREE.Group();
const gridGroup = new THREE.Group();
const labelsGroup = new THREE.Group();
const numbersGroup = new THREE.Group();

scene.add(surfaceGroup);
scene.add(boxGroup);
scene.add(axesGroup);
scene.add(gridGroup);
scene.add(labelsGroup);
scene.add(numbersGroup);

/* ============================================================
   SURFACE
   ============================================================ */

function buildSurface() {
  while (surfaceGroup.children.length) {
    const child = surfaceGroup.children.pop();
    child.geometry?.dispose();
    child.material?.dispose();
  }

  const [xmin, xmax] = GRAPH_CONFIG.xRange;
  const [ymin, ymax] = GRAPH_CONFIG.yRange;

  const nx = GRAPH_CONFIG.segmentsX;
  const ny = GRAPH_CONFIG.segmentsY;

  const vertexCount = (nx + 1) * (ny + 1);
  const positions = new Float32Array(vertexCount * 3);
  const indices = [];

  let p = 0;

  for (let iy = 0; iy <= ny; iy++) {
    const y = ymin + (ymax - ymin) * iy / ny;

    for (let ix = 0; ix <= nx; ix++) {
      const x = xmin + (xmax - xmin) * ix / nx;

      let z;
      try {
        z = GRAPH_CONFIG.function(x, y);
      } catch {
        z = NaN;
      }

      // Avoid WebGL NaNs/Infinities.
      if (!Number.isFinite(z)) z = 0;

      // Mathematical coordinates:
      //   (x, y, z)
      //
      // Three.js coordinates:
      //   (x, vertical Y, depth Z)
      //
      // Therefore:
      //   math x -> Three.js X
      //   math y -> Three.js Z
      //   math z -> Three.js Y
      positions[p++] = x;
      positions[p++] = z;
      positions[p++] = y;
    }
  }

  for (let iy = 0; iy < ny; iy++) {
    for (let ix = 0; ix < nx; ix++) {
      const a = iy * (nx + 1) + ix;
      const b = a + 1;
      const c = a + (nx + 1);
      const d = c + 1;

      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions, 3)
  );
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const material = new THREE.MeshPhongMaterial({
    color: GRAPH_CONFIG.surfaceColor,
    side: THREE.DoubleSide,
    flatShading: false,
    shininess: 18,
    specular: 0x202020,
    transparent: GRAPH_CONFIG.surfaceOpacity < 1,
    opacity: GRAPH_CONFIG.surfaceOpacity,
    wireframe: GRAPH_CONFIG.wireframe
  });

  const mesh = new THREE.Mesh(geometry, material);
  surfaceGroup.add(mesh);
}

/* ============================================================
   BOX
   ============================================================ */

function addLineSegments(group, vertices, color, opacity = 1) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(vertices, 3)
  );

  const material = new THREE.LineBasicMaterial({
    color,
    transparent: opacity < 1,
    opacity,
    depthTest: true
  });

  group.add(new THREE.LineSegments(geometry, material));
}

function buildBox() {
  while (boxGroup.children.length) {
    const child = boxGroup.children.pop();
    child.geometry?.dispose();
    child.material?.dispose();
  }

  const [xmin, xmax] = GRAPH_CONFIG.xRange;
  const [ymin, ymax] = GRAPH_CONFIG.yRange;
  const [zmin, zmax] = GRAPH_CONFIG.zRange;

  const v = [
    [xmin,ymin,zmin], [xmax,ymin,zmin],
    [xmax,ymax,zmin], [xmin,ymax,zmin],
    [xmin,ymin,zmax], [xmax,ymin,zmax],
    [xmax,ymax,zmax], [xmin,ymax,zmax]
  ];

  const edges = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
  ];

  const vertices = [];

  for (const [a,b] of edges) {
    vertices.push(...v[a], ...v[b]);
  }

  addLineSegments(boxGroup, vertices, 0xbfc1c4, 0.85);
}

/* ============================================================
   XY GRID
   ============================================================ */

function buildXYGrid() {
  while (gridGroup.children.length) {
    const child = gridGroup.children.pop();
    child.geometry?.dispose();
    child.material?.dispose();
  }

  const [xmin, xmax] = GRAPH_CONFIG.xRange;
  const [ymin, ymax] = GRAPH_CONFIG.yRange;

  // Mathematical z = 0 plane is the Three.js XZ plane (Three.js Y = 0).
  const yThree = 0;
  const majorStep = GRAPH_CONFIG.tickStep;
  const minorDivisions = 5;
  const minorStep = majorStep / minorDivisions;

  const minorVertices = [];
  const majorVertices = [];

  function pushLine(arr, x1, y1, x2, y2) {
    arr.push(x1, yThree, y1, x2, yThree, y2);
  }

  // Minor grid
  for (let x = Math.ceil(xmin / minorStep) * minorStep;
       x <= xmax + 1e-9; x += minorStep) {
    const isMajor = Math.abs(x / majorStep - Math.round(x / majorStep)) < 1e-7;
    if (!isMajor) pushLine(minorVertices, x, ymin, x, ymax);
  }

  for (let y = Math.ceil(ymin / minorStep) * minorStep;
       y <= ymax + 1e-9; y += minorStep) {
    const isMajor = Math.abs(y / majorStep - Math.round(y / majorStep)) < 1e-7;
    if (!isMajor) pushLine(minorVertices, xmin, y, xmax, y);
  }

  // Major grid
  for (let x = Math.ceil(xmin / majorStep) * majorStep;
       x <= xmax + 1e-9; x += majorStep) {
    pushLine(majorVertices, x, ymin, x, ymax);
  }

  for (let y = Math.ceil(ymin / majorStep) * majorStep;
       y <= ymax + 1e-9; y += majorStep) {
    pushLine(majorVertices, xmin, y, xmax, y);
  }

  addLineSegments(gridGroup, minorVertices, 0xdfe1e4, 0.75);
  addLineSegments(gridGroup, majorVertices, 0xc7c9cc, 0.9);
}

/* ============================================================
   AXES
   ============================================================ */

function buildAxes() {
  while (axesGroup.children.length) {
    const child = axesGroup.children.pop();
    child.geometry?.dispose();
    child.material?.dispose();
  }

  const [xmin, xmax] = GRAPH_CONFIG.xRange;
  const [ymin, ymax] = GRAPH_CONFIG.yRange;
  const [zmin, zmax] = GRAPH_CONFIG.zRange;

  const axisColor = 0x8f8f8f;
  const headLength = 0.28;
  const headWidth = 0.16;

  // Mathematical X axis -> Three.js X axis
  const xAxis = new THREE.ArrowHelper(
    new THREE.Vector3(1,0,0),
    new THREE.Vector3(xmin,0,0),
    xmax-xmin,
    axisColor,
    headLength,
    headWidth
  );

  // Mathematical Y axis -> Three.js Z axis
  const yAxis = new THREE.ArrowHelper(
    new THREE.Vector3(0,0,1),
    new THREE.Vector3(0,0,ymin),
    ymax-ymin,
    axisColor,
    headLength,
    headWidth
  );

  // Mathematical Z axis -> Three.js Y axis (vertical)
  const zAxis = new THREE.ArrowHelper(
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(0,zmin,0),
    zmax-zmin,
    axisColor,
    headLength,
    headWidth
  );

  axesGroup.add(xAxis, yAxis, zAxis);
}

/* ============================================================
   CSS LABELS
   ============================================================ */

function makeLabel(text, position, className) {
  const div = document.createElement("div");
  div.className = className;
  div.textContent = text;

  const obj = new CSS2DObject(div);
  obj.position.copy(position);
  return obj;
}

function buildLabels() {
  while (labelsGroup.children.length) {
    const child = labelsGroup.children.pop();
    child.element?.remove();
  }

  const [xmin, xmax] = GRAPH_CONFIG.xRange;
  const [ymin, ymax] = GRAPH_CONFIG.yRange;
  const [zmin, zmax] = GRAPH_CONFIG.zRange;

  const pad = 0.35;

  // Mathematical X -> Three.js X
  labelsGroup.add(
    makeLabel("x", new THREE.Vector3(xmax + pad, 0, 0), "axis-label")
  );

  // Mathematical Y -> Three.js Z
  labelsGroup.add(
    makeLabel("y", new THREE.Vector3(0, 0, ymax + pad), "axis-label")
  );

  // Mathematical Z -> Three.js Y (vertical)
  labelsGroup.add(
    makeLabel("z", new THREE.Vector3(0, zmax + pad, 0), "axis-label")
  );
}

/* ============================================================
   NUMBERS
   ============================================================ */

function buildNumbers() {
  while (numbersGroup.children.length) {
    const child = numbersGroup.children.pop();
    child.element?.remove();
  }

  const [xmin, xmax] = GRAPH_CONFIG.xRange;
  const [ymin, ymax] = GRAPH_CONFIG.yRange;
  const [zmin, zmax] = GRAPH_CONFIG.zRange;
  const step = GRAPH_CONFIG.tickStep;

  const fmt = n => {
    if (Math.abs(n) < 1e-10) return "0";
    return Number(n.toFixed(6)).toString();
  };

  // X numbers
  for (let x = Math.ceil(xmin / step) * step;
       x <= xmax + 1e-9; x += step) {
    if (Math.abs(x) < 1e-10) continue;

    numbersGroup.add(
      makeLabel(
        fmt(x),
        new THREE.Vector3(x, 0, -0.20),
        "tick-label"
      )
    );
  }

  // Y numbers
  for (let y = Math.ceil(ymin / step) * step;
       y <= ymax + 1e-9; y += step) {
    if (Math.abs(y) < 1e-10) continue;

    numbersGroup.add(
      makeLabel(
        fmt(y),
        new THREE.Vector3(-0.20, 0, y),
        "tick-label"
      )
    );
  }

  // Z numbers
  for (let z = Math.ceil(zmin / step) * step;
       z <= zmax + 1e-9; z += step) {
    if (Math.abs(z) < 1e-10) continue;

    numbersGroup.add(
      makeLabel(
        fmt(z),
        new THREE.Vector3(0.16, z, 0),
        "tick-label"
      )
    );
  }
}

/* ============================================================
   UI
   ============================================================ */

const boxToggle = document.getElementById("box-toggle");
const axesToggle = document.getElementById("axes-toggle");
const labelsToggle = document.getElementById("labels-toggle");
const numbersToggle = document.getElementById("numbers-toggle");
const gridToggle = document.getElementById("grid-toggle");
const resetButton = document.getElementById("reset-view");

boxToggle.checked = GRAPH_CONFIG.showBox;
axesToggle.checked = GRAPH_CONFIG.showAxes;
labelsToggle.checked = GRAPH_CONFIG.showLabels;
numbersToggle.checked = GRAPH_CONFIG.showNumbers;
gridToggle.checked = GRAPH_CONFIG.showXYGrid;

boxToggle.addEventListener("change", () => {
  boxGroup.visible = boxToggle.checked;
});

axesToggle.addEventListener("change", () => {
  axesGroup.visible = axesToggle.checked;
});

labelsToggle.addEventListener("change", () => {
  labelsGroup.visible = labelsToggle.checked;
});

numbersToggle.addEventListener("change", () => {
  numbersGroup.visible = numbersToggle.checked;
});

gridToggle.addEventListener("change", () => {
  gridGroup.visible = gridToggle.checked;
});

resetButton.addEventListener("click", () => {
  camera.position.set(8.5, 7.5, 8.5);
  controls.target.set(0, 0.5, 0);
  controls.update();
});

/* ============================================================
   INITIAL BUILD
   ============================================================ */

try {
  buildSurface();
  buildBox();
  buildXYGrid();
  buildAxes();
  buildLabels();
  buildNumbers();

  boxGroup.visible = GRAPH_CONFIG.showBox;
  axesGroup.visible = GRAPH_CONFIG.showAxes;
  labelsGroup.visible = GRAPH_CONFIG.showLabels;
  numbersGroup.visible = GRAPH_CONFIG.showNumbers;
  gridGroup.visible = GRAPH_CONFIG.showXYGrid;
} catch (err) {
  console.error(err);
  errorBox.textContent = String(err);
  errorBox.style.display = "block";
}

/* ============================================================
   RESIZE / ANIMATION
   ============================================================ */

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
