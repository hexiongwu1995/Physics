的电场指向x轴负方向</p><math display="block"><msub><mi>𝐸</mi><mi>𝑥</mi></msub><mo>=</mo><mi>𝑘</mi><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mn>4</mn></msup><mrow><mo>(</mo><mrow><mfrac><msub><mi>𝑄</mi><mn>1</mn></msub><msup><mrow><mo>(</mo><mrow><mi>𝑥</mi><mo>−</mo><mn>0</mn></mrow><mo>)</mo></mrow><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msub><mi>𝑄</mi><mn>2</mn></msub><msup><mrow><mo>(</mo><mrow><mi>𝑥</mi><mo>−</mo><mn>6</mn></mrow><mo>)</mo></mrow><mn>2</mn></msup></mfrac></mrow><mo>)</mo></mrow><mspace width="1em"/><mtext>定义域：</mtext><mspace width="0.2222em"/><mi>𝑥</mi><mo>></mo><mn>6</mn></math><p>因为：<math><mi>𝑘</mi><mo>=</mo><mn>8.99</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mn>9</mn></msup><mspace width="0.1667em"/><mtext>N</mtext><mspace width="0.1667em"/><msup><mtext>m</mtext><mn>2</mn></msup><mspace width="0.1667em"/><msup><mtext>C</mtext><mrow><mo>−</mo><mn>2</mn></mrow></msup></math><br>则：<math><msub><mi>𝐸</mi><mi>𝑥</mi></msub><mo>=</mo><mn>8.99</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mn>9</mn></msup><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><mn>1.0</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mn>4</mn></msup><mrow><mo>(</mo><mrow><mfrac><mn>4</mn><msup><mi>𝑥</mi><mn>2</mn></msup></mfrac><mo>−</mo><mfrac><mn>1</mn><msup><mrow><mo>(</mo><mrow><mi>𝑥</mi><mo lspace="0em" rspace="0em">−</mo><mn>6</mn></mrow><mo>)</mo></mrow><mn>2</mn></msup></mfrac></mrow><mo>)</mo></mrow></math><br>令：<math><msub><mi>𝐸</mi><mi>𝑥</mi></msub><mo>=</mo><mn>0</mn></math><br>得等价表达式：<math><msup><mi>𝑥</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><msup><mrow><mo>(</mo><mrow><mi>𝑥</mi><mo>−</mo><mn>6</mn></mrow><mo>)</mo></mrow><mn>2</mn></msup></math><br>即：<math><mn>3</mn><msup><mi>𝑥</mi><mn>2</mn></msup><mo>−</mo><mn>48</mn><mi>𝑥</mi><mo>+</mo><mn>144</mn><mo>=</mo><mn>0</mn></math><br>即：<math><msup><mi>𝑥</mi><mn>2</mn></msup><mo>−</mo><mn>16</mn><mi>𝑥</mi><mo>+</mo><mn>48</mn><mo>=</mo><mn>0</mn></math><br>即：<math><mrow><mo>(</mo><mrow><mi>𝑥</mi><mo>−</mo><mn>4</mn></mrow><mo>)</mo></mrow><mrow><mo>(</mo><mrow><mi>𝑥</mi><mo>−</mo><mn>12</mn></mrow><mo>)</mo></mrow><mo>=</mo><mn>0</mn></math><br>解得：<math><mi>𝑥</mi><mo>=</mo><mn>12</mn><mspace width="0.2222em"/><mtext>或者</mtext><mspace width="0.2222em"/><mn>4</mn><mrow><mo>(</mo><mtext>舍去</mtext><mo>)</mo></mrow></math></p></li></ul><p>(2) 在<math><mi>𝑥</mi><mo>></mo><mn>6</mn></math>的范围内：</p><math display="block"><msub><mi>𝐸</mi><mi>𝑥</mi></msub><mo>=</mo><mi>𝑘</mi><mrow><mo>(</mo><mrow><mfrac><msub><mi>𝑄</mi><mn>1</mn></msub><msup><mrow><mo>(</mo><mrow><mi>𝑥</mi><mo>−</mo><mn>0</mn></mrow><mo>)</mo></mrow><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><msub><mi>𝑄</mi><mn>2</mn></msub><msup><mrow><mo>(</mo><mrow><mi>𝑥</mi><mo>−</mo><mn>6</mn></mrow><mo>)</mo></mrow><mn>2</mn></msup></mfrac></mrow><mo>)</mo></mrow><mspace width="1em"/><mtext>定义域：</mtext><mspace width="0.2222em"/><mi>𝑥</mi><mo>></mo><mn>6</mn></math><p>令：<math><msub><mi>𝐸</mi><mi>𝑥</mi></msub><mo>></mo><mn>0</mn></math>， 得：<math><mi>𝑥</mi><mo>></mo><mn>12</mn><mspace width="0.2222em"/><mtext>或者</mtext><mspace width="0.2222em"/><mi>𝑥</mi><mo>&lt;</mo><mn>4</mn><mrow><mo>(</mo><mtext>舍去</mtext><mo>)</mo></mrow></math></p></div></figure><figure><div class="thmbox" style="border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>注释</strong> 1.a<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>点电荷周围球面的采样方案<br><br>平分极角和方位角方案：通过平分球坐标中的极角<math><mi>𝜑</mi></math>和方位角<math><mi>𝜃</mi></math>采样得到的采样点之间的直线距离是不相等的，这会导致靠近极角的位置单位面积上的采样点数量更多。</p><p>为什么需要均匀采样？<br>因为在点电荷表面（即围绕点电荷的球面）上，电场线的密度与方向无关。 具体原因如下：</p><ul><li>球对称性：点电荷的电场具有球对称性，以点电荷为中心作一个球面，球面上各点到点电荷的距离相同。根据点电荷场强公式<math><mi>𝐸</mi><mo>=</mo><mi>𝑘</mi><mi>𝑄</mi><mi>/</mi><msup><mi>𝑟</mi><mn>2</mn></msup></math> ，球面上各点的电场强度大小相等。</li><li>密度反映场强大小：电场线的疏密程度（即单位垂直面积内穿过的电场线条数）代表该处电场强度的大小。既然球面上各点场强大小相同，那么电场线的密度在球面上各处也相同。</li><li>方向沿径向但各不相同：虽然球面上各点电场线的方向不同（正点电荷向外辐射，负点电荷向内汇聚），但方向的不同并不影响密度。方向由电场线的切线方向表示，而密度由电场线的疏密程度表示，两者是电场线的两个独立属性。</li><li>总结：在以点电荷为中心的球面上，电场线密度处处相同，但方向各不相同——密度只与到场源的距离有关，与方向无关。</li></ul></div></figure><figure><div class="thmbox" style="border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>定理</strong> 1.a<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>电场的高斯定理（积分形式）<br><br></p><math display="block"><msub><mo lspace="0em">∯</mo><mi>𝑆</mi></msub><mover accent="true"><mi>𝐸</mi><mo stretchy="true">⃗</mo></mover><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><mi>𝑑</mi><mover accent="true"><mi>𝐴</mi><mo stretchy="true">⃗</mo></mover><mo>=</mo><mfrac><msub><mi>𝑄</mi><mtext>enc</mtext></msub><msub><mi>𝜀</mi><mn>0</mn></msub></mfrac></math><p>其中各符号的含义为：</p><ul><li><math><msub><mo form="prefix" lspace="0em" rspace="0em">∯</mo><mi>𝑆</mi></msub></math> ：表示对闭合曲面 S 进行面积分（闭合曲面积分）</li><li><math><mover accent="true"><mi>𝐸</mi><mo stretchy="true">⃗</mo></mover></math> ：电场强度矢量</li><li><math><mi>𝑑</mi><mover accent="true"><mi>𝑆</mi><mo stretchy="true">⃗</mo></mover></math>：曲面上的面积元矢量，方向取曲面的外法向</li><li><math><msub><mi>𝑄</mi><mtext>enc</mtext></msub></math>：闭合曲面 S 内部所包围的净电荷（电荷的代数和）</li><li><math><msub><mi>𝜀</mi><mn>0</mn></msub></math> ：真空介电常数，约为 <math><mn>8.85</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup><mspace width="0.1667em"/><mtext>F</mtext><mspace width="0.1667em"/><msup><mtext>m</mtext><mrow><mo>−</mo><mn>1</mn></mrow></msup></math></li></ul><p><br>物理意义：</p><ul><li>高斯定理的积分形式表明：通过任意闭合曲面的电通量，等于该曲面内所包围的净电荷除以真空介电常数。</li></ul><p>这一定理揭示了几个重要性质：</p><ul><li>静电场是有源场：电场线始于正电荷、终于负电荷，电荷就是电场的“源”。</li><li>曲面外电荷对总通量无贡献：闭合曲面外部的电荷虽然会影响曲面上各点的电场强度，但它们穿入又穿出曲面，对总电通量的净贡献为零。</li><li>高斯面形状任意：闭合曲面可以是任意形状，只要完全包围所关心的电荷即可。</li></ul></div></figure><figure><div class="thmbox" style="border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>推论</strong> 1.a<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>电场线数目N必须正比于电荷量Q<br><br></p><ul><li>如果我们把每条电场线看作代表固定大小的电通量（比如 <math><mi mathvariant="normal">Δ</mi><msub><mi mathvariant="normal">Φ</mi><mi>𝐸</mi></msub></math>）</li><li>那么从电荷 Q 发出的总电场线数 N 满足：<math><mi>𝑁</mi><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><mi mathvariant="normal">Δ</mi><msub><mi mathvariant="normal">Φ</mi><mi>𝐸</mi></msub><mo>=</mo><mfrac><mrow><mo>|</mo><msub><mi>𝑄</mi><mtext>enc</mtext></msub><mo>|</mo></mrow><msub><mi>𝜀</mi><mn>0</mn></msub></mfrac></math></li><li>因此：<math><mi>𝑁</mi><mo>∝</mo><mrow><mo>|</mo><msub><mi>𝑄</mi><mtext>enc</mtext></msub><mo>|</mo></mrow></math></li></ul></div></figure><h2>库仑定律</h2><figure><div class="thmplain" style=" border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>例</strong> 2.a<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>在氢原子内，氢原子核与电子之间的最短距离为<math><mn>5.3</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>11</mn></mrow></msup></math> m。试比较氢原子核与电子之间的静电力和万有引力。<br><br></p><p>万有引力：</p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝐹</mi><mi>𝐺</mi></msub></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><mi>𝐺</mi><msub><mi>𝑚</mi><mi>𝑝</mi></msub><msub><mi>𝑚</mi><mi>𝑒</mi></msub></mrow><msup><mi>𝑟</mi><mn>2</mn></msup></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>3.62</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>47</mn></mrow></msup><mspace width="0.1667em"/><mtext>N</mtext></mtd></mtr></mtable></math><p>静电力：</p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝐹</mi><mi>𝐸</mi></msub></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><msub><mi>𝑘</mi><mi>𝑒</mi></msub><msub><mi>𝑄</mi><mi>𝑝</mi></msub><msub><mi>𝑄</mi><mi>𝑒</mi></msub></mrow><msup><mi>𝑟</mi><mn>2</mn></msup></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>8.21</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup><mspace width="0.1667em"/><mtext>N</mtext></mtd></mtr></mtable></math><p>静电力与万有引力之比：</p><math display="block"><mfrac><msub><mi>𝐹</mi><mi>𝐸</mi></msub><msub><mi>𝐹</mi><mi>𝐺</mi></msub></mfrac><mo>=</mo><mn>2.26</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mn>39</mn></msup><mspace width="0.1667em"/></math></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>例</strong> 2.b<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>真空中有三个带正电的点电荷，它们固定在边长为 50 cm 的等边三角形的三个顶点上，每个点电荷的电荷量都是 <math><mn>2.0</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup></math> C，求它们各自所受的静电力。<br><br></p><div style="width: 100%; margin: 10pt auto; display: flex; justify-content: center" class="typst-diagram"><svg style="overflow: visible; width: 19.252463422em; height: 15.937143838em; display: block" viewBox="0 0 211.777097638 175.308582215" width="211.777097638pt" height="175.308582215pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g><path fill="none" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(30.648 29.812)" d="M 0 0m 42.519685039 0l -42.519685039 73.64625481h 85.039370079l -42.519685039 -73.64625481Z "/><path fill="none" transform="translate(57.843685039)" d="M 0 0h 30.648v 29.812h -30.648v -29.812Z "/><g transform="translate(57.843684945 -1.26e-7)"><g transform="matrix(1 0 0 -1 10 17.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g38178746B45E40B27C1ECDAD3F62C0A9" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(0 88.55225481)" d="M 0 0h 30.648v 29.812h -30.648v -29.812Z "/><g transform="translate(-9.4e-8 88.552254684)"><g transform="matrix(1 0 0 -1 10 17.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g5BA3B744496DE638A69C45D17B8B8178" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(100.363370079 73.64625481)" d="M 0 0h 30.648v 29.812h -30.648v -29.812Z "/><g transform="translate(100.363369984 73.646254684)"><g transform="matrix(1 0 0 -1 10 17.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g95E62ABD17097D047789BD4F75E52D9B" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(124.164712598 140.281382215)" d="M 0 0h 25.565v 17.348h -25.565v -17.348Z "/><g transform="translate(124.164712512 140.281382199)"><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g3BC6300649CA32A3B6F5E66435D77781" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g38178746B45E40B27C1ECDAD3F62C0A9" x="5.335" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g95E62ABD17097D047789BD4F75E52D9B" x="10.45" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(145.424555118 86.11025481)" d="M 0 0h 25.565v 17.348h -25.565v -17.348Z "/><g transform="translate(145.424555031 86.110254794)"><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g3BC6300649CA32A3B6F5E6643 ><msub><mi>𝑘</mi><mi>𝑒</mi></msub><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><msup><mi>𝑟</mi><mn>2</mn></msup></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>8.98</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mn>9</mn></msup><mspace width="0.1667em"/><mtext>m</mtext><msup><mtext>F</mtext><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><mfrac><msup><mrow><mo>(</mo><mrow><mn>2</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup><mspace width="0.1667em"/><mtext>C</mtext></mrow><mo>)</mo></mrow><mn>2</mn></msup><msup><mrow><mo>(</mo><mrow><mn>5</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>1</mn></mrow></msup><mspace width="0.1667em"/><mtext>m</mtext></mrow><mo>)</mo></mrow><mn>2</mn></msup></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>0.144</mn><mspace width="0.2222em"/><mtext>N</mtext></mtd></mtr></mtable></math><p>记 q3受到的静电力合力为<math><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mtext>total</mtext></msub></math>，由图中的几何关系可知：</p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mtext>total</mtext></msub></mtd><mtd><mo form="infix">=</mo><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>13</mn></msub><mo>+</mo><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>23</mn></msub></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><msqrt><mn>3</mn></msqrt><mrow><mo>‖</mo><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>13</mn></msub><mo>‖</mo></mrow></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>0.25</mn><mspace width="0.2222em"/><mtext>N</mtext></mtd></mtr></mtable></math><p>如图所示，<math><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mtext>total</mtext></msub></math>的方向为向外的角平分线方向。<br>由对称关系可知 q1 和 q2的静电力合力的大小等于<math><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mtext>total</mtext></msub></math>的大小，方向为各自所在点处向外的角平分线方向。</p></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>问题</strong> 2.a<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>有三个完全相同的金属球，球A 带的电荷量为q，球B 和球C 均不带电。现要使球B 带 的电荷量为 <math><mfrac><mrow><mn>3</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac></math> ，应该怎么操作？<br><br></p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><mfrac><mrow><mn>3</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><mfrac><mrow><mn>2</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac><mo>+</mo><mfrac><mrow><mn>4</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac></mrow><mn>2</mn></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><mfrac><mi>𝑞</mi><mn>4</mn></mfrac><mo>+</mo><mfrac><mi>𝑞</mi><mn>2</mn></mfrac></mrow><mn>2</mn></mfrac></mtd></mtr></mtable></math><p>先让球A与B接触，使球A和球B带电 <math><mfrac><mi>𝑞</mi><mn>2</mn></mfrac></math>，再让球B与C接触，使球B和球C带电 <math><mfrac><mi>𝑞</mi><mn>4</mn></mfrac></math>，再让球B与球A接触，使球A和球B带电 <math><mfrac><mrow><mn>3</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac></math>。</p></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>问题</strong> 2.b<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>半径为r 的两个金属球，其球心相距3r，现使两球带上等量的同种电荷Q，两球之间的 静电力<math><mi>𝐹</mi><mo>=</mo><mi>𝑘</mi><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><mrow><mn>9</mn><msup><mi>𝑟</mi><mn>2</mn></msup></mrow></mfrac></math>吗？说明理由。<br><br></p><ul><li>由于两球距离仅为半径的三倍，不可使用点电荷模型。</li><li>由于静电感应，而且同种电荷相互排斥，电荷分布会集中在两球外侧（相背的一面）。使得电荷之间的等效距离大于3r，从而导致静电力小于<math><mi>𝐹</mi><mo>=</mo><mi>𝑘</mi><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><mrow><mn>9</mn><msup><mi>𝑟</mi><mn>2</mn></msup></mrow></mfrac></math>。</li></ul></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>问题</strong> 2.c<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>真空中两个相同的带等量异种电荷的金属小球A 和B（均可看作点电荷），分别固定在 两处，两球之间的静电力为F。现用一个不带电的同样的金属小球C 先与A 接触，再与B 接触，然后移开C，此时A、B 之间的静电力变为多少？若再使A、B 之间距离增大为原来的2倍，则它们之间的静电力又为多少？<br><br>设接触前 <math><msub><mi>𝑄</mi><mi>𝐴</mi></msub><mo>=</mo><mi>𝑄</mi></math>，<math><msub><mi>𝑄</mi><mi>𝐵</mi></msub><mo>=</mo><mo form="prefix">−</mo><mi>𝑄</mi></math>，<math><msub><mi>𝑄</mi><mi>𝐶</mi></msub><mo>=</mo><mn>0</mn></math>，<math><msub><mi>𝐹</mi><mtext>AB</mtext></msub><mo>=</mo><mo form="prefix">−</mo><mi>𝑘</mi><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><msubsup><mi>𝑑</mi><mtext>AB</mtext><mn>2</mn></msubsup></mfrac></math><br></p><ol><li>球C与A接触后：<math><msubsup><mi>𝑄</mi><mi>𝐴</mi><mo>′</mo></msubsup><mo>=</mo><msubsup><mi>𝑄</mi><mi>𝐶</mi><mo>′</mo></msubsup><mo>=</mo><mfrac><mi>𝑄</mi><mn>2</mn></mfrac></math>，<math><msubsup><mi>𝑄</mi><mi>𝐵</mi><mo>′</mo></msubsup><mo>=</mo><mo form="prefix">−</mo><mi>𝑄</mi></math><br></li><li>球C与B接触后：<math><msubsup><mi>𝑄</mi><mi>𝐴</mi><mo>″</mo></msubsup><mo>=</mo><mfrac><mi>𝑄</mi><mn>2</mn></mfrac></math>，<math><msubsup><mi>𝑄</mi><mi>𝐵</mi><mo>″</mo></msubsup><mo>=</mo><msubsup><mi>𝑄</mi><mi>𝐶</mi><mo>″</mo></msubsup><mo>=</mo><mo form="prefix">−</mo><mfrac><mi>𝑄</mi><mn>4</mn></mfrac></math><br>此时的静电力为<math><msubsup><mi>𝐹</mi><mtext>AB</mtext><mo>″</mo></msubsup><mo>=</mo><mo form="prefix">−</mo><mi>𝑘</mi><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><mrow><mn>8</mn><msubsup><mi>𝑑</mi><mtext>AB</mtext><mn>2</mn></msubsup></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><msub><mi>𝐹</mi><mtext>AB</mtext></msub></math></li><li>如果再将A、B 之间距离增大为原来的2倍，即：<math><msubsup><mi>𝑑</mi><mtext>AB</mtext><mo>‴</mo></msubsup><mo>=</mo><mn>2</mn><msub><mi>𝑑</mi><mtext>AB</mtext></msub></math> 则：<math><msubsup><mi>𝐹</mi><mtext>AB</mtext><mo>‴</mo></msubsup><mo>=</mo><mfrac><mn>1</mn><mn>32</mn></mfrac><msub><mi>𝐹</mi><mtext>AB</mtext></msub></math></li></ol></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #aaaaaa; border-radius: 10px; background: #f1f1f1; padding: 0.8em;"><p><strong>问题</strong> 2.d<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>在边长为a 的正方形的每个顶点都放置一个电荷量为q 的同种点电荷。如果保持它们的位置不变，每个电荷受到其他三个电荷的静电力的合力是多少？<br><br></p><div style="width: 100%; margin: 10pt auto; display: flex; justify-content: center" class="typst-diagram"><svg style="overflow: visible; width: 15.691em; height: 17.87013486em; display: block" viewBox="0 0 172.601 196.571483465" width="172.601pt" height="196.571483465pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g transform="translate(6.838486614)"><path fill="none" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(10.324 19.812)" d="M 0 0m 0 56.692913386h 56.692913386v -56.692913386h -56.692913386v 56.692913386Z "/><path fill="none" transform="translate(0 76.504913386)" d="M 0 0h 20.648v 19.812h -20.648v -19.812Z "/><g transform="translate(-6.3e-8 76.504913291)"><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g38178746B45E40B27C1ECDAD3F62C0A9" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(46.368913386 76.504913386)" d="M 0 0h 20.648v 19.812h -20.648v -19.812Z "/><g transform="translate(46.368913323 76.504913291)"><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g5BA3B744496DE638A69C45D17B8B817
